<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>World Country Challenge</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">

<style>
:root {
  --navy:#34496f;
  --navy-dark:#17243b;
  --navy-soft:#425a86;
  --water:#a9d8e4;
  --land:#228947;
  --land-dark:#147238;
  --border:#9bd4dd;
  --correct:#f4cf58;
  --wrong:#ee5568;
  --white:#fff;
  --text:#f8fbff;
  --muted:#bfcce0;
  --panel:#0f1b2f;
  --shadow:0 18px 60px rgba(13,28,52,.25);
}

* { box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:'Nunito', system-ui, sans-serif;
  background:var(--water);
}

button, select { font:inherit; }

#app {
  width:100%;
  height:100%;
  position:relative;
  background:var(--water);
}

#map {
  position:absolute;
  inset:82px 0 0 0;
  background:var(--water);
}

.leaflet-container {
  background:var(--water);
  font-family:'Nunito', sans-serif;
}

.leaflet-control-attribution {
  background:rgba(255,255,255,.78)!important;
  color:#29415e!important;
  font-size:9px!important;
}

.topbar {
  position:absolute;
  top:0; left:0; right:0;
  height:82px;
  z-index:500;
  display:grid;
  grid-template-columns:1fr minmax(300px, 1.4fr) 1fr;
  align-items:center;
  gap:12px;
  padding:0 18px;
  background:linear-gradient(180deg, #3c527d 0%, var(--navy) 100%);
  color:var(--white);
  box-shadow:0 2px 0 rgba(255,255,255,.06);
}

.stats {
  justify-self:start;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:900;
  font-style:italic;
  letter-spacing:.02em;
}

.stats-box {
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 15px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.06);
}

.stats-divider {
  width:1px; height:24px;
  background:rgba(255,255,255,.28);
}

.prompt {
  justify-self:center;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  min-width:0;
  font-size:21px;
  font-weight:900;
  font-style:italic;
  white-space:nowrap;
}

.prompt-prefix {
  color:#e3e9f3;
  opacity:.95;
}

.country-chip {
  max-width:min(360px, 38vw);
  overflow:hidden;
  text-overflow:ellipsis;
  padding:8px 13px 9px;
  border-radius:13px;
  background:#102a5f;
  color:#fff;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  font-size:25px;
  line-height:1;
}

.skip-btn {
  width:42px; height:42px;
  border:none;
  border-radius:12px;
  background:transparent;
  color:#b7c5da;
  font-size:26px;
  font-weight:900;
  cursor:pointer;
  transition:.15s ease;
}
.skip-btn:hover { color:#fff; background:rgba(255,255,255,.08); }

.right-tools {
  justify-self:end;
  display:flex;
  align-items:center;
  gap:12px;
}

.flag {
  width:78px;
  text-align:center;
  font-size:43px;
  line-height:1;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.12));
}

.timer {
  min-width:86px;
  text-align:center;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:13px;
  font-size:18px;
  font-weight:900;
  font-style:italic;
}

.close-btn {
  width:42px; height:42px;
  display:grid; place-items:center;
  border:0;
  background:transparent;
  color:#b9c7dc;
  font-size:30px;
  cursor:pointer;
  border-radius:12px;
}
.close-btn:hover { color:white; background:rgba(255,255,255,.08); }

.map-message {
  position:absolute;
  left:50%;
  top:100px;
  z-index:450;
  transform:translate(-50%, -12px);
  opacity:0;
  pointer-events:none;
  padding:10px 16px;
  border-radius:999px;
  background:rgba(18,33,54,.9);
  color:white;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 34px rgba(0,0,0,.18);
  font-weight:900;
  transition:.18s ease;
}
.map-message.show {
  opacity:1;
  transform:translate(-50%, 0);
}

.setup {
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  padding:18px;
  background:
    radial-gradient(circle at 20% 15%, rgba(74,118,194,.24), transparent 35%),
    rgba(9,18,31,.88);
  backdrop-filter:blur(10px);
}

.setup.hidden { display:none; }

.setup-card {
  width:min(820px, 96vw);
  border-radius:26px;
  overflow:hidden;
  background:linear-gradient(180deg, #162641 0%, #0c1728 100%);
  color:white;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
}

.setup-head {
  padding:28px 30px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  border-bottom:1px solid rgba(255,255,255,.09);
}

.setup-title-wrap h1 {
  margin:0;
  font-size:34px;
  letter-spacing:-.035em;
}
.setup-title-wrap p {
  margin:6px 0 0;
  color:#b8c8db;
  font-size:14px;
}

.logo-badge {
  width:62px; height:62px;
  flex:0 0 auto;
  border-radius:20px;
  display:grid; place-items:center;
  font-size:30px;
  font-weight:900;
  background:linear-gradient(145deg, #f4cf58, #ef8b3f);
  color:#1b2940;
}

.setup-body {
  padding:24px 30px 28px;
}

.setup-label {
  display:block;
  margin-bottom:10px;
  color:#dce7f3;
  font-weight:900;
  font-size:13px;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.region-grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  margin-bottom:18px;
}

.region-btn {
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);
  color:#c7d4e4;
  min-height:64px;
  border-radius:16px;
  padding:10px;
  text-align:left;
  cursor:pointer;
  transition:.16s ease;
}

.region-btn:hover {
  transform:translateY(-1px);
  background:rgba(255,255,255,.09);
}

.region-btn.active {
  border-color:#f4cf58;
  background:rgba(244,207,88,.12);
  color:#fff;
  box-shadow:inset 0 0 0 1px rgba(244,207,88,.18);
}

.region-name {
  display:block;
  font-size:16px;
  font-weight:900;
}
.region-count {
  display:block;
  margin-top:3px;
  color:#90a8c4;
  font-size:11px;
  font-weight:800;
}
.region-btn.active .region-count { color:#f6dfa0; }

.setup-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-top:12px;
  padding:12px 14px;
  border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

.setup-row strong {
  display:block;
  font-size:13px;
}
.setup-row span {
  color:#99acc3;
  font-size:11px;
}

.toggle {
  width:50px; height:28px;
  padding:3px;
  border:0;
  border-radius:999px;
  background:#33445c;
  cursor:pointer;
}
.toggle::after {
  content:"";
  display:block;
  width:22px; height:22px;
  border-radius:50%;
  background:white;
  transition:transform .16s ease;
}
.toggle.on { background:#28b76d; }
.toggle.on::after { transform:translateX(22px); }

.start-btn {
  width:100%;
  min-height:54px;
  margin-top:18px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg, #f7d86d, #f0a145);
  color:#17233a;
  font-weight:900;
  font-size:17px;
  cursor:pointer;
  box-shadow:0 14px 30px rgba(239,161,69,.16);
}

.summary {
  position:fixed;
  inset:0;
  z-index:1100;
  display:grid;
  place-items:center;
  padding:18px;
  background:rgba(8,16,28,.84);
  backdrop-filter:blur(9px);
}
.summary.hidden { display:none; }

.summary-card {
  width:min(560px, 94vw);
  border-radius:24px;
  padding:30px;
  background:linear-gradient(180deg,#172942,#0c1728);
  color:white;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:var(--shadow);
  text-align:center;
}

.summary-icon {
  font-size:46px;
  margin-bottom:6px;
}
.summary-card h2 {
  margin:0;
  font-size:32px;
}
.summary-card p {
  margin:6px 0 22px;
  color:#aebed2;
}

.summary-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:18px;
}
.metric {
  padding:13px 10px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}
.metric small {
  display:block;
  color:#8fa4bf;
  font-size:10px;
  font-weight:900;
  letter-spacing:.07em;
  text-transform:uppercase;
  margin-bottom:4px;
}
.metric strong {
  font-size:20px;
}

.summary-actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.action-btn {
  min-height:48px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  font-weight:900;
  color:white;
  background:#2f466b;
}
.action-btn.primary {
  color:#18243a;
  background:linear-gradient(135deg,#f7d86d,#f0a145);
}

.tiny-country-marker {
  background:transparent!important;
  border:none!important;
}

.tiny-dot {
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--land);
  border:1.5px solid var(--border);
  box-shadow:0 0 0 2px rgba(255,255,255,.0);
  transition:.12s ease;
}
.tiny-dot:hover {
  background:var(--land-dark);
  transform:scale(1.28);
}

.tiny-dot.correct {
  background:var(--correct)!important;
  border-color:white!important;
  box-shadow:0 0 0 4px rgba(244,207,88,.28);
}
.tiny-dot.wrong {
  background:var(--wrong)!important;
  border-color:white!important;
  box-shadow:0 0 0 4px rgba(238,85,104,.22);
}

@media (max-width:760px) {
  .topbar {
    height:72px;
    grid-template-columns:auto 1fr auto;
    padding:0 8px;
    gap:7px;
  }
  #map { inset:72px 0 0 0; }
  .stats { font-size:14px; }
  .stats-box { gap:6px; padding:7px 8px; border-radius:11px; }
  .stats-divider { height:17px; }
  .prompt { gap:6px; font-size:13px; min-width:0; }
  .country-chip {
    max-width:35vw;
    font-size:17px;
    padding:6px 8px;
    border-radius:9px;
  }
  .skip-btn { width:30px; height:34px; font-size:19px; }
  .right-tools { gap:5px; }
  .flag { width:42px; font-size:29px; }
  .timer { min-width:58px; padding:5px 6px; font-size:12px; border-radius:9px; }
  .close-btn { width:30px; height:34px; font-size:23px; }
  .region-grid { grid-template-columns:1fr 1fr; }
  .setup-head { padding:20px 20px 16px; }
  .setup-title-wrap h1 { font-size:27px; }
  .setup-title-wrap p { font-size:12px; }
  .logo-badge { width:48px; height:48px; border-radius:15px; font-size:23px; }
  .setup-body { padding:18px 20px 22px; }
  .region-btn { min-height:56px; }
  .summary-grid { grid-template-columns:1fr; }
  .summary-actions { grid-template-columns:1fr; }
}

@media (max-width:430px) {
  .prompt-prefix { display:none; }
  .country-chip { max-width:42vw; }
  .flag { display:none; }
}
</style>
</head>

<body>
<div id="app">

  <header class="topbar">
    <div class="stats">
      <div class="stats-box">
        <span id="progressText">0 / 0</span>
        <span class="stats-divider"></span>
        <span id="accuracyText">0%</span>
      </div>
    </div>

    <div class="prompt">
      <span class="prompt-prefix">Click on</span>
      <span class="country-chip" id="countryName">—</span>
      <button class="skip-btn" id="skipBtn" title="Skip this country" aria-label="Skip this country">⏭</button>
    </div>

    <div class="right-tools">
      <div class="flag" id="flag">🌍</div>
      <div class="timer" id="timer">00:00</div>
      <button class="close-btn" id="closeBtn" title="End game" aria-label="End game">×</button>
    </div>
  </header>

  <div id="map"></div>
  <div class="map-message" id="mapMessage"></div>

  <section class="setup" id="setup">
    <div class="setup-card">
      <div class="setup-head">
        <div class="setup-title-wrap">
          <h1>World Country Challenge</h1>
          <p>Pick a region, then identify every country by clicking the map.</p>
        </div>
        <div class="logo-badge">🌍</div>
      </div>

      <div class="setup-body">
        <span class="setup-label">Choose a region</span>
        <div class="region-grid" id="regionGrid"></div>

        <div class="setup-row">
          <div>
            <strong>Shuffle questions</strong>
            <span>Countries appear in a random order each game.</span>
          </div>
          <button class="toggle on" id="shuffleToggle" aria-label="Toggle shuffle"></button>
        </div>

        <button class="start-btn" id="startBtn">Start Challenge →</button>
      </div>
    </div>
  </section>

  <section class="summary hidden" id="summary">
    <div class="summary-card">
      <div class="summary-icon" id="summaryIcon">🏆</div>
      <h2 id="summaryTitle">Region complete!</h2>
      <p id="summaryCopy"></p>

      <div class="summary-grid">
        <div class="metric"><small>Countries</small><strong id="summaryCorrect">0</strong></div>
        <div class="metric"><small>Accuracy</small><strong id="summaryAccuracy">0%</strong></div>
        <div class="metric"><small>Time</small><strong id="summaryTime">00:00</strong></div>
      </div>

      <div class="summary-actions">
        <button class="action-btn" id="practiceBtn">Practice missed</button>
        <button class="action-btn primary" id="playAgainBtn">Play again</button>
      </div>
    </div>
  </section>
</div>

const REGION_META = {
  "World Tour": { label:"World", icon:"🌍", bounds:[[30,10],2] },
  "Americas": { label:"Americas", icon:"🌎", bounds:[[56,-168],[-58,-30]] },
  "Europe": { label:"Europe", icon:"🌍", bounds:[[72,-25],[32,48]] },
  "Africa": { label:"Africa", icon:"🌍", bounds:[[39,-22],[-38,55]] },
  "Asia": { label:"Asia", icon:"🌏", bounds:[[75,25],[-12,155]] },
  "Oceania": { label:"Oceania", icon:"🌏", bounds:[[15,105],[-55,180]] }
};

const TINY_COUNTRIES = new Set([
  "Vatican","Monaco","San Marino","Liechtenstein","Andorra","Malta",
  "Singapore","Bahrain","Luxembourg","St. Kitts and Nevis","Dominica",
  "Grenada","Saint Lucia","St. Vin. and Gren.","Barbados","Nauru",
  "Tuvalu","Marshall Islands","Micronesia","Maldives","Seychelles",
  "Comoros","São Tomé and Principe","Mauritius","Cape Verde"
]);

const map = L.map("map", {
  renderer:L.canvas(),
  worldCopyJump:true,
  minZoom:2,
  maxZoom:8,
  maxBounds:[[-85,-180],[85,180]],
  maxBoundsViscosity:1
}).setView([30,10],2);

L.control.attribution({prefix:false}).addAttribution("Country boundaries: Natural Earth / world.geo.json").addTo(map);

const els = {
  setup:document.getElementById("setup"),
  regionGrid:document.getElementById("regionGrid"),
  startBtn:document.getElementById("startBtn"),
  shuffleToggle:document.getElementById("shuffleToggle"),
  progressText:document.getElementById("progressText"),
  accuracyText:document.getElementById("accuracyText"),
  countryName:document.getElementById("countryName"),
  flag:document.getElementById("flag"),
  timer:document.getElementById("timer"),
  skipBtn:document.getElementById("skipBtn"),
  closeBtn:document.getElementById("closeBtn"),
  mapMessage:document.getElementById("mapMessage"),
  summary:document.getElementById("summary"),
  summaryIcon:document.getElementById("summaryIcon"),
  summaryTitle:document.getElementById("summaryTitle"),
  summaryCopy:document.getElementById("summaryCopy"),
  summaryCorrect:document.getElementById("summaryCorrect"),
  summaryAccuracy:document.getElementById("summaryAccuracy"),
  summaryTime:document.getElementById("summaryTime"),
  practiceBtn:document.getElementById("practiceBtn"),
  playAgainBtn:document.getElementById("playAgainBtn")
};

let countriesData = {};
let geojson = null;
let tinyLayer = L.layerGroup().addTo(map);
let layerByName = new Map();

let currentRegion = "Europe";
let shuffleQuestions = true;
let questions = [];
let current = null;
let completed = 0;
let attempts = 0;
let wrongAttempts = 0;
let missed = new Set();
let correctCountries = new Set();
let gameRunning = false;
let startedAt = 0;
let timerId = null;
let questionLocked = false;

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function flagEmoji(code) {
  if(!code || code.length!==2) return "🌍";
  return code.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt()));
}

function formatTime(sec) {
  sec=Math.max(0,Math.floor(sec));
  const m=String(Math.floor(sec/60)).padStart(2,"0");
  const s=String(sec%60).padStart(2,"0");
  return `${m}:${s}`;
}

function showMessage(text, ms=1100) {
  els.mapMessage.textContent=text;
  els.mapMessage.classList.add("show");
  clearTimeout(showMessage._t);
  showMessage._t=setTimeout(()=>els.mapMessage.classList.remove("show"),ms);
}

function setRegionView(region) {
  const meta=REGION_META[region];
  if(region==="World Tour") {
    map.setView(meta.bounds[0], meta.bounds[1], {animate:true});
  } else {
    map.fitBounds(meta.bounds, {padding:[20,20], animate:true});
  }
}

function renderRegionButtons() {
  els.regionGrid.innerHTML="";
  Object.entries(REGION_META).forEach(([key,meta])=>{
    const count = key==="World Tour"
      ? Object.keys(countriesData).length
      : Object.values(countriesData).filter(c=>c.region===key).length;

    const btn=document.createElement("button");
    btn.className="region-btn"+(key===currentRegion?" active":"");
    btn.dataset.region=key;
    btn.innerHTML=`
      <span class="region-name">${meta.icon} ${meta.label}</span>
      <span class="region-count">${count} countries</span>
    `;
    btn.addEventListener("click",()=>{
      currentRegion=key;
      [...els.regionGrid.children].forEach(b=>b.classList.toggle("active",b===btn));
    });
    els.regionGrid.appendChild(btn);
  });
}

function countryFeatures() {
  return Object.values(countriesData).map(c=>({
    type:"Feature",
    properties:{name:c.name},
    geometry:c.geometry
  }));
}

function baseStyle(feature) {
  const name = feature?.properties?.name;
  const isCorrect = correctCountries.has(name);

  return {
    fillColor: isCorrect ? "#e5bd45" : "#228947",
    fillOpacity: 1,
    color: isCorrect ? "#fff3c4" : "#9bd4dd",
    weight: isCorrect ? 1.35 : 0.8,
    opacity: 1
  };
}

function addTinyMarkers() {
  tinyLayer.clearLayers();

  TINY_COUNTRIES.forEach(name=>{
    const data=countriesData[name];
    const layer=layerByName.get(name);
    if(!data || !layer) return;

    const center=layer.getBounds().getCenter();
    const icon=L.divIcon({
      className:"tiny-country-marker",
      html:`<div class="tiny-dot" data-country="${name.replaceAll('"','&quot;')}"></div>`,
      iconSize:[14,14],
      iconAnchor:[7,7]
    });

    const marker=L.marker(center,{icon,interactive:true,keyboard:true});
    marker.countryName=name;
    marker.on("click",e=>{
      L.DomEvent.stopPropagation(e);
      handleCountryClick(name, marker);
    });
    marker.addTo(tinyLayer);
  });
}

function syncTinyCountryStyles() {
  document.querySelectorAll(".tiny-dot").forEach(el => {
    const name = el.dataset.country;
    el.classList.toggle("correct", correctCountries.has(name));
    el.classList.remove("wrong");
  });
}

function resetAllStyles() {
  if(geojson) geojson.setStyle(baseStyle);
  syncTinyCountryStyles();
}

function flashLayer(name, kind) {
  const layer=layerByName.get(name);
  if(layer) {
    const style = kind==="correct"
      ? {fillColor:"#f4cf58",fillOpacity:1,color:"#ffffff",weight:2.5}
      : {fillColor:"#ee5568",fillOpacity:1,color:"#ffffff",weight:2.5};
    layer.setStyle(style);
    layer.bringToFront();

    setTimeout(() => {
      if (geojson && gameRunning) geojson.resetStyle(layer);
    }, kind==="correct" ? 520 : 380);
  }

  document.querySelectorAll(`.tiny-dot[data-country="${CSS.escape(name)}"]`).forEach(el => {
    if (kind === "correct") {
      el.classList.add("correct");
      el.classList.remove("wrong");
    } else {
      el.classList.add("wrong");
      setTimeout(() => {
        el.classList.remove("wrong");
        if (correctCountries.has(name)) el.classList.add("correct");
      }, 380);
    }
  });
}

function updateHUD() {
  const total = completed + questions.length + (current ? 1 : 0);
  els.progressText.textContent=`${completed} / ${total}`;
  const accuracy = attempts ? Math.round((completed/attempts)*100) : 0;
  els.accuracyText.textContent=`${accuracy}%`;

  if(current) {
    els.countryName.textContent=current.name;
    els.flag.textContent=flagEmoji(current.cca2);
  } else {
    els.countryName.textContent="—";
    els.flag.textContent="🌍";
  }
}

function beginTimer() {
  clearInterval(timerId);
  startedAt=Date.now();
  els.timer.textContent="00:00";
  timerId=setInterval(()=>{
    els.timer.textContent=formatTime((Date.now()-startedAt)/1000);
  },250);
}

function currentElapsed() {
  return (Date.now()-startedAt)/1000;
}

function nextQuestion() {
  questionLocked=false;

  if(!questions.length) {
    current=null;
    updateHUD();
    finishGame();
    return;
  }

  current=questions.shift();
  updateHUD();

  // Keep regional context stable, except for very tiny island states.
  const layer=layerByName.get(current.name);
  if(layer && ["Oceania"].includes(current.region) && TINY_COUNTRIES.has(current.name)) {
    const b=layer.getBounds();
    if(!map.getBounds().contains(b.getCenter())) {
      map.flyTo(b.getCenter(), Math.max(map.getZoom(),4), {duration:.45});
    }
  }
}

function handleCountryClick(name, clickedLayer=null) {
  if(!gameRunning || questionLocked || !current) return;

  attempts++;

  if(name===current.name) {
    questionLocked=true;
    completed++;
    correctCountries.add(name);
    flashLayer(name,"correct");
    showMessage("Correct! ✓",620);
    setTimeout(nextQuestion,650);
  } else {
    wrongAttempts++;
    missed.add(current.name);
    flashLayer(name,"wrong");
    showMessage(`That was ${name}`,850);
    updateHUD();
  }
}

function skipCurrent() {
  if(!gameRunning || questionLocked || !current) return;
  questionLocked=true;
  attempts++;
  wrongAttempts++;
  missed.add(current.name);
  completed++;
  flashLayer(current.name,"wrong");
  showMessage(`Skipped: ${current.name}`,900);
  setTimeout(nextQuestion,950);
}

function buildQuestionSet(region, onlyNames=null) {
  let list=Object.values(countriesData);
  if(region!=="World Tour") list=list.filter(c=>c.region===region);
  if(onlyNames) list=list.filter(c=>onlyNames.has(c.name));
  return shuffleQuestions ? shuffle(list) : list.sort((a,b)=>a.name.localeCompare(b.name));
}

function startGame(onlyMissed=false) {
  const missedCopy = new Set(missed);

  // Correct countries stay gold for the current game, but a brand-new run
  // starts with a clean green map.
  correctCountries = new Set();
  resetAllStyles();
  questions = onlyMissed
    ? buildQuestionSet(currentRegion, missedCopy)
    : buildQuestionSet(currentRegion);

  if(!questions.length) {
    showMessage("No countries to practice yet.");
    return;
  }

  completed=0;
  attempts=0;
  wrongAttempts=0;
  if(!onlyMissed) missed=new Set();
  gameRunning=true;
  questionLocked=false;

  els.setup.classList.add("hidden");
  els.summary.classList.add("hidden");

  setRegionView(currentRegion);
  beginTimer();
  current=null;
  nextQuestion();
}

function finishGame() {
  gameRunning=false;
  clearInterval(timerId);
  const elapsed=currentElapsed();
  const accuracy=attempts?Math.round((completed/attempts)*100):100;
  const total=completed;

  els.summaryCorrect.textContent=String(total);
  els.summaryAccuracy.textContent=`${accuracy}%`;
  els.summaryTime.textContent=formatTime(elapsed);

  if(accuracy>=95) {
    els.summaryIcon.textContent="🏆";
    els.summaryTitle.textContent="Outstanding!";
    els.summaryCopy.textContent=`You completed ${REGION_META[currentRegion].label} with elite accuracy.`;
  } else if(accuracy>=80) {
    els.summaryIcon.textContent="🌍";
    els.summaryTitle.textContent="Region complete!";
    els.summaryCopy.textContent=`Strong work across ${REGION_META[currentRegion].label}.`;
  } else {
    els.summaryIcon.textContent="🧭";
    els.summaryTitle.textContent="Region complete!";
    els.summaryCopy.textContent="A few more passes and those country shapes will stick.";
  }

  els.practiceBtn.disabled = missed.size===0;
  els.practiceBtn.style.opacity = missed.size===0 ? ".45" : "1";
  els.summary.classList.remove("hidden");
}

function endGame() {
  gameRunning=false;
  clearInterval(timerId);
  current=null;
  updateHUD();
  els.summary.classList.add("hidden");
  els.setup.classList.remove("hidden");
  setTimeout(()=>map.invalidateSize(),50);
}

els.shuffleToggle.addEventListener("click",()=>{
  shuffleQuestions=!shuffleQuestions;
  els.shuffleToggle.classList.toggle("on",shuffleQuestions);
});

els.startBtn.addEventListener("click",()=>startGame(false));
els.skipBtn.addEventListener("click",skipCurrent);
els.closeBtn.addEventListener("click",endGame);
els.playAgainBtn.addEventListener("click",()=>{
  els.summary.classList.add("hidden");
  els.setup.classList.remove("hidden");
});
els.practiceBtn.addEventListener("click",()=>{
  if(missed.size) startGame(true);
});

Promise.all([
  fetch("https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json").then(r=>r.json()),
  fetch("https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson").then(r=>r.json())
])
.then(([stable, highres])=>{
  const factsMap=new Map(countryFacts.map(f=>[f.name.common,f]));

  highres.features.forEach(feature=>{
    const countryName=feature.properties.ADMIN;
    const fact=factsMap.get(countryName);
    if(fact) countriesData[countryName]={...fact,geometry:feature.geometry,name:countryName};
  });

  stable.features.forEach(feature=>{
    const countryName=feature.properties.name;
    const fact=factsMap.get(countryName);
    if(fact && !countriesData[countryName]) {
      countriesData[countryName]={...fact,geometry:feature.geometry,name:countryName};
    }
  });

  const collection={type:"FeatureCollection",features:countryFeatures()};
  geojson=L.geoJson(collection,{
    style:baseStyle,
    onEachFeature:(feature,layer)=>{
      const name=feature.properties.name;
      layerByName.set(name,layer);
      layer.on({
        mouseover:()=>{
          if(gameRunning && !questionLocked) layer.setStyle({fillColor:"#18783d",weight:1.4,color:"#d8f2f4"});
        },
        mouseout:()=>{
          if(geojson && gameRunning) geojson.resetStyle(layer);
        },
        click:()=>handleCountryClick(name,layer)
      });
    }
  }).addTo(map);

  addTinyMarkers();
  renderRegionButtons();
  setRegionView(currentRegion);
  updateHUD();

  setTimeout(()=>map.invalidateSize(),50);
})
.catch(err=>{
  console.error(err);
  els.startBtn.disabled=true;
  els.startBtn.textContent="Map data could not load";
});
</script>
</body>
</html>
