<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacGregor Maltais Magic Writer Spark 3.0</title>
    <link rel="stylesheet" href="app.css?v=20261005">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../learning-shared/react18.min.js"></script>
    <script src="../learning-shared/react-dom18.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Indie+Flower&family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, hsla(225,39%,30%,0) 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, hsla(339,49%,30%,0) 50%);
        }
        
        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .handwritten {
            font-family: 'Indie Flower', cursive;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .drag-target-active {
            border-color: #6366f1 !important;
            background-color: #eef2ff !important;
            transform: scale(1.01);
        }
    </style>
<style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lexend:wght@400;500;600;700&display=swap');body{font-family:Nunito,system-ui,sans-serif!important;background:#f8f6ef!important;background-image:none!important}h1,h2,h3,.font-heading{font-family:Lexend,system-ui,sans-serif!important}.glass-panel{background:#fff!important;backdrop-filter:none!important}button,input,select,textarea,[role=button]{touch-action:manipulation}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #087ba4;outline-offset:4px}textarea{line-height:1.6!important}header h1{font-size:clamp(1rem,2vw,1.6rem)!important}button{min-height:40px}.draft-bar{padding:8px 18px;background:#e8f3ee;color:#205a50;font:700 .85rem Nunito,sans-serif;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.draft-bar button{padding:5px 12px;background:#fff;border:1px solid #9dc9bc;border-radius:8px}.bg-gradient-to-br,.bg-gradient-to-r{background-image:none!important}.bg-gradient-to-br{background-color:#5b47a1!important}.text-transparent.bg-clip-text{color:#493786!important}.animate-float,.animate-pulse{animation:none!important}@media(max-width:600px){header>div{flex-wrap:wrap;gap:12px!important}header{position:relative!important}h1{max-width:100%;overflow-wrap:anywhere}.h-screen{height:auto!important;min-height:100dvh}.w-screen{width:100%!important}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{header,button,.no-print{display:none!important}body,#root,.h-screen{height:auto!important;overflow:visible!important}.draft-bar{display:none!important}}</style></head>
<body>
    <div id="root"></div>

    <script src="app.js?v=20261005"></script>
</body>
</html>
