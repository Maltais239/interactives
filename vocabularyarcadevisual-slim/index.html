/* Match Master: a tactile, free-moving card table. */
.game-stage.match-stage{max-width:1320px;padding:18px;background:#fffdf7;border-color:#cbd8e4}
.loose-match-shell{display:grid;gap:12px}
.loose-match-heading{display:flex;align-items:center;gap:18px;color:var(--muted);padding:2px 5px;text-transform:uppercase;letter-spacing:1.1px}
.loose-match-heading:after{content:'';height:1px;background:#9badba66;flex:1}
.loose-match-heading strong{font-size:13px;color:var(--ink);white-space:nowrap}
.loose-match-heading span{font-size:11px;text-transform:none;letter-spacing:0;color:var(--muted)}
.loose-match-playfield{position:relative;min-height:560px;overflow:hidden;border:1.5px solid #17324a;background-color:#fffdf7;background-image:linear-gradient(#7890a114 1px,transparent 1px),linear-gradient(90deg,#7890a114 1px,transparent 1px);background-size:32px 32px;border-radius:15px;box-shadow:inset 0 0 0 7px #fff;isolation:isolate}
.loose-match-playfield.is-complete{height:330px!important;min-height:330px;display:grid;place-items:center}
.loose-match-card{position:absolute;left:50%;top:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;border:2px solid var(--ink);border-radius:14px;color:var(--ink);box-shadow:5px 6px 0 #13284624;background:#fff;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transform:translate(-50%,-50%) rotate(var(--tilt,0deg));transition:box-shadow .16s,filter .16s,opacity .24s,transform .16s;border-color .16s;will-change:left,top,transform;overflow:hidden}
.loose-match-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--yellow)}
.loose-match-card:hover,.loose-match-card:focus-visible{box-shadow:7px 9px 0 #13284628;filter:brightness(1.015);outline:3px solid #2368b8;outline-offset:3px}
.loose-match-card.is-dragging{cursor:grabbing;box-shadow:12px 16px 0 #1328462b;transform:translate(-50%,-50%) rotate(0deg) scale(1.035);transition:box-shadow .1s,transform .1s;outline:3px solid #2368b8;outline-offset:3px}
.loose-match-card.is-selected{outline:4px solid #2368b8;outline-offset:3px;box-shadow:8px 10px 0 #2368b82b}
.loose-match-card.wrong{animation:shake .25s;border-color:#a53d36;background:#fff1ed}
.loose-match-card.match-success{pointer-events:none;animation:match-pair-away .26s ease-in forwards}
.loose-word-card{width:190px;min-height:238px;padding:12px 12px 15px;background:#fff7d9}
.loose-word-card .art{width:100%;height:auto;aspect-ratio:1;margin:0 0 11px;padding:5px;background:#fff;border-radius:8px}
.loose-word-card .art img{object-fit:contain}
.loose-word-card .fallback{font-size:42px}
.loose-term{font-family:Arcade,Friendly,sans-serif;font-size:18px;line-height:1.12;font-weight:900;text-align:center}
.loose-def-card{width:224px;min-height:154px;padding:24px 21px 20px;background:#fffdfa}
.loose-def-card:before{background:#ff766f}
.loose-card-kind{margin-bottom:17px;color:#a63e35;font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}
.loose-definition{font-size:15px;line-height:1.35;font-weight:800;text-align:center}
.match-board-feedback{min-height:35px;display:flex;align-items:center;justify-content:center;border-radius:9px;color:var(--muted);font-size:13px;font-weight:800}
.match-board-feedback.good{background:#deeee2;color:#165f44}.match-board-feedback.bad{background:#fae7dd;color:#8b352d}
.match-round-complete{text-align:center;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:28px 35px;box-shadow:8px 10px 0 #13284620}
.match-round-complete>span{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 12px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);font-size:31px;font-weight:900}
.match-round-complete h2{font-family:Arcade,Friendly,sans-serif;font-size:31px;margin:0 0 6px}.match-round-complete p{margin:0 0 18px;color:var(--muted);font-weight:700}
@keyframes match-pair-away{55%{transform:translate(-50%,-50%) rotate(0) scale(1.08);filter:brightness(1.05)}100%{transform:translate(-50%,-50%) rotate(0) scale(.72);opacity:0}}
@media(max-width:900px){.loose-match-heading span{display:none}.loose-word-card{width:166px;min-height:208px}.loose-term{font-size:16px}.loose-def-card{width:188px;min-height:140px;padding:20px 16px 17px}.loose-card-kind{margin-bottom:12px}.loose-definition{font-size:13px}}
@media(max-width:520px){.game-stage.match-stage{padding:9px}.loose-match-heading{padding:4px 2px}.loose-match-heading strong{font-size:10px;white-space:normal}.loose-match-playfield{background-size:24px 24px;border-radius:11px}.loose-word-card{width:42%;min-height:178px;padding:8px 8px 11px;border-radius:11px}.loose-word-card .art{margin-bottom:7px}.loose-term{font-size:13px}.loose-def-card{width:45%;min-height:126px;padding:17px 12px 14px;border-radius:11px}.loose-card-kind{font-size:8px;margin-bottom:9px}.loose-definition{font-size:11px;line-height:1.3}.loose-match-card:before{width:7px}.match-board-feedback{font-size:11px}}
@media(prefers-reduced-motion:reduce){.loose-match-card{transition:none}.loose-match-card.match-success{animation:none;opacity:0}}
/* Swipe Review: compact, app-style card deck */
.swipe-wrap{width:min(100%,430px);max-width:430px;margin:0 auto;touch-action:pan-y}
.swipe-deck{position:relative;display:grid;place-items:center;min-height:500px;padding:8px 0 18px;isolation:isolate}
.swipe-deck::before,.swipe-deck::after{content:'';position:absolute;z-index:0;width:min(350px,calc(100vw - 92px));height:440px;border:1.5px solid #1127392d;border-radius:25px;background:#fffaf2;box-shadow:0 12px 28px #11273913}
.swipe-deck::before{transform:translateY(14px) rotate(-2deg);opacity:.58}.swipe-deck::after{transform:translateY(8px) rotate(1.4deg);opacity:.82}
.swipe-card{position:relative;z-index:2;width:min(380px,calc(100vw - 72px));min-height:460px;display:flex;flex-direction:column;overflow:hidden;border:1.5px solid #11273955;border-radius:26px;background:#fffaf2;box-shadow:0 22px 48px #11273928;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform,opacity;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s ease,box-shadow .2s ease}
.swipe-card.is-dragging{cursor:grabbing;transition:none;box-shadow:0 28px 58px #11273935}.swipe-card.fly-left{transform:translateX(calc(-100vw - 220px)) rotate(-19deg)!important;opacity:0}.swipe-card.fly-right{transform:translateX(calc(100vw + 220px)) rotate(19deg)!important;opacity:0}
.swipe-top{display:flex;flex:1 1 auto;flex-direction:column;align-items:center;gap:12px;padding:18px 18px 15px;background:linear-gradient(155deg,#f4f1e8,#e9efe9)}
.swipe-kicker{align-self:flex-start;border:1px solid #1127392f;border-radius:999px;background:#fffaf2;padding:4px 9px;font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.swipe-top .art{width:100%;height:225px;border:0;border-radius:17px;background:#fff;padding:12px;box-shadow:inset 0 0 0 1px #11273918}.swipe-top h2{font:800 clamp(28px,5vw,38px) Arcade,'Arial Narrow',sans-serif;line-height:1.05;text-align:center;overflow-wrap:anywhere}
.swipe-definition{min-height:126px;display:flex;flex-direction:column;justify-content:center;gap:7px;padding:18px 52px 20px 24px;border-top:1px solid #11273920;background:#fffaf2;text-align:left;position:relative}.swipe-question{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}.swipe-definition strong{font-size:17px;line-height:1.38}.swipe-definition .speak-button{top:50%;transform:translateY(-50%)}
.swipe-stamp{position:absolute;z-index:5;top:78px;border:4px solid currentColor;border-radius:9px;background:#fffaf2e8;padding:5px 10px;font:800 25px/1 Arcade,'Arial Narrow',sans-serif;letter-spacing:1px;opacity:0;pointer-events:none}.swipe-stamp-left{right:18px;color:#d94848;transform:rotate(11deg)}.swipe-stamp-right{left:18px;color:#138a58;transform:rotate(-11deg)}
.swipe-buttons{display:flex;justify-content:center;gap:46px;margin-top:18px}.swipe-buttons button{width:76px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;border:1.5px solid #11273933;border-radius:50%;background:#fffaf2;box-shadow:0 7px 18px #11273920}.swipe-buttons button:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 11px 23px #11273925}.swipe-buttons button span:last-child{font-size:9px;font-weight:800;letter-spacing:1px}.swipe-action-icon{font:800 32px/1 Friendly,sans-serif}.no-match{color:#d94848}.yes-match{color:#138a58}.swipe-buttons svg{display:none}.swipe-wrap .keyboard-hint{margin-top:11px}
@media(max-width:600px){.swipe-deck{min-height:455px}.swipe-deck::before,.swipe-deck::after{height:405px}.swipe-card{min-height:425px}.swipe-top .art{height:190px}.swipe-definition{min-height:116px}.swipe-buttons{margin-top:12px}}
@media(max-height:760px) and (min-width:601px){.swipe-deck{min-height:440px}.swipe-deck::before,.swipe-deck::after{height:390px}.swipe-card{min-height:410px}.swipe-top .art{height:180px}.swipe-definition{min-height:112px}.swipe-buttons{margin-top:10px}}

function renderHome(){stopSpeech();run=null;$('#app').classList.add('is-home');$('#app').innerHTML=`<section class="home-intro"><div class="intro-copy"><h1>Choose how you play.</h1><p>One word set. Five ways to make it stick.</p></div><div class="current-set"><div class="current-set-text"><small>CURRENT SET</small><strong id="set-name">${esc(activeSet.title)}</strong><span id="set-meta">${activeSet.words.length} words${activeSet.grade?' · '+esc(activeSet.grade):''}</span></div><button class="outline" data-action="sets">Change set</button><div class="set-art" aria-hidden="true">${[demoWord('sea turtle'),demoWord('octopus',1),demoWord('whale',2)].map(w=>`<div>${art(w)}</div>`).join('')}</div></div></section><section class="games" aria-label="Choose a game">${GAMES.map(g=>`<article class="game-card game-${g.id}" style="--tone:${g.color}"><div class="game-card-title"><h2>${esc(g.name)}</h2><span>${({match:'MATCH · LEARN',quest:'READ · THINK',swipe:'DECIDE · LEARN',scramble:'BUILD · SPELL',flash:'EXPLORE · FLIP'})[g.id]}</span></div><div class="game-preview" aria-hidden="true">${gamePreview(g.id)}</div><div class="game-card-bottom"><p>${({match:'Find the matching pairs.',quest:'Read a clue. Make your choice.',swipe:'Does it match the clue?',scramble:'Put the letters in their place.',flash:'Explore each word at your pace.'})[g.id]}</p><button class="primary" data-action="start" data-id="${g.id}">${g.id==='flash'?'Study Cards':'Play '+g.short} ${icon('arrow')}</button></div></article>`).join('')}</section>`;}
function startGame(id,words){const game=GAMES.find(g=>g.id===id);if(!game)return;stopSpeech();let queue=shuffle(words || activeSet.words);if(id==='scramble'){const eligible=queue.filter(w=>/[\p{L}\p{N}]/u.test(w.term)&&[...w.term].length<=50);if(!eligible.length)return toast('Word Scramble needs a word or phrase with 1–50 characters.');if(eligible.length<queue.length)toast(`${queue.length-eligible.length} very long or symbol-only entries skipped for this game.`);queue=eligible;}

function setupQuestion(){run.answered=false;run.feedback=null;run.attempted=false;run.hinted=false;run.swipeAnimating=false;const w=run.queue[run.index];

}
function status(){const count=run.game.id==='match'?run.round*MATCH_BATCH_SIZE+run.matched.size:run.game.id==='flash'?run.index+1:run.index+(run.answered?1:0);let label=run.game.id==='match'?`Round ${run.round+1} of ${Math.ceil(run.queue.length/MATCH_BATCH_SIZE)}`:run.game.id==='flash'?`Card ${run.index+1} of ${run.queue.length}`:`Question ${run.index+1} of ${run.queue.length}`;return `<div class="game-status"><span>${label}</span><div class="progress-track" role="progressbar" aria-label="Session progress" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="${run.queue.length}"><span style="width:${count/run.queue.length*100}%"></span></div><span>${run.game.id==='match'?`${count} / ${run.queue.length} matched`:run.game.id==='flash'?`${run.seen.size} studied`:`${run.correct} correct`}</span>${settings.timer?`<span class="timer">${icon('clock')}<span id="timer">${timeString(elapsed())}</span></span>`:''}</div>`;}
function renderGame(){if(!run)return;$('#app').classList.remove('is-home');if(run.done)return renderResults();const g=run.game;$('#app').style.setProperty('--tone',g.color);$('#app').innerHTML=`<div class="back-row"><button class="text-button" data-action="home">${icon('back')} All games</button><span>${esc(activeSet.title)}</span><button class="text-button" data-action="restart">${icon('flip')} Restart</button></div><div class="game-banner"><span class="game-number">0${GAMES.indexOf(g)+1}</span><h1>${g.name}</h1><p>${g.desc}</p></div>${status()}<section class="game-stage ${g.id==='match'?'match-stage':''}" aria-label="${esc(g.name)}">${({match:renderMatch,quest:renderQuest,swipe:renderSwipe,scramble:renderScramble,flash:renderFlash}[g.id])()}</section>`;if(g.id==='match')requestAnimationFrame(()=>layoutMatchBoard());}
function feedback(next=true){if(!run.feedback)return '<div class="feedback" role="status">'+(run.game.id==='match'?'Choose a picture card and its definition.':'')+'</div>';return `<div class="feedback ${run.feedback.good?'good':'bad'}" role="status"><span>${esc(run.feedback.text)}</span>${next?`<button class="primary" data-action="next">${run.index===run.queue.length-1?'See results':'Next'} ${icon('arrow')}</button>`:''}</div>`;}
function renderMatch(){const complete=run.matched.size===run.batch.length;const cards=run.matchCards.filter(card=>!run.matched.has(card.id)).map(card=>{const w=card.word,p=run.matchPositions[card.key],style=p?` style="left:${p.x}%;top:${p.y}%;--tilt:${p.r}deg;z-index:${p.z||1}"`:'';const state=`${run.selectedMatch?.key===card.key?'is-selected':''} ${run.wrongPair?.includes(card.key)?'wrong':''}`;return `<button type="button" class="loose-match-card loose-${card.side}-card ${state}" data-action="match-card" data-side="${card.side}" data-key="${esc(card.key)}" data-id="${esc(card.id)}" aria-pressed="${run.selectedMatch?.key===card.key?'true':'false'}" aria-label="${card.side==='word'?`${esc(w.term)} picture card`:`Definition: ${esc(w.definition)}`}"${style}>${card.side==='word'?`${art(w)}<span class="loose-term">${esc(w.term)}</span>`:`<span class="loose-card-kind">Definition</span><span class="loose-definition">${esc(w.definition)}</span>`}</button>`;}).join('');return `<div class="loose-match-shell"><div class="loose-match-heading"><strong>Drag any card onto its partner</strong><span>Move the cards freely—or tap two cards to match them.</span></div><div class="loose-match-playfield ${complete?'is-complete':''}" id="match-playfield">${complete?`<div class="match-round-complete"><span aria-hidden="true">✓</span><h2>Round cleared!</h2><p>You matched all ${run.batch.length} pairs.</p><button class="primary" data-action="match-next">${(run.round+1)*MATCH_BATCH_SIZE>=run.queue.length?'See results':'Next round'} ${icon('arrow')}</button></div>`:cards}</div><div class="match-board-feedback ${run.feedback?run.feedback.good?'good':'bad':''}" role="status">${run.feedback?esc(run.feedback.text):`${run.matched.size} of ${run.batch.length} pairs found`}</div></div>`;}
function layoutMatchBoard(force=false){if(!run||run.game.id!=='match'||run.matched.size===run.batch.length)return;const board=$('#match-playfield');if(!board)return;const cards=[...board.querySelectorAll('.loose-match-card')],width=board.clientWidth;if(!width||!cards.length)return;const cols=width>=1040?5:width>=760?4:width>=520?3:2,rows=Math.ceil(run.matchCards.length/cols),rowHeight=width<420?210:width<600?228:width<900?246:270,height=rows*rowHeight+24,signature=`${cols}:${rows}`;board.style.height=`${height}px`;if(force||run.matchLayoutSignature!==signature){run.matchPositions={};run.matchLayoutSignature=signature;}run.matchCards.forEach((card,i)=>{if(run.matchPositions[card.key])return;const col=i%cols,row=Math.floor(i/cols),seed=[...card.key].reduce((sum,c)=>sum+c.charCodeAt(0),i*17),jitterX=((seed%9)-4)*Math.min(2.2,16/cols),jitterY=(((seed*7)%9)-4)*1.2;run.matchPositions[card.key]={x:Math.max(9,Math.min(91,(col+.5)*100/cols+jitterX)),y:Math.max(9,Math.min(91,(row+.5)*100/rows+jitterY)),r:((seed%5)-2)*.8,z:i+1};});cards.forEach(card=>{const p=run.matchPositions[card.dataset.key];if(!p)return;card.style.left=`${p.x}%`;card.style.top=`${p.y}%`;card.style.setProperty('--tilt',`${p.r}deg`);card.style.zIndex=p.z||1;});}
function resolveMatch(a,b,animate=false){if(!run||run.matchResolving||run.matched.has(a.id)||run.matched.has(b.id))return;run.selectedMatch=null;run.wrongPair=null;if(a.side===b.side){run.feedback={good:false,text:'Pair a picture card with a definition card.'};run.wrongPair=[a.key,b.key];renderGame();return;}const good=a.id===b.id;if(good){run.matched.add(a.id);if(!run.failed.has(a.id))run.correct++;run.feedback={good:true,text:'That’s a match!'};chime(true);if(animate){run.matchResolving=true;const current=run;for(const key of [a.key,b.key])document.querySelector(`[data-key="${CSS.escape(key)}"]`)?.classList.add('match-success');setTimeout(()=>{if(run!==current)return;run.matchResolving=false;renderGame();},260);return;}}else{run.failed.add(a.id);run.failed.add(b.id);for(const bad of [a.id,b.id])if(!run.mistakes.includes(bad))run.mistakes.push(bad);run.wrongPair=[a.key,b.key];run.feedback={good:false,text:'Not quite. Try another pair.'};chime(false);}renderGame();}

function renderQuest(){const w=run.queue[run.index];return `<div class="clue-box">${esc(w.definition)}${speakButton()}</div><div class="choices">${run.options.map((x,i)=>`<button class="picture-card ${run.answered&&x.id===w.id?'correct':''} ${run.answered&&run.choice===x.id&&x.id!==w.id?'wrong':''}" data-action="answer-quest" data-id="${esc(x.id)}" ${run.answered?'disabled':''}><span class="choice-number">${i+1}</span>${art(x)}<span>${esc(x.term)}</span></button>`).join('')}</div>${feedback()}<p class="keyboard-hint">Choose a picture, or press ${run.options.map((_,i)=>i+1).join(', ')}.</p>`;}
function renderSwipe(){const w=run.queue[run.index];return `<div class="swipe-wrap"><div class="swipe-deck"><div class="swipe-card" role="group" tabindex="0" aria-label="Potential match: ${esc(w.term)}"><div class="swipe-stamp swipe-stamp-left">PASS</div><div class="swipe-stamp swipe-stamp-right">MATCH</div><div class="swipe-top"><span class="swipe-kicker">Potential vocab match</span>${art(w)}<h2>${esc(w.term)}</h2></div><div class="swipe-definition"><span class="swipe-question">Does this definition belong here?</span><strong>${esc(run.definition.definition)}</strong>${speakButton()}</div></div></div><div class="swipe-buttons"><button class="no-match" data-action="answer-swipe" data-id="false" ${run.answered?'disabled':''} aria-label="Pass — not a match"><span class="swipe-action-icon">×</span><span>PASS</span></button><button class="yes-match" data-action="answer-swipe" data-id="true" ${run.answered?'disabled':''} aria-label="Match — these belong together"><span class="swipe-action-icon">♥</span><span>MATCH</span></button></div>${feedback()}<p class="keyboard-hint">Drag or flick the card. Keyboard: ← pass · → match.</p></div>`;}
function recordAnswer(good){run.answered=true;if(good)run.correct++;else if(!run.mistakes.includes(run.queue[run.index].id))run.mistakes.push(run.queue[run.index].id);chime(good);}
function answerQuest(id){if(run.answered)return;const w=run.queue[run.index];run.choice=id;const good=id===w.id;recordAnswer(good);run.feedback={good,text:good?`You got it — ${w.term}!`:`The answer is ${w.term}.`};renderGame();focusNext();}
function animateSwipe(value,card=$('.swipe-card')){if(!run||run.game.id!=='swipe'||run.answered||run.swipeAnimating)return;run.swipeAnimating=true;if(!card){run.swipeAnimating=false;answerSwipe(value);return;}card.classList.remove('is-dragging');const stamp=card.querySelector(value?'.swipe-stamp-right':'.swipe-stamp-left');if(stamp)stamp.style.opacity='1';requestAnimationFrame(()=>card.classList.add(value?'fly-right':'fly-left'));setTimeout(()=>{run.swipeAnimating=false;answerSwipe(value);},285);}
function answerSwipe(value){if(run.answered)return;const w=run.queue[run.index],truth=run.truths[run.index],good=value===truth;recordAnswer(good);const message=truth?(good?`It's a match! This definition belongs with ${w.term}.`:`Missed connection — ${w.term} and this definition belong together.`):(good?`Good instincts — no match. That definition belongs to ${run.definition.term}.`:`Plot twist — not a match. That definition belongs to ${run.definition.term}.`);run.feedback={good,text:message};toast(message);next();}
function renderScramble(){const w=run.queue[run.index];let k=0;return `<div class="scramble-board"><div class="scramble-top">${art(w,true)}<div class="clue-box">${esc(w.definition)}${speakButton()}</div></div><div class="answer-line ${run.scrambleWrong?'wrong':''}" aria-label="Your answer">${run.chars.map(c=>{if(!/[\p{L}\p{N}]/u.test(c))return `<span class="punctuation" aria-label="${c===' '?'space':esc(c)}">${c===' '?'':esc(c)}</span>`;const i=k++,tile=run.bank.find(x=>x.i===run.placed[i]);return `<button class="letter slot ${tile?'filled':''}" data-action="unplace" data-id="${i}" ${run.answered?'disabled':''} aria-label="${tile?`Remove letter ${esc(tile.c)}`:`Empty letter ${i+1}`}">${tile?esc(tile.c.toLocaleUpperCase()):''}</button>`;}).join('')}</div><div class="letter-bank" aria-label="Available letters">${run.bank.map(l=>`<button class="letter ${run.placed.includes(l.i)?'used':''}" data-action="letter" data-id="${l.i}" ${run.placed.includes(l.i)||run.answered?'disabled':''}>${esc(l.c.toLocaleUpperCase())}</button>`).join('')}</div>${run.answered?feedback():`<div class="scramble-actions"><button class="outline" data-action="clear-word">Clear</button><button class="outline" data-action="hint">Give me a hint</button><button class="primary" data-action="check-word" ${run.placed.length!==run.letters.length?'disabled':''}>Check word ${icon('check')}</button></div>${feedback(false)}`}<p class="keyboard-hint">Tap the tiles or type the letters. Backspace removes a letter.</p></div>`;}
function placeLetter(id){if(run.answered||run.placed.includes(id)||run.placed.length>=run.letters.length)return;run.placed.push(id);run.scrambleWrong=false;run.feedback=null;renderGame();}
function checkWord(){if(run.answered||run.placed.length!==run.letters.length)return;const answer=run.placed.map(i=>run.bank.find(x=>x.i===i).c).join('').toLocaleLowerCase();const target=run.letters.map(x=>x.c).join('').toLocaleLowerCase();if(answer===target){recordAnswer(!run.hinted&&!run.attempted);run.feedback={good:true,text:`You spelled ${run.queue[run.index].term}!`};renderGame();focusNext();}else{run.attempted=true;run.scrambleWrong=true;run.feedback={good:false,text:'Not quite. Tap a letter to remove it, then try again.'};chime(false);renderGame();}}
function hint(){if(run.answered)return;run.hinted=true;let prefix=0;while(prefix<run.placed.length&&run.bank.find(l=>l.i===run.placed[prefix]).c.toLocaleLowerCase()===run.letters[prefix].c.toLocaleLowerCase())prefix++;run.placed=run.placed.slice(0,prefix);if(prefix<run.letters.length){const next=run.bank.find(l=>!run.placed.includes(l.i)&&l.c.toLocaleLowerCase()===run.letters[prefix].c.toLocaleLowerCase());run.placed.push(next.i);}run.feedback={good:true,text:'Here’s the next letter. Keep going!'};run.scrambleWrong=false;renderGame();}
function renderFlash(){const w=run.queue[run.index];return `<div class="flash-top"><button class="text-button" data-action="shuffle-flash">${icon('flip')} Shuffle cards</button><label class="checkbox-label"><input type="checkbox" id="study-labels" ${settings.labels?'checked':''}> Show word with picture</label></div><div class="flash-row"><div class="flash-nav"><button data-action="flash-prev" aria-label="Previous card" ${run.index===0?'disabled':''}>${icon('back')}</button><small>Previous</small></div><div class="flash-card" role="button" tabindex="0" data-action="flip" aria-label="${run.flipped?'Definition. Flip to picture':'Picture. Flip to definition'}"><span class="card-side">${run.flipped?'DEFINITION':'PICTURE'}</span>${run.flipped?`<p class="definition">${esc(w.definition)}</p>`:`${art(w,!settings.labels)}${settings.labels?`<h2>${esc(w.term)}</h2>`:''}`}</div><div class="flash-nav"><button data-action="flash-next" aria-label="Next card" ${run.index===run.queue.length-1?'disabled':''}>${icon('arrow')}</button><small>Next</small></div></div><div class="flash-actions"><button class="primary" data-action="flip">${icon('flip')} Flip card</button><button class="outline" data-action="speak">${icon('sound')} Listen</button>${run.seen.size===run.queue.length?'<button class="primary" data-action="finish-flash">Finish study</button>':''}</div><div class="dots" aria-hidden="true">${run.queue.map((w,i)=>`<span class="dot ${run.seen.has(w.id)?'seen':''} ${i===run.index?'active':''}"></span>`).join('')}</div><p class="keyboard-hint">Space to flip. Arrow keys to move. Flip each card to study its definition.</p>`;}
function flip(){run.flipped=!run.flipped;if(run.flipped)run.seen.add(run.queue[run.index].id);renderGame();}

function renderResults(){const flash=run.game.id==='flash',missed=run.queue.filter(w=>run.mistakes.includes(w.id));$('#app').innerHTML=`<div class="back-row"><button class="text-button" data-action="home">${icon('back')} All games</button><span>${esc(activeSet.title)}</span></div><section class="results"><div class="result-stamp" aria-hidden="true">${run.correct===run.queue.length||flash?'★':'✓'}</div><p class="eyebrow">${esc(run.game.name)} complete</p><h2>${flash?'One set. A little more confident.':run.correct===run.queue.length?'You know your stuff!':'Look at that vocabulary grow.'}</h2><p>${flash?'You explored every word and its definition.':'Every try is practice. Keep those new words going.'}</p><div class="result-metrics"><div><strong>${flash?run.seen.size:`${run.correct}/${run.queue.length}`}</strong><small>${flash?'cards studied':run.game.id==='match'||run.game.id==='scramble'?'first try, no hints':'correct answers'}</small></div>${settings.timer?`<div><strong>${timeString(elapsed())}</strong><small>time practising</small></div>`:''}</div><div class="result-actions"><button class="primary" data-action="restart">${icon('flip')} Play again</button>${missed.length?'<button class="outline" data-action="review-missed">Practise these words</button>':''}<button class="outline" data-action="home">Choose another game ${icon('arrow')}</button></div>${missed.length?`<details class="review-words"><summary>${missed.length} ${missed.length===1?'word':'words'} to revisit</summary>${missed.map(w=>`<p><strong>${esc(w.term)}</strong> — ${esc(w.definition)}</p>`).join('')}</details>`:''}</section>`;}

const aliases={term:['term','word','vocabulary','vocab','name','label','title','front','english','text'],definition:['definition','meaning','description','clue','explanation','back','answer','translation','def'],image:['image','imageSrc','imageUrl','imageURL','image_url','imageData','imageDataUrl','image_data','picture','pictureUrl','picture_url','photo','url','dataUrl','dataURL','base64']};
const getAlias=(obj,keys)=>{for(const key of keys){const found=Object.keys(obj).find(k=>k.toLowerCase()===key.toLowerCase());if(found!==undefined && obj[found]!==undefined && obj[found]!==null && obj[found]!=='')return obj[found];}return undefined;};
function textValue(v){if(typeof v==='string'||typeof v==='number')return String(v).trim();if(v&&typeof v==='object')return textValue(v.text??v.value??v.content);return '';}
function findRecords(data,depth=0){if(depth>5)return null;if(Array.isArray(data))return data;if(!data||typeof data!=='object')return null;for(const key of ['words','cards','items','vocabulary','vocab','entries','flashcards','terms','data','set','wordList','vocabularyCards']){if(data[key]){const a=findRecords(data[key],depth+1);if(a)return a;}}for(const v of Object.values(data)){if(Array.isArray(v)&&v.length&&typeof v[0]==='object')return v;}return null;}
let importRaw=null, importRecords=null, selectedImportText=null, selectedImportName='Imported Vocabulary';
function normalizeSet(data,fallback,mapping){let rows=findRecords(data);if(!rows)throw Error('I could not find a list of cards. Use a words, cards, or items array, or an array of card objects.');if(rows.length>500)throw Error('Please use a set of 500 words or fewer.');const warnings=[];const valid=[],seen=new Set();rows.forEach((row,i)=>{if(!row||typeof row!=='object'){warnings.push(`Card ${i+1}: not a card object.`);return;}const term=textValue(mapping?row[mapping.term]:getAlias(row,aliases.term));const definition=textValue(mapping?row[mapping.definition]:getAlias(row,aliases.definition));if(!term||!definition){warnings.push(`Card ${i+1}: missing a word or definition.`);return;}if(term.length>200||definition.length>2000){warnings.push(`Card ${i+1}: word or definition is too long.`);return;}if(seen.has(term.toLocaleLowerCase())){warnings.push(`Duplicate word: ${term}.`);return;}seen.add(term.toLocaleLowerCase());let rawImage=mapping?row[mapping.image]:getAlias(row,aliases.image);if(rawImage&&typeof rawImage==='object')rawImage=rawImage.url??rawImage.src??rawImage.data??rawImage.base64;let image=imageSource(rawImage);if(rawImage&&!image)warnings.push(`${term}: unsupported picture format; a word card will be used.`);const word={id:String(valid.length),term,definition};if(image)word.image=image;if(Number.isInteger(row.atlas)&&row.atlas>=0&&row.atlas<12&&data.builtinArt==='ocean-v1')word.atlas=row.atlas;valid.push(word);});if(!valid.length)throw Error('No complete cards found. Choose the fields for your word and definition below.');const title=textValue(data.title??data.name??data.setName??data.topic??data.metadata?.title)||fallback||'Imported Vocabulary';const grade=textValue(data.grade??data.gradeLevel??data.metadata?.grade);return {set:{id:'set-'+(crypto.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2)),title:title.slice(0,120),grade:grade.slice(0,60),language:textValue(data.language)||'en-CA',words:valid},warnings};}
function mapControls(rows){const keys=[...new Set(rows.filter(x=>x&&typeof x==='object').slice(0,12).flatMap(Object.keys))].filter(k=>!['__proto__','constructor','prototype'].includes(k));if(!keys.length)return '';const select=(id,label,optional,guess)=>`<label class="field-label" for="map-${id}">${label}</label><select id="map-${id}">${optional?'<option value="">No picture field</option>':''}${keys.map(k=>`<option value="${esc(k)}" ${aliases[guess].some(a=>a.toLowerCase()===k.toLowerCase())?'selected':''}>${esc(k)}</option>`).join('')}</select>`;return `<details class="field-mapping"><summary>Choose fields manually</summary>${select('term','Word field',false,'term')}${select('definition','Definition field',false,'definition')}${select('image','Picture field',true,'image')}<div class="modal-actions"><button class="outline" data-action="map-json">Apply fields</button></div></details>`;}
function previewJson(text,fallback='Imported Vocabulary',mapping){$('#import-error').textContent='';try{if(!mapping){importRaw=null;if(text.length>40*1024*1024)throw Error('Please use JSON smaller than 40 MB.');importRaw=JSON.parse(text.replace(/^\uFEFF/,''));}const sources=Array.isArray(importRaw?.sets)?importRaw.sets:[importRaw];pendingImports=[];importWarnings=[];for(const source of sources){const r=normalizeSet(source,fallback,mapping);pendingImports.push(r.set);importWarnings.push(...r.warnings);}importRecords=findRecords(sources[0]);$('#import-preview').innerHTML=`${pendingImports.map(s=>`<div class="import-preview"><h3>${esc(s.title)}</h3><p>${s.words.length} words · ${s.words.filter(w=>w.image||Number.isInteger(w.atlas)).length} pictures</p><div class="preview-words">${s.words.slice(0,12).map(w=>`<span class="pill">${esc(w.term)}</span>`).join('')}${s.words.length>12?'<span class="pill">…</span>':''}</div></div>`).join('')}${importWarnings.length?`<p class="error-message">${esc(importWarnings.slice(0,6).join('\n'))}${importWarnings.length>6?`\n… and ${importWarnings.length-6} more.`:''}</p>`:''}${sources.length===1?mapControls(importRecords):''}<div class="modal-actions"><button class="primary" data-action="commit-import">Use ${pendingImports.length>1?'these sets':'this set'} ${icon('check')}</button></div>`;}catch(e){pendingImports=[];$('#import-error').textContent=e instanceof SyntaxError?'That is not valid JSON. Check for missing commas, quotation marks, or brackets.':e.message;importRecords=findRecords(importRaw);$('#import-preview').innerHTML=importRecords?mapControls(importRecords):'';}}
async function importFile(file){if(!file)return;if(file.size>30*1024*1024){$('#import-error').textContent='Please use a JSON file smaller than 30 MB.';return;}try{const t=await file.text();selectedImportText=t;selectedImportName=file.name.replace(/\.json$/i,'')||'Imported Vocabulary';$('#json-text').value=t.length<100000?t:'';previewJson(t,selectedImportName);}catch{selectedImportText=null;$('#import-error').textContent='This file could not be read. Try selecting it again.';}}
async function commitImport(){if(!pendingImports.length)return;const button=$('[data-action=commit-import]');if(button)button.disabled=true;const imported=[...pendingImports];pendingImports=[];let saved=true;for(const s of imported){sets.push(s);try{await storedSets('put',s);}catch{saved=false;}}activeSet=imported[0];saveLocal('va-modern-active-v1',activeSet.id);closeModal();renderHome();toast(saved?`${imported.length>1?`${imported.length} sets`:`${activeSet.title}`} ready to play!`:'Your set is ready for this visit. Browser storage is unavailable; keep your JSON file.');}

let activeMatchDrag=null,matchClickBlockUntil=0,matchResizeTimer=null;
function beginMatchDrag(e){const card=e.target.closest('.loose-match-card');if(!card||e.button!==0||!run||run.game.id!=='match'||run.matchResolving)return;const board=card.closest('#match-playfield'),rect=card.getBoundingClientRect();if(!board)return;e.preventDefault();run.selectedMatch=null;run.wrongPair=null;run.feedback=null;const p=run.matchPositions[card.dataset.key]||{x:50,y:50,r:0,z:1};p.z=++run.matchZ;run.matchPositions[card.dataset.key]=p;card.style.zIndex=p.z;card.classList.add('is-dragging');card.setPointerCapture?.(e.pointerId);activeMatchDrag={pointerId:e.pointerId,card,board,key:card.dataset.key,id:card.dataset.id,side:card.dataset.side,offsetX:e.clientX-(rect.left+rect.width/2),offsetY:e.clientY-(rect.top+rect.height/2),startX:e.clientX,startY:e.clientY,moved:false};}
function moveMatchDrag(e){const d=activeMatchDrag;if(!d||e.pointerId!==d.pointerId)return;e.preventDefault();const br=d.board.getBoundingClientRect(),cr=d.card.getBoundingClientRect(),halfX=cr.width/2/br.width*100,halfY=cr.height/2/br.height*100,x=Math.max(halfX,Math.min(100-halfX,(e.clientX-d.offsetX-br.left)/br.width*100)),y=Math.max(halfY,Math.min(100-halfY,(e.clientY-d.offsetY-br.top)/br.height*100)),p=run.matchPositions[d.key];if(!p)return;p.x=x;p.y=y;d.card.style.left=`${x}%`;d.card.style.top=`${y}%`;if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>6){d.moved=true;d.card.classList.add('is-moving');}}
function overlapArea(a,b){return Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));}
function endMatchDrag(e,cancel=false){const d=activeMatchDrag;if(!d||e.pointerId!==d.pointerId)return;activeMatchDrag=null;d.card.releasePointerCapture?.(e.pointerId);d.card.classList.remove('is-dragging','is-moving');if(!d.moved||cancel)return;matchClickBlockUntil=performance.now()+450;const draggedRect=d.card.getBoundingClientRect(),choices=[...d.board.querySelectorAll('.loose-match-card')].filter(card=>card!==d.card).map(card=>({card,area:overlapArea(draggedRect,card.getBoundingClientRect())})).sort((a,b)=>b.area-a.area),best=choices[0];if(best&&best.area>Math.min(draggedRect.width*draggedRect.height,best.card.offsetWidth*best.card.offsetHeight)*.16)resolveMatch({side:d.side,id:d.id,key:d.key},{side:best.card.dataset.side,id:best.card.dataset.id,key:best.card.dataset.key},true);}
document.addEventListener('pointerdown',beginMatchDrag);
document.addEventListener('pointermove',moveMatchDrag,{passive:false});
document.addEventListener('pointerup',e=>endMatchDrag(e));
document.addEventListener('pointercancel',e=>endMatchDrag(e,true));
document.addEventListener('dragstart',e=>{if(e.target.closest?.('.loose-match-card'))e.preventDefault();});
window.addEventListener('resize',()=>{if(!run||run.game.id!=='match')return;clearTimeout(matchResizeTimer);matchResizeTimer=setTimeout(()=>layoutMatchBoard(true),120);});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=b.dataset.id;
 switch(action){case 'home':closeModal();renderHome();break;case 'start':startGame(id);break;case 'sets':showSets();break;case 'progress':showProgress();break;case 'settings':showSettings();break;case 'help':showHelp();break;case 'close':closeModal();break;case 'restart':startGame(run.game.id);break;
 case 'match-card':if(performance.now()>=matchClickBlockUntil)match(b.dataset.side,id);break;case 'match-next':if(run.matched.size!==run.batch.length)break;if((run.round+1)*MATCH_BATCH_SIZE>=run.queue.length)finish();else{run.round++;setupQuestion();renderGame();}break;
 case 'answer-quest':answerQuest(id);break;case 'answer-swipe':animateSwipe(id==='true');break;case 'next':next();break;case 'letter':placeLetter(Number(id));break;case 'unplace':if(!run.answered){run.placed.splice(Number(id),1);run.scrambleWrong=false;run.feedback=null;renderGame();}break;case 'clear-word':run.placed=[];run.scrambleWrong=false;run.feedback=null;renderGame();break;case 'hint':hint();break;case 'check-word':checkWord();break;
 case 'flip':flip();break;case 'flash-next':case 'flash-prev':stopSpeech();run.index=Math.max(0,Math.min(run.queue.length-1,run.index+(action==='flash-next'?1:-1)));run.flipped=false;renderGame();break;case 'shuffle-flash':run.queue=shuffle(run.queue);run.index=0;run.flipped=false;renderGame();break;case 'finish-flash':if(run.seen.size===run.queue.length)finish();break;case 'review-missed':startGame('flash',run.queue.filter(w=>run.mistakes.includes(w.id)));break;
 case 'speak':{const w=run.queue[run.index];say(run.game.id==='swipe'?run.definition.definition:run.game.id==='flash'?(run.flipped?w.definition:w.term):w.definition);break;}
 case 'import':showImport();break;case 'sample-json':selectedImportText=null;$('#json-text').value=JSON.stringify({...example,words:example.words.map(({image,...w})=>w)},null,2);break;case 'preview-json':{const pasted=$('#json-text').value.trim();if(pasted)previewJson(pasted);else if(selectedImportText!==null)previewJson(selectedImportText,selectedImportName);else $('#import-error').textContent='Choose a JSON file or paste your JSON first.';break;}case 'map-json':previewJson('',selectedImportName,{term:$('#map-term').value,definition:$('#map-definition').value,image:$('#map-image').value});break;case 'commit-import':await commitImport();break;
 case 'choose-set':{const s=sets.find(s=>s.id===id);if(s){activeSet=s;saveLocal('va-modern-active-v1',id);closeModal();renderHome();}break;}
 case 'delete-set':{const s=sets.find(s=>s.id===id);if(!s||id==='ocean-demo')break;openModal('REMOVE THIS SET?',`<p class="modal-intro">Remove ${esc(s.title)} from this browser? Your original JSON file will remain available.</p><div class="modal-actions"><button class="outline" data-action="sets">Keep set</button><button class="primary" data-action="confirm-delete" data-id="${esc(id)}">Remove set</button></div>`);break;}
 case 'confirm-delete':try{await storedSets('delete',id);sets=sets.filter(s=>s.id!==id);if(activeSet.id===id){activeSet=DEFAULT_SET;saveLocal('va-modern-active-v1',activeSet.id);renderHome();}showSets();}catch{toast('The set could not be removed from this browser. Try again.');}break;
 case 'copy':await copySet();break;case 'download':showDownload();break;case 'export-json':downloadBlob(new Blob([JSON.stringify(exportedSet(),null,2)],{type:'application/json'}),filename()+'.json');break;case 'export-html':await exportHTML();break;
 }
});
document.addEventListener('change',e=>{if(e.target.id==='json-file')importFile(e.target.files[0]);if(e.target.dataset.setting){settings[e.target.dataset.setting]=e.target.checked;saveLocal('va-modern-settings-v1',settings);if(run)renderGame();}if(e.target.id==='study-labels'){settings.labels=e.target.checked;saveLocal('va-modern-settings-v1',settings);renderGame();}});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop-zone')){e.preventDefault();}});
document.addEventListener('drop',e=>{if(e.target.closest('#drop-zone')){e.preventDefault();importFile(e.dataTransfer.files[0]);}});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){const s=document.createElement('span');s.className='fallback';s.textContent='?';s.setAttribute('aria-label','Picture unavailable');e.target.replaceWith(s);}},true);
document.addEventListener('keydown',e=>{if(!run||run.done||$('#modal').open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 if(run.game.id==='quest'&&!run.answered&&/^[1-4]$/.test(e.key)){const choice=run.options[Number(e.key)-1];if(choice){e.preventDefault();answerQuest(choice.id);}}
 if(run.game.id==='swipe'&&!run.answered&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();animateSwipe(e.key==='ArrowRight');}
 if(run.game.id==='scramble'&&!run.answered){if(e.key==='Backspace'){e.preventDefault();run.placed.pop();run.scrambleWrong=false;run.feedback=null;renderGame();}else if(e.key==='Enter'&&run.placed.length===run.letters.length){e.preventDefault();checkWord();}else if([...e.key].length===1&&/[\p{L}\p{N}]/u.test(e.key)){const l=run.bank.find(l=>!run.placed.includes(l.i)&&l.c.toLocaleLowerCase()===e.key.toLocaleLowerCase());if(l){e.preventDefault();placeLetter(l.i);}}}
 if(run.game.id==='flash'){if(e.key===' '&&(e.target===document.body||e.target.closest('.flash-card'))){e.preventDefault();flip();}else if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();run.index=Math.max(0,Math.min(run.queue.length-1,run.index+(e.key==='ArrowRight'?1:-1)));run.flipped=false;renderGame();}else if(e.key==='Enter'&&e.target.closest('.flash-card')){e.preventDefault();flip();}}
});
let swipeStart=null;
document.addEventListener('pointerdown',e=>{const card=e.target.closest('.swipe-card');if(!card||e.target.closest('button')||!e.isPrimary||run?.game.id!=='swipe'||run.answered||run.swipeAnimating||$('#modal').open)return;e.preventDefault();card.setPointerCapture?.(e.pointerId);card.classList.add('is-dragging');swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId,card};});
document.addEventListener('pointermove',e=>{if(!swipeStart||e.pointerId!==swipeStart.id)return;const dx=e.clientX-swipeStart.x,dy=Math.max(-18,Math.min(18,(e.clientY-swipeStart.y)*.12)),amount=Math.min(1,Math.abs(dx)/120);e.preventDefault();swipeStart.card.style.transform=`translate(${dx}px,${dy}px) rotate(${dx*.035}deg)`;const left=swipeStart.card.querySelector('.swipe-stamp-left'),right=swipeStart.card.querySelector('.swipe-stamp-right');if(left)left.style.opacity=dx<0?String(amount):'0';if(right)right.style.opacity=dx>0?String(amount):'0';});
function endSwipeGesture(e,cancel=false){if(!swipeStart||e.pointerId!==swipeStart.id)return;const state=swipeStart;swipeStart=null;const dx=e.clientX-state.x,dy=e.clientY-state.y,threshold=Math.min(95,state.card.offsetWidth*.23);state.card.classList.remove('is-dragging');if(!cancel&&Math.abs(dx)>threshold&&Math.abs(dx)>Math.abs(dy)*1.15){animateSwipe(dx>0,state.card);return;}state.card.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)';state.card.style.transform='';state.card.querySelectorAll('.swipe-stamp').forEach(s=>s.style.opacity='0');setTimeout(()=>{if(state.card.isConnected)state.card.style.transition='';},250);}
document.addEventListener('pointerup',e=>endSwipeGesture(e));
document.addEventListener('pointercancel',e=>endSwipeGesture(e,true));
setInterval(()=>{if(run&&!run.done&&$('#timer'))$('#timer').textContent=timeString(elapsed());},1000);
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const embeddedNode=$('#embedded-vocabulary');
let hasEmbeddedSet=false;
if(embeddedNode){window.__PORTABLE_SOURCE__='<!doctype html>\n'+document.documentElement.outerHTML;try{const embedded=JSON.parse(embeddedNode.textContent);if(embedded){hasEmbeddedSet=true;activeSet={...normalizeSet(embedded).set,id:'embedded-set'};sets.push(activeSet);}}catch{toast('The embedded set could not load. Ocean Life is ready instead.');}}
renderHome();
async function initialize(){try{const stored=await storedSets('getAll');sets.push(...stored.filter(s=>s&&s.id!=='embedded-set'&&typeof s.title==='string'&&Array.isArray(s.words)&&s.words.length));const saved=sets.find(s=>s.id===safeRead('va-modern-active-v1',null));if(saved&&!run&&!hasEmbeddedSet)activeSet=saved;}catch{}if(!run)renderHome();}
initialize();
if(document.modelContext?.registerTool){const lifecycle=new AbortController();const registrations=[{name:'get_vocabulary_state',title:'View vocabulary state',description:'Read the current set, available games, and current practice state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(){return {set:activeSet.title,wordCount:activeSet.words.length,games:GAMES.map(g=>g.id),game:run?.game.id||null,completed:run?.done||false};}},{name:'start_vocabulary_game',title:'Start a vocabulary game',description:'Start or restart a game with the currently selected set.',inputSchema:{type:'object',properties:{game:{type:'string',enum:GAMES.map(g=>g.id)}},required:['game'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||!GAMES.some(g=>g.id===input.game))throw Error('Choose a valid vocabulary game.');closeModal();startGame(input.game);return {game:run.game.id,set:activeSet.title,words:run.queue.length};}}];for(const t of registrations){try{Promise.resolve(document.modelContext.registerTool(t,{signal:lifecycle.signal})).catch(()=>{});}catch{}}window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}
</script>
