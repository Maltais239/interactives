<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Français Québec — Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Québec blue is the brand colour. The "--green" family below is repointed to blue so
     all the chrome (nav, primary buttons, progress, lesson tiles) turns blue in one move.
     True success-green lives in --ok / --oks and is applied only to "correct" feedback. */
  --qc:#0b3d91;--qcd:#082e6e;--qcl:#1e56c0;
  --green:#0b3d91;--gd:#082e6e;--gs:#c5d6f2;--gxs:#eaf1fb;
  --ok:#2e8b2e;--oks:#e4f6e0;--okd:#1f6b1f;
  --gold:#ffc800;--golds:#fff9e6;
  --red:#e23b3b;--reds:#fde8e8;
  --blue:#1e56c0;--blues:#e8f0fc;
  --purple:#6a5acd;--purples:#ecebfb;
  --bg:#eef2f8;--panel:#fff;--text:#132038;--muted:#5b6b82;
  --border:#dbe3ee;--border-b:#c2cede;
  --shadow-sm:0 2px 8px rgba(11,61,145,.07);
  --shadow-md:0 8px 28px rgba(11,61,145,.13);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Nunito',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
/* Québec flag: deep blue field with a subtle white cross behind the title */
.topbar{background:#0b3d91;color:#fff;padding:24px 20px 28px;position:relative;overflow:hidden}
.topbar::before{content:'';position:absolute;inset:0;background:
  linear-gradient(#fff,#fff) center/100% 12px no-repeat,
  linear-gradient(#fff,#fff) center/12px 100% no-repeat;
  opacity:.10;pointer-events:none}
.topbar::after{content:'⚜️';position:absolute;right:26px;top:50%;transform:translateY(-50%);font-size:3.2rem;opacity:.28;pointer-events:none}
.topbar-inner,.app{max-width:1100px;margin:0 auto}
.topbar h1{margin:0 0 5px;font-size:clamp(1.7rem,3vw,2.5rem);font-weight:900;line-height:1.1;letter-spacing:-.025em}
.topbar p{margin:0;color:rgba(255,255,255,.88);font-size:.93rem;font-weight:700;max-width:560px}
.app{margin-top:0;padding:12px 14px 36px}
.shell{background:var(--panel);border-radius:26px;box-shadow:var(--shadow-md);overflow:hidden}
.nav{display:flex;gap:4px;padding:10px;border-bottom:2px solid var(--border);background:#f8faf7}
.nav button{flex:1;border:none;background:transparent;color:var(--muted);border-radius:12px;padding:9px 4px 7px;font-weight:800;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.01em;text-transform:uppercase}
.nav button .ni{font-size:1.4rem;line-height:1;transition:transform .2s}
.nav button.active{background:var(--gxs);color:var(--gd)}
.nav button.active .ni{transform:scale(1.15)}
.nav button:hover:not(.active){background:#eef2eb;color:var(--text)}
.content{padding:18px}
.section{display:none}.section.active{display:block}
.grid{display:grid;gap:14px}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:2px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-sm)}
.card h2{margin:0 0 10px;font-weight:900;line-height:1.15;font-size:1.2rem}
.card h3{margin:0 0 8px;font-weight:800;font-size:1rem}
.muted{color:var(--muted)}.small{font-size:.9rem}.tiny{font-size:.78rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:2px solid var(--border);border-bottom:4px solid var(--border-b);border-radius:14px;padding:10px 18px;background:#fff;cursor:pointer;font-weight:800;font-size:.93rem;color:var(--text);font-family:inherit;transition:transform .08s,border-bottom-width .08s,background .12s;display:inline-flex;align-items:center;gap:6px;user-select:none}
.btn:hover{background:#f4f8f2}
.btn:active{border-bottom-width:2px;transform:translateY(2px)}
.btn.primary{background:var(--green);border-color:var(--gd);border-bottom-color:#337800;color:#fff}
.btn.primary:hover{background:#52be02}
.btn.primary:active{background:var(--gd)}
.btn.soft{background:var(--gs);border-color:#a8e06b;border-bottom-color:#7dc23a;color:var(--okd)}
.btn.danger{background:var(--reds);border-color:var(--red);border-bottom-color:#cc2222;color:#aa0000}
.btn-icon{width:38px;height:38px;border-radius:50%;border:2px solid var(--border);border-bottom:3px solid var(--border-b);background:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:transform .08s,border-bottom-width .08s;padding:0}
.btn-icon:active{border-bottom-width:1px;transform:translateY(1px)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:800;width:fit-content}
.pill.green{background:var(--gs);color:var(--okd)}
.pill.blue{background:var(--blues);color:#0880bf}
.pill.yellow{background:var(--golds);color:#9a7200}
.pill.purple{background:var(--purples);color:#7030c8}
.pill.red{background:var(--reds);color:#bb1111}
.pill.gray{background:#f1f5f9;color:#475569}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px;margin-top:10px}
.lesson-tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 8px;border:2px solid var(--border);border-bottom:3px solid var(--border-b);border-radius:14px;background:#fafcf9;cursor:pointer;text-align:center;font-family:inherit;transition:all .12s;position:relative;outline:none}
.lesson-tile:hover{border-color:#94a3b8;background:#f1f5ee}
.lesson-tile.sel{border-color:var(--green);border-bottom-color:var(--gd);background:var(--gxs);color:var(--gd)}
.lesson-tile.off{opacity:.35;cursor:not-allowed;pointer-events:none}
.lesson-tile .lt-num{font-size:1rem;font-weight:900}
.lesson-tile .lt-words{font-size:.65rem;color:var(--muted);font-weight:700}
.lesson-tile .lt-dot{width:7px;height:7px;border-radius:50%;background:#dde3e9;margin-top:2px;transition:background .15s}
.lesson-tile.sel .lt-dot{background:var(--green)}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:7px;margin-top:10px}
.pack-chip{display:flex;align-items:center;gap:7px;padding:9px 11px;border:2px solid var(--border);border-bottom:3px solid var(--border-b);border-radius:12px;background:#fafcf9;cursor:pointer;font-size:.85rem;font-weight:800;font-family:inherit;transition:all .12s;color:var(--text)}
.pack-chip:hover{border-color:#94a3b8}
.pack-chip.sel{border-color:var(--green);border-bottom-color:var(--gd);background:var(--gxs);color:var(--gd)}
.pack-chip input[type=checkbox]{width:15px;height:15px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.summary-box{border:2px solid var(--border);border-radius:14px;padding:14px 12px;background:#fafcf9;text-align:center}
.summary-box .value{font-size:1.9rem;font-weight:900;line-height:1;margin-bottom:3px}
.summary-box .label{font-size:.78rem;font-weight:700;color:var(--muted)}
.session-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid var(--border);background:#f8faf7}
.session-prog-wrap{flex:1;height:14px;background:#e2e8e0;border-radius:7px;overflow:hidden}
.session-bar{height:100%;background:linear-gradient(90deg,var(--green),#7ddd20);border-radius:7px;transition:width .5s cubic-bezier(.4,0,.2,1);min-width:4px}
.score-badge{background:var(--golds);color:#9a7200;border:2px solid #ffc800;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:900;white-space:nowrap}
.review-card{max-width:720px;margin:14px auto;padding:26px 22px 22px;text-align:center}
.ex-label{margin-bottom:14px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.task-hint{font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:14px}
.prompt{font-size:clamp(1.5rem,4.5vw,2.6rem);font-weight:900;line-height:1.2;margin:0 0 6px;color:var(--text);letter-spacing:-.02em}
.prompt.long{font-size:clamp(1.1rem,2.8vw,1.7rem);font-weight:800}
.speak-row{display:flex;justify-content:center;margin:12px 0 4px}
.speak-btn{background:var(--blues);border:2px solid #8dd9f8;border-bottom:3px solid #0d90d9;border-radius:999px;color:#0880bf;font-weight:800;font-family:inherit;padding:9px 22px;cursor:pointer;font-size:.9rem;transition:transform .08s,border-bottom-width .08s;display:inline-flex;align-items:center;gap:7px}
.speak-btn:active{border-bottom-width:1px;transform:translateY(1px)}
.ans-wrap{max-width:460px;margin:16px auto 0}
.ans-wrap input{width:100%;border:2px solid var(--border);border-bottom:3px solid var(--border-b);border-radius:14px;padding:14px 16px;background:#fff;color:var(--text);font:800 1.05rem 'Nunito',sans-serif;outline:none;transition:border-color .15s,box-shadow .15s}
.ans-wrap input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(88,204,2,.14);border-bottom-color:var(--gd)}
.action-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px auto 0;max-width:540px}
.choice{background:#fff;border:2px solid var(--border);border-bottom:4px solid var(--border-b);border-radius:16px;padding:14px 14px;font-weight:800;font-size:.95rem;font-family:inherit;cursor:pointer;text-align:left;line-height:1.35;color:var(--text);transition:all .08s;position:relative}
.choice:hover{border-color:#94a3b8;background:#f8faf6;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.07)}
.choice:active{border-bottom-width:2px;transform:translateY(2px)}
.choice.correct{background:var(--oks)!important;border-color:var(--ok)!important;border-bottom-color:var(--okd)!important;color:var(--okd)!important;transform:none}
.choice.wrong{background:var(--reds)!important;border-color:var(--red)!important;border-bottom-color:#cc2222!important;color:#aa0000!important;transform:none}
.feedback-bar{padding:13px 16px;border-radius:14px;margin-top:14px;font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:10px;animation:pop-in .2s ease-out}
.feedback-bar.correct-fb{background:var(--oks);border:2px solid var(--ok);color:var(--okd)}
.feedback-bar.wrong-fb{background:var(--reds);border:2px solid #ffb3b3;color:#aa0000}
.answer-reveal{margin-top:10px;padding:14px 16px;border-radius:14px;background:var(--gxs);border:2px solid var(--gs);text-align:left;animation:pop-in .2s ease-out}
.reveal-label{font-size:.72rem;font-weight:900;color:var(--gd);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.reveal-text{font-size:1.2rem;font-weight:900;color:var(--text)}
.empty{padding:28px;border:2px dashed var(--border);border-radius:16px;color:var(--muted);background:#fafcf9;text-align:center;font-weight:700}
.praise-screen{padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.praise-icon{font-size:3.5rem;animation:bounce .4s ease}
.praise-text{font-size:1.5rem;font-weight:900;color:var(--okd)}
.session-complete{padding:36px 24px;text-align:center}
.complete-icon{font-size:4rem;display:block;margin-bottom:6px;animation:bounce .5s ease}
.complete-title{font-size:1.9rem;font-weight:900;margin:0 0 18px;color:var(--text)}
.score-ring{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:110px;height:110px;border-radius:50%;border:5px solid var(--green);background:var(--gxs);margin:0 auto 20px}
.ring-pct{font-size:1.9rem;font-weight:900;color:var(--gd);line-height:1}
.ring-label{font-size:.72rem;font-weight:800;color:var(--muted)}
.stat-row{display:grid;grid-template-columns:1fr 64px 100px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-name{font-size:.88rem;font-weight:700}
.stat-count{font-size:.82rem;color:var(--muted);font-weight:700;text-align:right}
.stat-bar-wrap{height:9px;background:var(--border);border-radius:5px;overflow:hidden}
.stat-bar{height:100%;border-radius:5px;background:var(--ok);transition:width .7s cubic-bezier(.4,0,.2,1)}
.stat-bar.full{background:var(--gold)}
.status{font-weight:800;border-radius:999px;padding:4px 10px;display:inline-block;font-size:.74rem}
.status.new{background:#f1f5f9;color:#475569}
.status.learning{background:var(--golds);color:#9a7200}
.status.strong{background:var(--blues);color:#0880bf}
.status.mastered{background:var(--oks);color:var(--okd)}
.word-table{width:100%;border-collapse:collapse;font-size:.92rem}
.word-table th,.word-table td{border-bottom:1px solid var(--border);padding:9px 8px;text-align:left;vertical-align:top}
.word-table th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.review-input{max-width:460px;margin:16px auto 0}
.review-input input{width:100%;border:2px solid var(--border);border-radius:12px;padding:12px 14px;background:#fff;color:var(--text);font:800 1rem 'Nunito',sans-serif;outline:none}
.review-input input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(88,204,2,.12)}
.choice-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.footer-note{margin-top:8px;font-size:.84rem;color:var(--muted);font-weight:700;text-align:center}
.answer-reveal-old{margin-top:14px;padding:14px;border-radius:14px;background:var(--gxs);border:2px solid var(--gs)}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:10px}
.checkbox-pill{display:flex;align-items:center;gap:7px;padding:9px 11px;border:2px solid var(--border);border-radius:12px;background:#fafcf9;cursor:pointer;font-size:.86rem;font-weight:700;font-family:inherit}
.checkbox-pill input{width:auto;margin:0;accent-color:var(--green)}
@keyframes pop-in{0%{transform:scale(.88);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}70%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}35%{transform:translateX(7px)}55%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cloze-prompt{font-size:clamp(1.1rem,3.5vw,1.8rem);font-weight:800;line-height:1.5;background:linear-gradient(135deg,#f0fde4,#e8f7ff);border:2px solid #b8e6a0;border-radius:14px;padding:16px 20px;margin:0 auto 4px;max-width:600px;text-align:center}
.cloze-blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--green);padding:0 8px;color:var(--green);font-style:italic}
.cloze-hint{font-size:.82rem;color:var(--muted);font-weight:700;margin-top:6px;font-style:italic}
.anim-pop{animation:pop-in .22s ease-out both}
.anim-shake{animation:shake .4s ease both}
@media(max-width:680px){
  /* Layout */
  .grid.cols-2{grid-template-columns:1fr}
  .content{padding:10px}
  .shell{border-radius:18px}
  .app{padding:0 8px 24px}
  .topbar{padding:18px 16px 22px}

  /* Nav — compact icon-only on very small, label+icon on normal mobile */
  .nav{padding:6px;gap:2px}
  .nav button{font-size:.68rem;padding:8px 2px 6px;border-radius:10px}
  .nav button .ni{font-size:1.25rem}

  /* Review card */
  .review-card{padding:16px 12px;margin:10px auto}
  .prompt{font-size:clamp(1.3rem,6vw,2rem)}
  .prompt.long{font-size:clamp(1rem,4.5vw,1.4rem)}

  /* Choices — full width on mobile for easy tapping */
  .choices{grid-template-columns:1fr;max-width:100%}
  .choice{padding:16px 14px;font-size:1rem}

  /* Session header */
  .session-header{padding:10px 12px;gap:8px}
  .session-prog-wrap{height:12px}
  .score-badge{font-size:.78rem;padding:4px 10px}

  /* Answer input — bigger touch target */
  .ans-wrap input{padding:16px;font-size:1rem;border-radius:12px}

  /* Buttons — min height for touch */
  .btn{min-height:44px;padding:10px 14px}
  .btn.primary{min-height:48px}
  .action-row{gap:8px}
  .action-row .btn{flex:1;justify-content:center;font-size:.9rem}

  /* Speak button */
  .speak-btn{width:100%;justify-content:center;padding:13px 20px}

  /* Lesson grid */
  .lesson-grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
  .lesson-tile{padding:8px 4px 7px;border-radius:12px}
  .lesson-tile .lt-num{font-size:.9rem}

  /* Pack chips */
  .pack-grid{grid-template-columns:1fr 1fr}
  .pack-chip{font-size:.8rem;padding:8px 9px}

  /* Builder */
  .builder-slots{flex-direction:column}
  .b-slot{min-width:auto;width:100%}
  .word-chips{gap:6px}
  .word-chip{font-size:.82rem;padding:7px 11px}

  /* Summary boxes */
  .summary-box .value{font-size:1.5rem}
  
  /* Session complete */
  .score-ring{width:90px;height:90px}
  .ring-pct{font-size:1.6rem}
  .complete-title{font-size:1.5rem}

  /* Stats bars */
  .stat-row{grid-template-columns:1fr 48px 80px;gap:6px}
  .stat-name{font-size:.82rem}
}

/* Extra-small screens */
@media(max-width:380px){
  .nav button{font-size:.62rem}
  .nav button .ni{font-size:1.1rem}
  .lesson-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}
  .choices{font-size:.92rem}
  .prompt{font-size:clamp(1.15rem,7vw,1.8rem)}
}
/* ── Sentence Builder ── */
.builder-sentence{min-height:72px;background:linear-gradient(135deg,#f0fde4,#e8f7ff);border:2px solid #b8e6a0;border-radius:18px;padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;position:relative}
.builder-sentence .bs-placeholder{color:#a0b090;font-weight:800;font-size:1rem;font-style:italic}
.builder-token{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--green);border-radius:999px;padding:7px 13px 7px 10px;font-weight:900;font-size:1rem;color:var(--gd);cursor:pointer;transition:all .12s;animation:pop-in .2s ease-out}
.builder-token:hover{background:var(--reds);border-color:var(--red);color:#aa0000}
.builder-token .bt-cat{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;opacity:.65;margin-right:2px}
.builder-neg{display:inline-flex;align-items:center;gap:6px;background:#ffe8e8;border:2px solid var(--red);border-radius:999px;padding:7px 13px;font-weight:900;font-size:1rem;color:#aa0000}
.builder-slots{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.b-slot{flex:1;min-width:140px;border:2px dashed var(--border-b);border-radius:14px;padding:10px 12px;min-height:52px;display:flex;align-items:center;gap:6px;transition:all .15s;background:#fafcf9;cursor:pointer}
.b-slot.active{border-color:var(--blue);background:var(--blues);box-shadow:0 0 0 3px rgba(28,176,246,.15)}
.b-slot.filled{border-style:solid;border-color:var(--green);background:var(--gxs)}
.b-slot.optional{border-color:#cbd5e1}
.b-slot-label{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.b-slot-value{font-size:.95rem;font-weight:900;color:var(--gd)}
.b-slot-empty{font-size:.85rem;color:#b0b8c8;font-weight:700;font-style:italic}
.word-bank-section{margin-bottom:14px}
.word-bank-label{font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:7px}
.word-chips{display:flex;flex-wrap:wrap;gap:7px}
.word-chip{border:2px solid var(--border);border-bottom:3px solid var(--border-b);border-radius:999px;padding:7px 14px;background:#fff;font-weight:800;font-size:.88rem;font-family:inherit;cursor:pointer;color:var(--text);transition:all .1s}
.word-chip:hover{border-color:#94a3b8;transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.07)}
.word-chip:active{border-bottom-width:1px;transform:translateY(1px)}
.word-chip.q{border-color:#c4b5fd;background:#f5f0ff;color:#6d28d9}
.word-chip.c{border-color:#93c5fd;background:#eff6ff;color:#1d4ed8}
.word-chip.i{border-color:#86efac;background:#f0fdf4;color:#166534}
.word-chip.e{border-color:#fcd34d;background:#fffbeb;color:#92400e}
.word-chip.sel{opacity:.4;pointer-events:none}
.builder-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.neg-toggle{display:flex;align-items:center;gap:8px;padding:8px 14px;border:2px solid var(--border);border-radius:999px;font-weight:800;font-size:.88rem;cursor:pointer;background:#fff;font-family:inherit;transition:all .12s}
.neg-toggle.on{background:var(--reds);border-color:var(--red);color:#aa0000}

// ── Utilities ─────────────────────────────────────────────────────────────────
const uid      = () => Math.random().toString(36).slice(2,11);
const todayISO = () => new Date().toISOString();
const addDays  = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r.toISOString(); };
const norm     = t => String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[?!.,;:()"']/g,'').replace(/\s+/g,' ').trim();
// normLoose also removes any (parenthetical) content — so "good night" matches
// the stored answer "good night (going to bed)". Used only for typed-answer checking.
const normLoose = t => norm(String(t||'').replace(/\([^)]*\)/g,' '));
// wordKey identifies a word. Unlike norm() it KEEPS accents, because in Italian they are
// the whole word: è (is) and e (and) are different words, as are tè (tea) and te (you).
// norm() is deliberately accent-blind for grading typed answers — never use it as identity.
const wordKey = t => String(t||'').toLowerCase().replace(/[?!.,;:¿¡]/g,'').replace(/\s+/g,' ').trim();
// splitAns splits a gloss into acceptable answers on "/" and ";" — but ONLY at the
// top level. A naive split breaks entries like "the (m. pl., before vowel / s+cons.)"
// into two nonsense halves, which made that word impossible to answer correctly.
const splitAns = t => {
  const out=[]; let cur='', depth=0;
  for(const ch of String(t??'')){
    if(ch==='(') depth++;
    else if(ch===')') depth=Math.max(0,depth-1);
    if((ch==='/'||ch===';') && depth===0){ out.push(cur); cur=''; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim()).filter(Boolean);
};
// Combine two glosses for the same Italian word, dropping meanings already covered.
// "are / they are" + "I am (identity)" → "are / they are / I am (identity)"
// "is / it is"     + "is (location)"   → "is / it is"   (already covered)
const mergeGloss = (a,b) => {
  const have = new Set(splitAns(a).map(normLoose));
  const add  = splitAns(b).filter(v => !have.has(normLoose(v)));
  return add.length ? [a, ...add].join(' / ') : a;
};
const shuffle  = a => { for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a; };
const esc      = t => String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

// ── Grading English answers on meaning, not wording ───────────────────────────
// An French → English card tests comprehension, not your English prose. "I want" and
// "I would like" are the same understanding. "Please do" and "Go ahead" are the same reply.
// Exact-string grading punishes the wrong thing, so English answers are canonicalised first:
// contractions expanded, articles and politeness dropped, everyday equivalents folded together.
// This will never be perfect — which is why a failed check offers self-assessment rather than
// a verdict. The matcher's job is to get the obvious cases right so you're rarely asked.
const EN_CONTRACTIONS = [
  // NB: norm() has already stripped apostrophes, so match the bare forms.
  // "ill" and "id" are deliberately absent — "ill" is a real word (malato).
  [/\bim\b/g,'i am'], [/\bive\b/g,'i have'], [/\bweve\b/g,'we have'],
  [/\byoure\b/g,'you are'], [/\bits\b/g,'it is'], [/\bthats\b/g,'that is'],
  [/\bwhats\b/g,'what is'], [/\bhows\b/g,'how is'], [/\btheres\b/g,'there is'],
  [/\bdont\b/g,'do not'], [/\bdoesnt\b/g,'does not'], [/\bisnt\b/g,'is not'],
  [/\barent\b/g,'are not'], [/\bcant\b/g,'cannot'], [/\bwont\b/g,'will not'],
  [/\bhavent\b/g,'have not'], [/\bhasnt\b/g,'has not'], [/\blets\b/g,'let us'],
];
// First entry in each group is the canonical form; the rest fold into it.
const EN_EQUIV = [
  ['i would like','i want','i will have','i would love','i would like to have','id like','id love','ill have','ill take','i will take'],
  ['may i','can i','could i','am i allowed to'],
  ['go ahead','please do','after you','be my guest','go right ahead'],
  ['of course','sure','certainly','naturally'],
  ['excuse me','pardon me','pardon'],
  ['you are welcome','not at all','do not mention it','no problem','my pleasure','it is nothing'],
  ['get through','pass','come through','get by','get past'],
  ['hello','hi','hey'],
  ['goodbye','bye'],
  ['thank you','thanks'],
  ['how is it going','how are you','how are things','how goes it'],
  ['everything is fine','everything is good','all is well','all good'],
  ['right away','immediately','straight away','at once'],
  ['maybe','perhaps','possibly'],
  ['okay','ok','alright','all right'],
  ['nice to meet you','pleased to meet you','a pleasure','pleasure to meet you'],
  ['see you later','see you soon','see you afterwards','catch you later'],
  ['the bill','the check'],
  ['i do not know','no idea'],
  ['one moment','just a moment','a moment'],
];
// Longest alternatives first, so "i would like" folds before the shorter "like" ever could.
const EN_RULES = EN_EQUIV
  .flatMap(([canon, ...alts]) => alts.map(alt => ({alt, canon})))
  .sort((a,b) => b.alt.length - a.alt.length)
  .map(r => ({re: new RegExp('\\b' + r.alt.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','g'), canon: r.canon}));
// Words that carry no meaning for grading purposes.
const EN_FILLER = new Set(['a','an','the','please','just','some','kindly','oh','well','so']);

function canonEn(s) {
  let x = normLoose(s);                                   // lowercase, no accents, no (parentheticals)
  for(const [re,to] of EN_CONTRACTIONS) x = x.replace(re,to);
  for(const {re,canon} of EN_RULES)     x = x.replace(re,canon);
  return x.split(/\s+/).filter(w => w && !EN_FILLER.has(w)).join(' ');
}

// Levenshtein similarity, 0–1. Catches typos and small word-order wobbles.
function similar(a,b) {
  if(a === b) return 1;
  if(!a.length || !b.length) return 0;
  let prev = Array.from({length:b.length+1}, (_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1));
    prev = cur;
  }
  return 1 - prev[b.length] / Math.max(a.length, b.length);
}

const sortTokens = s => s.split(' ').filter(Boolean).sort().join(' ');

// lang: 'it' → you're producing Italian, so spelling counts (accents excepted).
//       'en' → you're showing you understood, so meaning counts.
function answerMatches(typed, answer, lang='it') {
  if(!String(typed||'').trim()) return false;
  const variants = splitAns(answer);
  if(variants.map(norm).includes(norm(typed))) return true;
  if(variants.map(normLoose).includes(normLoose(typed))) return true;
  if(lang !== 'en') return false;

  const ct = canonEn(typed);
  if(!ct) return false;
  for(const v of variants) {
    const cv = canonEn(v);
    if(!cv) continue;
    if(ct === cv) return true;                       // same meaning
    if(sortTokens(ct) === sortTokens(cv)) return true;  // same words, different order
    if(similar(ct, cv) >= 0.87) return true;         // typo / near-miss
  }
  // Some glosses list several meanings ("hello / hi"); accept the lot typed together.
  return canonEn(variants.join(' ')) === ct;
}

// ── Word factory ──────────────────────────────────────────────────────────────
// pack=null means core lesson word; pack='Pack name' means expansion word
const makeWord = (lessonId,sp,en,pack=null) =>
  ({id:uid(),lessonId,italian:sp,english:en,pack,attempts:0,correct:0,level:0,dueAt:todayISO(),lastReviewedAt:'',mastered:false});

// ── Build seeded lessons from RAW + RAW_OTHER ────────────────────────────────
// Each lesson carries a `course` field: '3MS' (Three Minute Italian)
// or 'OTHER' (video/article notes). OTHER uses 2001+ so ids never collide.
const OTHER_ID_OFFSET = 2000;
// Thematic titles for the French lessons (teacher's focus: conversation, directions, restaurant).
const LESSON_TITLES = {
  1:'Greetings & politeness',
  2:'Getting to know you',
  3:'How are you?',
  4:'Numbers',
  5:'Yes, no & useful words',
  6:'Asking questions',
  7:'At the café',
  8:'At the restaurant',
  9:'Ordering & paying',
  10:'Asking directions',
  11:'Understanding directions',
  12:'Places in town',
  13:'Days & time',
  14:'Useful verbs',
};
function buildSeeded() {
  const out = [];
  // 3 Minute French lessons
  for(const [id, core, packs={}] of RAW){
    out.push({
      id, course:'3MS', title: LESSON_TITLES[id] || `Lesson ${id}`, shortLabel:String(id),
      vocab: [
        ...core.map(([sp,en]) => makeWord(id,sp,en,null)),
        ...Object.entries(packs).flatMap(([label,words]) => words.map(([sp,en]) => makeWord(id,sp,en,label)))
      ]
    });
  }
  // Fill empty 3MS lessons up to MAX_LESSON so the grid stays a tidy progression
  const has3MS = new Set(out.map(l=>l.id));
  for(let i=1;i<=MAX_LESSON;i++) if(!has3MS.has(i)) out.push({id:i,course:'3MS',title:LESSON_TITLES[i]||`Lesson ${i}`,shortLabel:String(i),vocab:[]});
  // Other Sources — separate id namespace (2001, 2002, …)
  for(const [ep, core, packs={}, meta={}] of RAW_OTHER){
    const id = OTHER_ID_OFFSET + ep;
    out.push({
      id,
      course:'OTHER',
      title: meta.title || `Notes ${ep}`,
      shortLabel: meta.shortLabel || `OS${ep}`,
      vocab: [
        ...core.map(([sp,en]) => makeWord(id,sp,en,null)),
        ...Object.entries(packs).flatMap(([label,words]) => words.map(([sp,en]) => makeWord(id,sp,en,label)))
      ]
    });
  }
  // Sort: 3MS first by id, then Other Sources.
  // NB: `||` is wrong here — courseOrder['3MS'] is 0, and 0 || 9 === 9, which silently
  // sorted the whole main course *after* Other Sources. Use ?? so 0 survives.
  const courseOrder = {'3MS':0, 'OTHER':1};
  return out.sort((a,b)=> (a.course===b.course ? a.id-b.id : (courseOrder[a.course] ?? 9) - (courseOrder[b.course] ?? 9)));
}

// ── Merge seeded with saved progress ──────────────────────────────────────────
// Preserves SRS data for existing words; adds newly seeded words; migrates old notes-based words.
function mergeSeeded(seeded, saved) {
  if(!saved?.length) return seeded;
  const savedMap = new Map(saved.map(l=>[+l.id,l]));
  return seeded.map(sl => {
    const sv = savedMap.get(sl.id);
    if(!sv) return sl;
    const seedLookup = new Map(sl.vocab.map(w=>[`${norm(w.italian)}|${norm(w.english)}`,w]));
    const merged = sv.vocab.map(savedWord => {
      // Older builds stored the Italian text under the inherited `spanish` key.
      // Read it once, then save only the corrected `italian` key going forward.
      const italian = savedWord.italian ?? savedWord.spanish ?? '';
      const w = {...savedWord, italian};
      delete w.spanish;
      const seed = seedLookup.get(`${norm(w.italian)}|${norm(w.english)}`);
      // pack is structural (defined by code) — always take seed value if available so that
      // re-seeding (e.g. splitting 'Numbers' into 'Numbers 0–20' / '21–99' / '100+') migrates correctly.
      // id must always be valid: backfill from the seed word, or mint a fresh one, so that
      // words saved by older buggy versions (id:undefined) don't collapse together in selectedWords().
      const id = (w.id!=null && w.id!=='') ? w.id : (seed?.id ?? uid());
      return {...w, id, pack: seed?.pack ?? w.pack ?? null, _existsInSeed:!!seed};
    }).filter(w => w._existsInSeed || !w.pack).map(w => { delete w._existsInSeed; return w; });
    const seen = new Set(merged.map(w=>`${norm(w.italian)}|${norm(w.english)}`));
    sl.vocab.filter(w=>!seen.has(`${norm(w.italian)}|${norm(w.english)}`)).forEach(w=>merged.push(w));
    // saved values for selection state, but structural fields (course, title, shortLabel) come from seed
    return {...sv, ...sl, vocab:merged};
  });
}

// ── App state ─────────────────────────────────────────────────────────────────
const state = {
  tab:'practice', lessons:[], selLessons:[], selPacks:[],
  started:false,
  rev:{queue:[],idx:0,correct:0,total:0,reveal:false,typed:'',lastResult:'',showPraise:null},
  phraseProgress:[], // SRS progress per phrase, indexed parallel to PHRASES
  phraseRev:{queue:[],idx:0,correct:0,total:0,reveal:false,typed:'',lastResult:'',started:false},
  verbDrill:{queue:[],idx:0,reveal:false,correct:0,total:0}, // simple drill, no SRS
  numDrill:{active:false,stage:'order',group:0,idx:0,reveal:false,correct:0,total:0,queue:null,order:null,match:null}, // Numbers Studio
  scenario:{active:false,id:null,step:0,correct:0,total:0,picked:null,choiceOrder:null,transcript:[]}, // conversation scenarios
  scenarioBest:{}, // per-scenario best first-try accuracy
  sent:{active:false,label:'',list:[],idx:0,revealed:false}, // sentence rhythm listening
  wordUI:{q:'',src:'all',filter:'all',open:new Set(),focus:false,caret:0}, // Words reference tab
  challengeProgress:[], // {correct, attempts} per CHALLENGES index; 3 correct = star
};

function initPhraseProgress(saved=[]) {
  return PHRASES.map((_,i)=>saved[i]||{level:0,attempts:0,correct:0,dueAt:todayISO(),mastered:false});
}

function initChallengeProgress(saved=[]) {
  return CHALLENGES.map((_,i)=>saved[i]||{correct:0,attempts:0});
}

function saveState() { localStorage.setItem(STORAGE_KEY,JSON.stringify({lessons:state.lessons,selLessons:state.selLessons,selPacks:state.selPacks,phraseProgress:state.phraseProgress,challengeProgress:state.challengeProgress,listenFirst:!!state.listenFirst,scenarioBest:state.scenarioBest||{}})); }

function loadState() {
  const seeded = buildSeeded();
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){ state.lessons=seeded; state.selLessons=defaultLessonIds(seeded); state.selPacks=[]; state.phraseProgress=initPhraseProgress(); state.challengeProgress=initChallengeProgress(); return; }
  try {
    const p = JSON.parse(raw);
    state.lessons          = mergeSeeded(seeded, p.lessons||[]);
    state.selLessons       = (p.selLessons||[]).map(Number);
    const availablePackKeys = new Set(state.lessons.flatMap(l => l.vocab.filter(w=>w.pack).map(w=>`${l.id}::${w.pack}`)));
    state.selPacks         = (p.selPacks||[]).filter(k=>availablePackKeys.has(k));
    state.phraseProgress   = initPhraseProgress(p.phraseProgress||[]);
    state.challengeProgress= initChallengeProgress(p.challengeProgress||[]);
    state.listenFirst      = !!p.listenFirst;
    state.scenarioBest     = p.scenarioBest||{};

  } catch { state.lessons=seeded; state.selLessons=defaultLessonIds(seeded); state.selPacks=[]; state.phraseProgress=initPhraseProgress(); state.challengeProgress=initChallengeProgress(); }
}

// ── Data helpers ──────────────────────────────────────────────────────────────
const getLesson       = id  => state.lessons.find(l=>l.id===+id);
const allWords        = ()  => state.lessons.flatMap(l=>l.vocab.map(w=>({...w,lessonTitle:l.title})));
const coreWords       = id  => getLesson(id)?.vocab.filter(w=>!w.pack)||[];
const defaultLessonIds= (lessons=state.lessons) => lessons.filter(l=>coreWords(l.id).length && (l.course||'3MS')==='3MS').map(l=>l.id);
const selLessons      = ()  => [...new Set(state.selLessons.map(Number))].sort((a,b)=>a-b);
const selPacks        = ()  => [...new Set((state.selPacks||[]).filter(Boolean))];
const packKey         = s   => `${s.lessonId}::${s.label}`;
const parseKey        = k   => { if(!k) return {lessonId:0,label:''}; const [id,...rest]=k.split('::'); return {lessonId:+id,label:rest.join('::')}; };
const packWords       = s   => getLesson(s.lessonId)?.vocab.filter(w=>w.pack===s.label)||[];
const getStatus       = w   => w.mastered||w.level>=6?'mastered':w.level>=3?'strong':w.level>=1?'learning':'new';
const isDue           = w   => !w.dueAt||new Date(w.dueAt)<=new Date();

// Derive available expansion packs from lesson data (no separate config array needed)
function allPacks() {
  const seen=new Set(), packs=[];
  for(const l of state.lessons)
    for(const w of l.vocab)
      if(w.pack){ const k=packKey({lessonId:l.id,label:w.pack}); if(!seen.has(k)){seen.add(k);packs.push({lessonId:l.id,label:w.pack});} }
  return packs;
}

// One card per Italian word, not one per lesson entry.
// The course deliberately re-teaches words (voglio appears in L7, L9 and L32; the whole
// of L32 is a recap). Keying on word.id made each copy a separate card, so you drilled
// "voglio" three times a session — and worse, an MCQ for "sono" could offer both
// "they are" and "are / they are" as options with only one graded correct.
// Here duplicates collapse into a single card whose gloss carries every distinct meaning
// and whose SRS state is the furthest-along copy.
function selectedWords() {
  const map = new Map();                       // key: accent-sensitive Italian
  const add = (w, title) => {
    const k = wordKey(w.italian);
    const prev = map.get(k);
    if(!prev){ map.set(k, {...w, lessonTitle:title}); return; }
    // Merge the meanings, keep whichever copy has more progress behind it.
    const english = mergeGloss(prev.english, w.english);
    const better  = (w.level > prev.level || (w.level === prev.level && w.attempts > prev.attempts)) ? w : prev;
    map.set(k, {...better, english, lessonTitle: prev.lessonTitle});
  };
  selLessons().forEach(id => coreWords(id).forEach(w => add(w, getLesson(id)?.title || '')));
  selPacks().forEach(k => { const s = parseKey(k); packWords(s).forEach(w => add(w, getLesson(s.lessonId)?.title || '')); });
  return [...map.values()];
}

// ── SRS: update word after review ─────────────────────────────────────────────
// A word reviewed once is a word learned everywhere it appears. Because the same Italian
// word is seeded in several lessons, we apply the result to every copy — otherwise the
// duplicate sitting in L32's recap would stay "new" forever and peg that lesson's
// mastery bar below 100% no matter how well you knew the words.
function reviewWord(id,rating) {
  let target = null;
  for(const l of state.lessons){ const w = l.vocab.find(v=>v.id===id); if(w){ target = w; break; } }
  if(!target) return;
  const key = wordKey(target.italian), now = todayISO();

  for(const l of state.lessons) {
    for(let i=0;i<l.vocab.length;i++) {
      const w = l.vocab[i];
      if(wordKey(w.italian) !== key) continue;
      const n = {...w, attempts:w.attempts+1, lastReviewedAt:now};
      if(rating==='again'){ n.level=Math.max(0,n.level-1); n.dueAt=todayISO(); }
      if(rating==='hard') { n.correct++; n.level=Math.min(6,n.level+1); n.dueAt=addDays(now,INTERVALS[Math.max(1,n.level)]||1); }
      if(rating==='good') { n.correct++; n.level=Math.min(6,n.level+2); n.dueAt=addDays(now,INTERVALS[Math.min(6,n.level)]||3); }
      if(rating==='easy') { n.correct++; n.level=Math.min(6,n.level+3); n.dueAt=addDays(now,(INTERVALS[Math.min(6,n.level)]||7)+7); }
      n.mastered = n.level>=6;
      l.vocab[i] = n;
    }
  }
  saveState();
}

// ── Session bar (two-color) + per-session log ────────────────────────────────
function updateSessionBar() {
  const rev=state.rev; if(!rev.queue||!rev.queue.length) return;
  const prog=Math.min(1,rev.idx/rev.queue.length);
  const acc=rev.total?rev.correct/rev.total:1;
  const ok=document.querySelector('.session-bar.ok');
  const miss=document.querySelector('.session-bar.miss');
  if(ok) ok.style.width=(prog*acc*100).toFixed(1)+'%';
  if(miss) miss.style.width=(prog*(1-acc)*100).toFixed(1)+'%';
  const badge=document.querySelector('#practiceSection .score-badge'); if(badge) badge.textContent='⭐ '+rev.correct;
}

function logSession(id, rating) {
  const rev=state.rev; if(!rev.slog) rev.slog={good:new Set(),again:new Set(),mastered:new Set()};
  if(rating==='good'){
    rev.slog.good.add(id);
    for(const l of state.lessons){ const w=l.vocab.find(v=>v.id===id); if(w){ if(w.level>=6) rev.slog.mastered.add(id); break; } }
  } else {
    rev.slog.again.add(id);
  }
}

// ── Review card builder ───────────────────────────────────────────────────────
// `src` is the word being asked about. The pool can fall back to allWords(), which is NOT
// deduped, so without this guard an MCQ for "sono" could list both "they are" (correct)
// and "are / they are" (also correct, but graded wrong). Skip any pool entry that is the
// same Italian word, and any distractor whose meaning overlaps the right answer.
function sampleChoices(correct,pool,field,n=4,src=null) {
  const choices=[correct], seen=new Set([norm(correct)]);
  const answerMeanings = new Set(splitAns(correct).map(normLoose));
  for(const w of shuffle([...pool])) {
    if(src && wordKey(w.italian)===wordKey(src.italian)) continue;    // same word, other gloss
    const v = field==='italian' ? w.italian : w.english;
    if(!v || seen.has(norm(v))) continue;
    if(field==='english' && splitAns(v).some(m=>answerMeanings.has(normLoose(m)))) continue; // synonymous
    seen.add(norm(v)); choices.push(v);
    if(choices.length>=n) break;
  }
  return shuffle(choices);
}

function buildCard(word,i,pool) {
  const p   = pool.length>=4?pool:allWords();
  const dir = i%2===0?'it-en':'en-it';
  // cloze = gap-fill in a real sentence context (~1 in 5 cards when phrases available)
  const hasPhrases = typeof PHRASES !== 'undefined' && PHRASES.length > 0;
  // Equal distribution — each type ~20%
  const types = p.length>=4
    ? (hasPhrases ? ['typed','mcq','listen','dictation','cloze'] : ['typed','mcq','listen','dictation'])
    : ['typed','mcq','listen'];
  let ex  = types[0|Math.random()*types.length];
  // Listening-first mode: force audio-driven card types.
  if(state.listenFirst && !['listen','dictation'].includes(ex)) ex = Math.random()<0.5?'listen':'dictation';
  // Word context — a real phrase containing this word, shown on Italian→English cards.
  let ctx=null;
  if(dir==='it-en' && (ex==='typed'||ex==='mcq') && hasPhrases){
    const spc=word.italian.toLowerCase().replace(/[?!.,;:]/g,'').trim();
    if(spc && spc.length>1){
      const spcEsc=spc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const cb="(?:^|[^a-zàèéìíòóùú0-9])", cbe="(?:$|[^a-zàèéìíòóùú0-9])";
      const cre=new RegExp(cb+spcEsc+cbe,'i');
      const cm=PHRASES.filter(([psp])=>psp.toLowerCase()!==spc && cre.test(psp.toLowerCase()));
      if(cm.length) ctx=cm[0|Math.random()*cm.length][0];
    }
  }
  if(ex==='cloze'){
    // Find a phrase containing this Italian word as a WHOLE word (not a substring in another word).
    // This prevents partial blanks like "me__" matching "mesa", or blanking "es" inside "peres".
    const sp = word.italian.toLowerCase().replace(/[?!.,;:]/g,'').trim();
    // Build a regex that matches the word surrounded by non-letter boundaries.
    // We use a custom boundary instead of \b because \b is ASCII-only and breaks on Italian accents.
    // Allowed chars in a Italian "word" for boundary purposes: letters, digits, accents, ñ.
    const spEsc = sp.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const boundary = "(?:^|[^a-zàèéìíòóùú0-9])";
    const boundaryEnd = "(?:$|[^a-zàèéìíòóùú0-9])";
    const wholeRe = new RegExp(boundary + "(" + spEsc + ")" + boundaryEnd, 'i');
    const matching = PHRASES.filter(([psp])=>wholeRe.test(psp.toLowerCase()));
    if(matching.length){
      const [psp,pen] = matching[0|Math.random()*matching.length];
      // Replace only the first whole-word occurrence, keeping the surrounding boundaries intact.
      const replaceRe = new RegExp("(" + boundary + ")(" + spEsc + ")(" + boundaryEnd + ")", 'i');
      const blanked = psp.replace(replaceRe, (_, a, _b, c) => a + '_____' + c);
      if(blanked !== psp && sp){
        return {...word,ex:'cloze',answerLang:'it',promptLabel:'Fill in the blank',
          taskText:'Type the missing French word.',
          prompt:blanked, answer:sp||word.italian, speak:psp, ph:'Type the missing word…',
          hint:`Sentence: "${pen}"`};
      }
    }
    // Fallback to mcq
    return dir==='it-en'
      ? {...word,ex:'mcq',promptLabel:'Multiple choice: French → English',taskText:'Choose the correct English meaning.',prompt:word.italian,answer:word.english||'',speak:word.italian,choices:sampleChoices(word.english,p,'english',4,word)}
      : {...word,ex:'mcq',promptLabel:'Multiple choice: English → French',taskText:'Choose the correct French word.',prompt:word.english,answer:word.italian||'',speak:word.italian,choices:sampleChoices(word.italian,p,'italian',4,word)};
  }
  if(ex==='listen')    return {...word,ex,promptLabel:'Listening recognition',taskText:'Tap Play French, then choose the English meaning.',prompt:'Listen to the French word.',answer:word.english||'',speak:word.italian,choices:sampleChoices(word.english,p,'english',4,word)};
  if(ex==='dictation') return {...word,ex,answerLang:'it',promptLabel:'Dictation',taskText:'Tap Play French, then type what you hear.',prompt:word.english||'',answer:word.italian||'',speak:word.italian,ph:'Type the French you hear.'};
  if(ex==='mcq') return dir==='it-en'
    ? {...word,ex,promptLabel:'Multiple choice: French → English',taskText:'Choose the correct English meaning.',prompt:word.italian,answer:word.english||'',speak:word.italian,choices:sampleChoices(word.english,p,'english',4,word),context:ctx}
    : {...word,ex,promptLabel:'Multiple choice: English → French',taskText:'Choose the correct French word.',prompt:word.english,answer:word.italian||'',speak:word.italian,choices:sampleChoices(word.italian,p,'italian',4,word)};
  return dir==='it-en'
    ? {...word,ex:'typed',answerLang:'en',promptLabel:'Typed recall: French → English',taskText:'Type the English meaning.',prompt:word.italian,answer:word.english||'',speak:word.italian,ph:'Type the English meaning.',context:ctx}
    : {...word,ex:'typed',answerLang:'it',promptLabel:'Typed recall: English → French',taskText:'Type the French answer.',prompt:word.english,answer:word.italian||'',speak:word.italian,ph:'Type the French answer.'};
}


// ── Which sentences are you allowed to be asked to WRITE? ────────────────────
// Some PHRASES contain words the course never teaches (messo, scritto, cattedrale,
// cappotto…). Asking you to recognise them is a useful stretch; demanding you type them
// from memory is just unfair. isProducible() reports whether every word in a sentence
// has been taught somewhere in the vocab — if not, that sentence is only ever shown
// French → English.
let _taughtIndex = null;
const PROPER_NOUNS = new Set(['marie','alex','montréal','montreal','québec','quebec','canada','paris']);
const stripElision = t => t.replace(/^(?:j|l|d|n|c|m|t|s|qu)['\u2019]/i, '');   // j'ai → ai, l'eau → eau, qu'est → est
const itTokens = s => String(s||'')
  .replace(/«[^»]*»/g,' ').replace(/"[^"]*"/g,' ')  // ignore quoted English: comment dit-on « thank you » ?
  .toLowerCase()
  .replace(/[¿?¡!.,;:()"«»]/g,' ')
  .split(/[\s'\u2019-]+/).filter(Boolean);          // split on apostrophe & hyphen too (dix-sept, l'eau)

function taughtIndex() {
  if(_taughtIndex) return _taughtIndex;
  _taughtIndex = new Set();
  const addForms = t => {
    _taughtIndex.add(t);
    // French inflects for gender/number and the vocab lists one form. If "fatigué" is taught,
    // "fatiguée / fatigués / fatiguées" are the same word; if "ami" is taught, "amis" is too.
    if(t.length > 2) {
      _taughtIndex.add(t + 's');                    // plural
      if(/é$/.test(t)) { _taughtIndex.add(t+'e'); _taughtIndex.add(t+'es'); }  // fatigué→fatiguée(s)
      if(/e$/.test(t)) _taughtIndex.add(t+'s');     // rouge→rouges
      if(/s$/.test(t)) _taughtIndex.add(t.slice(0,-1));  // legumes→legume
    }
  };
  for(const l of state.lessons)
    for(const w of l.vocab)
      for(const t of itTokens(w.italian)){ addForms(t); addForms(stripElision(t)); }
  return _taughtIndex;
}

function isProducible(sentence) {
  const taught = taughtIndex();
  return itTokens(sentence).every(t =>
    /^\d+$/.test(t) || PROPER_NOUNS.has(t) || taught.has(t) || taught.has(stripElision(t))
  );
}

// ── Lesson sentences + Match-the-pairs (built into Practice queue) ────────
function buildPhraseCards() {
  if(typeof PHRASES === 'undefined' || !PHRASES.length) return [];
  const selWords = selectedWords();
  if(!selWords.length) return [];
  // Use the raw lesson selection, not the deduped words: L32 is pure recap, so every one
  // of its words collapses into an earlier lesson and its id would never survive here.
  const sel = new Set(selLessons());
  const eligible = [];
  PHRASES.forEach((p, idx) => {
    if(!p || p.length < 2) return;
    const sp = p[0], en = p[1], lesson = p[2];
    if(!lesson || !sel.has(lesson)) return;
    // Same rule as vocab: an Other Sources sentence you've never seen gets shown to you
    // (French → English) before it's ever demanded of you.
    const seen  = (state.phraseProgress[idx]?.attempts || 0) > 0;
    const fresh = (isOtherLesson(lesson) || isUnheardCore(lesson)) && !seen;
    eligible.push({sp, en, lesson, idx, fresh, safe: isProducible(sp)});
  });
  if(!eligible.length) return [];
  const phraseDue = i => {
    const pr = state.phraseProgress && state.phraseProgress[i];
    return !pr || !pr.dueAt || pr.dueAt <= todayISO();
  };
  const due = eligible.filter(e => phraseDue(e.idx));
  const pool = due.length ? due : eligible;
  // Up to 5 phrase cards per session; more for larger lesson selections
  const cap = Math.min(5, Math.max(2, Math.ceil(sel.size * 0.8)));
  const picks = shuffle([...pool]).slice(0, Math.min(cap, pool.length));
  return picks.map((p, i) => {
    // Alternate direction — but never ask for production of a sentence with untaught words.
    const dir = (!p.safe || p.fresh || i % 2 === 0) ? 'it-en' : 'en-it';
    return {
      ex: 'phrase',
      srsType: 'phrase',
      phraseIdx: p.idx,
      id: 'phrase_' + p.idx,
      italian: p.sp,
      english: p.en,
      lessonId: p.lesson,
      lessonTitle: 'Lesson ' + p.lesson + ' sentence',
      answerLang: dir === 'it-en' ? 'en' : 'it',
      promptLabel: dir === 'it-en' ? 'Sentence: French → English' : 'Sentence: English → French',
      taskText: dir === 'it-en' ? 'Type the English meaning.' : 'Type the French sentence.',
      prompt: dir === 'it-en' ? p.sp : p.en,
      answer: dir === 'it-en' ? p.en : p.sp,
      speak: p.sp,
      ph: dir === 'it-en' ? 'Type the English…' : 'Type the French sentence…',
    };
  });
}

function buildMatchCard(words, opts = {}) {
  if(!words || words.length < 2) return null;
  const pairs = words.slice(0, 4).map((w, i) => ({pairId: i, sp: w.italian, en: w.english, wordId: w.id}));
  const chips = [
    ...pairs.map(p => ({type:'sp', text: p.sp, pairId: p.pairId, wordId: p.wordId})),
    ...pairs.map(p => ({type:'en', text: p.en, pairId: p.pairId, wordId: p.wordId})),
  ];
  return {
    ex: 'match',
    srsType: 'match',
    id: 'match_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    chips: shuffle(chips),
    pairs,
    warmup: !!opts.warmup,
    promptLabel: opts.warmup ? '🌱 Meet the words' : 'Match the pairs',
    lessonTitle: opts.warmup ? 'New vocabulary' : `${pairs.length}-pair quick review`,
    taskText: opts.warmup
      ? 'These are new. Both sides are here — pair them up and read them.'
      : 'Tap an French word, then its English meaning.',
  };
}

// ── Warm-up: meet the words before being tested on them ──────────────────────
// The podcast introduces the words in lessons 1–45, so those go straight into the mix.
// Nothing introduces the expansion packs or the Other Sources lists — so the first time
// a word from those turns up, it arrives with its meaning attached (matching), then as
// recognition (multiple choice, listening). No typing, no dictation, no cloze: you can't
// recall what you've never been shown.
const isOtherLesson = id => (getLesson(id)?.course || '3MS') === 'OTHER';
// The podcast introduces the early lessons, so those skip the warm-up. But it only goes up
// to ~lesson 19 for now — from here on the lessons arrive unheard, so their core words are
// genuinely new and get the same "meet the words" intro as packs and Other Sources.
// Keyed on lesson number, not on "did you hear it": once a word has any practice history it
// stops re-introducing, so if you later catch up on the podcast it self-corrects.
const PODCAST_THROUGH = 0;   // no podcast for the French set — every lesson introduces its words
const isUnheardCore = id => (getLesson(id)?.course || '3MS') === '3MS' && id > PODCAST_THROUGH && id < 2000;
const needsIntro    = w  => w.attempts === 0 && (!!w.pack || isOtherLesson(w.lessonId) || isUnheardCore(w.lessonId));

function buildWarmup(fresh, pool) {
  if(!fresh.length) return [];
  const cards = [];

  // 1. Matching — Italian and English side by side. This IS the introduction.
  let rest = shuffle([...fresh]);
  while(rest.length >= 2) {
    const take = (rest.length === 5 || rest.length === 6) ? 3 : Math.min(4, rest.length);
    const m = buildMatchCard(rest.slice(0, take), {warmup: true});
    if(m) cards.push(m);
    rest = rest.slice(take);
  }

  // 2. Recognition — pick the meaning from options. Still supported, but now from memory.
  const p = pool.length >= 4 ? pool : allWords();
  shuffle([...fresh]).forEach((w, i) => {
    const kind = i % 3;
    const base = {...w, warmup: true};
    if(kind === 0) cards.push({...base, ex:'mcq',
      promptLabel:'🌱 New: French → English', taskText:'You just met this one. Which meaning is it?',
      prompt:w.italian, answer:w.english||'', speak:w.italian,
      choices:sampleChoices(w.english, p, 'english', 4, w)});
    else if(kind === 1) cards.push({...base, ex:'listen',
      promptLabel:'🌱 New: listening', taskText:'Tap Play, then choose the English meaning.',
      prompt:'Listen to the French word.', answer:w.english||'', speak:w.italian,
      choices:sampleChoices(w.english, p, 'english', 4, w)});
    else cards.push({...base, ex:'mcq',
      promptLabel:'🌱 New: English → French', taskText:'Which French word is it?',
      prompt:w.english, answer:w.italian||'', speak:w.italian,
      choices:sampleChoices(w.italian, p, 'italian', 4, w)});
  });

  return cards;
}

function buildQueue() {
  const words = selectedWords();
  if(!words.length){ state.rev.queue=[]; state.rev.idx=0; return false; }
  const due = words.filter(isDue), srcW = due.length?due:words;

  // Split off anything you've never met from a source that never introduced it.
  const fresh = srcW.filter(needsIntro);
  const known = srcW.filter(w => !needsIntro(w));
  const warmup = buildWarmup(fresh, words);

  // Fresh words are already covered by the warm-up, so the graded queue is the rest.
  const wordCards = shuffle(known.map((w,i)=>buildCard(w,i,words)));

  // Mix in lesson-sentence cards from selected lessons.
  const phraseCards = buildPhraseCards();
  const combined = [...wordCards];
  phraseCards.forEach((pc, i) => {
    if(combined.length < 2) { combined.push(pc); return; }
    const insertAt = Math.floor((i+1) * combined.length / (phraseCards.length+1));
    combined.splice(insertAt, 0, pc);
  });

  // Inject a Match-the-pairs card every ~7 cards, built from preceding 4 distinct vocab.
  const final = [];
  combined.forEach((card, i) => {
    final.push(card);
    if((i+1) % 7 === 0 && i < combined.length - 1) {
      const recent = [];
      // English "roots" — split on / and strip parentheticals so that e.g.
      // "everyone (m.) / all (m. pl.)" doesn't share a chip with "everyone / everybody".
      const engRoots = s => (s||'').split('/').map(x => x.replace(/\(.*?\)/g,'').trim().toLowerCase()).filter(Boolean);
      const sharesRoot = (a, b) => { const ra=engRoots(a), rb=engRoots(b); return ra.some(x => rb.includes(x)); };
      for(let j = final.length - 1; j >= 0 && recent.length < 4; j--) {
        const c = final[j];
        if(c.ex !== 'match' && c.ex !== 'phrase' && c.italian && c.english) {
          const dup = recent.some(r => r.id === c.id || r.italian === c.italian || sharesRoot(r.english, c.english));
          if(!dup) recent.push({italian: c.italian, english: c.english, id: c.id});
        }
      }
      if(recent.length === 4) {
        const m = buildMatchCard(recent);
        if(m) final.push(m);
      }
    }
  });

  state.rev = {queue: [...warmup, ...final], idx:0, correct:0, total:0, reveal:false, typed:'', lastResult:'', slog:null, warmupCount: warmup.length};
  state.match = null;
  return true;
}

// ── Weak Words: session from your lowest-accuracy words ──────────────────────
function buildWeakQueue() {
  let pool = selectedWords().filter(w=>w.attempts>0);
  if(pool.length<4) pool = allWords().filter(w=>w.attempts>0);
  if(pool.length<4) return false;
  const ranked=[...pool].sort((a,b)=>(a.correct/a.attempts)-(b.correct/b.attempts));
  const weak=ranked.slice(0,10);
  state.rev={queue:shuffle(weak.map((w,i)=>buildCard(w,i,pool))),idx:0,correct:0,total:0,reveal:false,typed:'',lastResult:'',slog:null};
  state.match=null;
  return true;
}

// ── Number drill: build mixed card queue from a group ─────────────────────────
function buildNumQueue(gi) {
  const g = NUM_GROUPS[gi];
  const allNums = NUM_GROUPS.flatMap(g2=>g2.pairs);
  const pool = allNums.map(([sp,en])=>({italian:sp,english:en}));
  // Look up real word objects from lesson 7 Numbers pack so SRS updates
  const numLesson = getLesson(7);
  const realWords = numLesson ? numLesson.vocab.filter(w=>w.pack&&w.pack.startsWith('Numbers')) : [];
  const findReal = sp => realWords.find(w=>norm(w.italian)===norm(sp));
  const types = ['typed','typed','mcq','listen','dictation'];
  return shuffle(g.pairs.map(([sp,en],i) => {
    const real = findReal(sp);
    const ex = types[i % types.length];
    // Use real word if found (so reviewWord() updates SRS), else fake id
    const word = real
      ? {...real, lessonTitle:'Numbers'}
      : {id:'num_'+gi+'_'+i, italian:sp, english:en, lessonTitle:'Numbers'};
    if(ex==='listen')    return {...word,ex,promptLabel:'Listening',taskText:'Tap Play, choose the English meaning.',
      prompt:'Listen to the number.',answer:word.english||en,speak:word.italian||sp,choices:sampleChoices(word.english||en,pool,'english',4,word)};
    if(ex==='dictation') return {...word,ex,promptLabel:'Dictation',taskText:'Tap Play, type what you hear.',
      prompt:word.english||en,answer:word.italian||sp,speak:word.italian||sp,ph:'Type the French number…'};
    if(ex==='mcq')       return {...word,ex,promptLabel:'Multiple choice',taskText:'Choose the correct English.',
      prompt:word.italian||sp,answer:word.english||en,speak:word.italian||sp,choices:sampleChoices(word.english||en,pool,'english',4,word)};
    return i%2===0
      ? {...word,ex:'typed',promptLabel:'Typed recall: French → English',taskText:'Type the English.',
          prompt:word.italian||sp,answer:word.english||en,speak:word.italian||sp,ph:'Type the English number…'}
      : {...word,ex:'typed',promptLabel:'Typed recall: English → French',taskText:'Type the French.',
          prompt:word.english||en,answer:word.italian||sp,speak:word.italian||sp,ph:'Type the French number…'};
  }));
}

    order:{chips:shuffle([...items]),next:0,locked:new Set(),wrong:null},
