function speakIt(text, rate=1){
  if('speechSynthesis' in window){ window.speechSynthesis.cancel(); window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(text),{lang:'it-IT',rate})); }
}

function startNumStudio(gi){
  const items = NUM_GROUPS[gi].pairs.map(([sp,en],i)=>({sp,en,val:NUM_VALUES[gi][i],origIdx:i}));
  state.numDrill = {active:true,stage:'order',group:gi,idx:0,reveal:false,correct:0,total:0,queue:null,
    order:{chips:shuffle([...items]),next:0,locked:new Set(),wrong:null},
    match:null};
  renderPractice();
}

function startNumMatch(){
  const nd=state.numDrill, gi=nd.group;
  const items = NUM_GROUPS[gi].pairs.map(([sp,en],i)=>({sp,en,val:NUM_VALUES[gi][i],origIdx:i}));
  const rounds=[]; const pool=shuffle([...items]);
  for(let i=0;i<pool.length;i+=4) rounds.push(pool.slice(i,i+4));
  // merge a lone last item into the previous round
  if(rounds.length>1 && rounds[rounds.length-1].length===1){ rounds[rounds.length-2].push(rounds.pop()[0]); }
  nd.stage='match';
  nd.match={rounds,round:0,chips:null,matched:new Set(),sel:null,wrong:null};
  buildMatchRound();
  renderPractice();
}

function buildMatchRound(){
  const m=state.numDrill.match;
  const items=m.rounds[m.round];
  m.chips=shuffle([
    ...items.map(it=>({kind:'digit',text:fmtNum(it.val),pid:it.origIdx,sp:it.sp})),
    ...items.map(it=>({kind:'word', text:it.sp,        pid:it.origIdx,sp:it.sp})),
  ]);
  m.matched=new Set(); m.sel=null; m.wrong=null;
}

function startNumQuiz(){
  const nd=state.numDrill;
  nd.stage='quiz'; nd.idx=0; nd.reveal=false; nd.correct=0; nd.total=0;
  nd.queue=buildNumQueue(nd.group);
  renderPractice();
}

function renderNumDrill() {
  const host = document.getElementById('numDrillArea');
  if(!host) return;
  const nd = state.numDrill;
  if(!nd.active){ host.innerHTML=''; return; }

  const g = NUM_GROUPS[nd.group];

  // ── Stage 1: put them in order ────────────────────────────────────────────
  if(nd.stage==='order'){
    const o=nd.order;
    const done=o.locked.size===o.chips.length;
    host.innerHTML=`<div class="card anim-pop">
      <div class="ex-label">
        <span class="pill blue">🔢 ${esc(g.label)} — Step 1 of 3</span>
        <span class="pill green">${o.locked.size}/${o.chips.length}</span>
        <button class="btn-icon" id="nStopBtn" title="Stop" style="margin-left:auto;">✕</button>
      </div>
      <div class="task-hint">Tap the numbers in order, smallest first. Each one is spoken as you get it.</div>
      <div class="match-grid" style="grid-template-columns:1fr 1fr 1fr;">
        ${o.chips.map((c,i)=>{
          const locked=o.locked.has(c.origIdx);
          let cls='match-chip it'+(locked?' matched':'')+(o.wrong===i?' wrong':'');
          return `<button class="${cls}" data-oi="${i}" style="${locked?'opacity:.75;':''}">${locked?fmtNum(c.val)+' · ':''}${esc(c.sp)}</button>`;
        }).join('')}
      </div>
      ${done
        ? `<div class="action-row" style="margin-top:14px;justify-content:center;"><button class="btn primary" id="nToMatchBtn">Step 2: Match →</button></div>`
        : `<div class="action-row" style="margin-top:10px;justify-content:center;"><button class="btn" id="nSkipStageBtn">Skip to matching</button></div>`}
    </div>`;
    host.querySelectorAll('[data-oi]').forEach(b=>b.addEventListener('click',()=>{
      if(done) return;
      const i=+b.dataset.oi, c=nd.order.chips[i];
      if(o.locked.has(c.origIdx)||o.wrong!==null) return;
      if(c.origIdx===o.next){
        o.locked.add(c.origIdx); o.next++;
        speakIt(c.sp);
        renderNumDrill();
      } else {
        o.wrong=i; renderNumDrill();
        setTimeout(()=>{ o.wrong=null; renderNumDrill(); },500);
      }
    }));
    document.getElementById('nToMatchBtn')?.addEventListener('click',startNumMatch);
    document.getElementById('nSkipStageBtn')?.addEventListener('click',startNumMatch);
    document.getElementById('nStopBtn')?.addEventListener('click',()=>{ nd.active=false; renderPractice(); });
    return;
  }

  // ── Stage 2: match digits ↔ words ─────────────────────────────────────────
  if(nd.stage==='match'){
    const m=nd.match;
    const items=m.rounds[m.round];
    const allDone=m.matched.size===items.length;
    const lastRound=m.round===m.rounds.length-1;
    host.innerHTML=`<div class="card anim-pop">
      <div class="ex-label">
        <span class="pill purple">🔢 ${esc(g.label)} — Step 2 of 3</span>
        <span class="pill yellow">Round ${m.round+1}/${m.rounds.length}</span>
        <span class="pill green">${m.matched.size}/${items.length}</span>
        <button class="btn-icon" id="nStopBtn" title="Stop" style="margin-left:auto;">✕</button>
      </div>
      <div class="task-hint">Tap a digit, then the Italian word that matches (or vice versa).</div>
      <div class="match-grid">
        ${m.chips.map((c,i)=>{
          let cls='match-chip '+(c.kind==='digit'?'en':'it');
          if(m.matched.has(c.pid)) cls+=' matched';
          else if(m.sel===i) cls+=' selected';
          else if(m.wrong&&(m.wrong.a===i||m.wrong.b===i)) cls+=' wrong';
          return `<button class="${cls}" data-mi="${i}">${esc(c.text)}</button>`;
        }).join('')}
      </div>
      ${allDone
        ? `<div class="action-row" style="margin-top:14px;justify-content:center;"><button class="btn primary" id="nMatchNextBtn">${lastRound?'Step 3: Quiz →':'Next round →'}</button></div>`
        : `<div class="action-row" style="margin-top:10px;justify-content:center;"><button class="btn" id="nSkipStageBtn">Skip to quiz</button></div>`}
    </div>`;
    host.querySelectorAll('[data-mi]').forEach(b=>b.addEventListener('click',()=>{
      if(allDone||m.wrong) return;
      const i=+b.dataset.mi, c=m.chips[i];
      if(m.matched.has(c.pid)) return;
      if(c.kind==='word') speakIt(c.sp);
      if(m.sel===null){ m.sel=i; renderNumDrill(); }
      else if(m.sel===i){ m.sel=null; renderNumDrill(); }
      else{
        const other=m.chips[m.sel];
        if(other.pid===c.pid && other.kind!==c.kind){
          m.matched.add(c.pid); m.sel=null; renderNumDrill();
        } else {
          m.wrong={a:m.sel,b:i}; renderNumDrill();
          setTimeout(()=>{ m.wrong=null; m.sel=null; renderNumDrill(); },550);
        }
      }
    }));
    document.getElementById('nMatchNextBtn')?.addEventListener('click',()=>{
      if(lastRound) startNumQuiz();
      else { m.round++; buildMatchRound(); renderNumDrill(); }
    });
    document.getElementById('nSkipStageBtn')?.addEventListener('click',startNumQuiz);
    document.getElementById('nStopBtn')?.addEventListener('click',()=>{ nd.active=false; renderPractice(); });
    return;
  }

  // ── Stage 3: quiz (mixed card types) ──────────────────────────────────────
  const card = nd.queue ? nd.queue[nd.idx] : null;
  const pct = nd.queue ? Math.round((nd.idx/nd.queue.length)*100) : 0;

  // Complete
  if(!card){
    const acc=nd.total?Math.round(nd.correct/nd.total*100):0;
    host.innerHTML=`<div class="card anim-pop" style="text-align:center;padding:24px 16px;">
      <div style="font-size:2.5rem;margin-bottom:4px;">${acc>=80?'🏆':acc>=60?'🎉':'📚'}</div>
      <div style="font-weight:900;font-size:1.2rem;margin-bottom:12px;">🔢 ${esc(g.label)} — done!</div>
      <div class="score-ring" style="margin:0 auto 16px;"><span class="ring-pct">${acc}%</span><span class="ring-label">correct</span></div>
      <div class="action-row" style="justify-content:center;">
        <button class="btn primary" id="nRepeatBtn">↺ Repeat</button>
        ${nd.group<NUM_GROUPS.length-1?'<button class="btn" id="nNextGroupBtn">Next group →</button>':''}
        <button class="btn" id="nStopBtn">✕ Stop</button>
      </div>
    </div>`;
    document.getElementById('nRepeatBtn')?.addEventListener('click',()=>{ nd.idx=0; nd.reveal=false; nd.correct=0; nd.total=0; nd.queue=buildNumQueue(nd.group); renderNumDrill(); renderPractice(); });
    document.getElementById('nNextGroupBtn')?.addEventListener('click',()=>{ startNumStudio(nd.group+1); });
    document.getElementById('nStopBtn')?.addEventListener('click',()=>{ nd.active=false; renderNumDrill(); renderPractice(); });
    return;
  }

  const isInput  = ['typed','dictation'].includes(card.ex);
  const isChoice = ['mcq','listen'].includes(card.ex);
  const exColors = {typed:'blue',mcq:'purple',listen:'yellow',dictation:'blue'};

  host.innerHTML=`<div class="card anim-pop">
    <div class="session-header" style="margin:-18px -18px 14px;border-radius:14px 14px 0 0;">
      <div class="session-prog-wrap"><div class="session-bar" style="width:${pct}%"></div></div>
      <div class="score-badge">⭐ ${nd.correct}</div>
      <button class="btn-icon" id="nStopBtn" title="Stop">✕</button>
    </div>
    <div class="ex-label">
      <span class="pill ${exColors[card.ex]||'blue'}">${esc(card.promptLabel)}</span>
      <span class="pill yellow">${nd.idx+1} / ${nd.queue.length}</span>
    </div>
    <div class="task-hint">${esc(card.taskText)}</div>
    <div class="prompt" style="font-size:clamp(1.5rem,5vw,2.4rem);">${esc(card.prompt)}</div>
    ${card.speak?'<div class="speak-row"><button class="speak-btn" id="nSpeakBtn">🔊 Play</button></div>':''}
    ${isInput?`<div class="ans-wrap"><input id="nAns" placeholder="${esc(card.ph||'Type your answer…')}" autocomplete="off" autocorrect="off" spellcheck="false"/></div>`:''}
    ${isChoice?`<div class="choices">${card.choices.map(c=>`<button class="choice" data-nc="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
    ${isInput?`<div class="action-row"><button class="btn primary" id="nCheckBtn">Check ✓</button><button class="btn" id="nRevealBtn">Show</button></div>`:''}
    ${nd.reveal?`<div class="answer-reveal anim-pop"><div class="reveal-label">Answer</div><div class="reveal-text">${esc(card.answer)}</div></div><div class="action-row"><button class="btn primary" id="nNextBtn">Next →</button></div>`:''}
  </div>`;

  // Events
  const nNextCard=()=>{ nd.idx++; nd.reveal=false; renderNumDrill(); renderPractice(); requestAnimationFrame(()=>{ const el=document.getElementById('nAns'); if(el) el.focus(); }); };
  document.getElementById('nStopBtn')?.addEventListener('click',()=>{ nd.active=false; renderNumDrill(); renderPractice(); });
  document.getElementById('nSpeakBtn')?.addEventListener('click',()=>{
    if('speechSynthesis'in window){window.speechSynthesis.cancel();window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(card.speak),{lang:'it-IT'}));}
  });
  const nInp=document.getElementById('nAns');
  if(nInp){ nInp.focus(); nInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('nCheckBtn')?.click();}}); }
  document.getElementById('nCheckBtn')?.addEventListener('click',()=>{
    const t=(document.getElementById('nAns')?.value||'').trim(); nd.total++;
    if(norm(t)===norm(card.answer)){
      nd.correct++;
      if(card.id && !String(card.id).startsWith('num_')) reviewWord(card.id,'good');
      nNextCard();
    } else { nd.reveal=true; renderNumDrill(); }
  });
  document.getElementById('nRevealBtn')?.addEventListener('click',()=>{ nd.total++; nd.reveal=true; renderNumDrill(); });
  document.getElementById('nNextBtn')?.addEventListener('click',nNextCard);
  host.querySelectorAll('[data-nc]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.clicked) return; b.dataset.clicked='1';
    nd.total++;
    if(norm(b.dataset.nc)===norm(card.answer)){
      b.classList.add('correct'); nd.correct++;
      if(card.id && !String(card.id).startsWith('num_')) reviewWord(card.id,'good');
      setTimeout(()=>nNextCard(), 700);
    } else {
      b.classList.add('wrong');
      host.querySelectorAll('[data-nc]').forEach(cb=>{ if(norm(cb.dataset.nc)===norm(card.answer)) cb.classList.add('correct'); });
      nd.reveal=true;
      setTimeout(()=>renderNumDrill(), 800);
    }
  }));
}

// ── Scenarios: conversation role-play ─────────────────────────────────────────
function startScenario(id){
  const sc=SCENARIOS.find(s=>s.id===id); if(!sc) return;
  state.scenario={active:true,id,step:0,correct:0,total:0,picked:null,choiceOrder:null,transcript:[]};
  renderPractice();
  const first=sc.steps[0]; if(first) setTimeout(()=>speakIt(first.npc),350);
}

function scenarioChoices(step, st){
  if(!st.choiceOrder){
    st.choiceOrder=shuffle([{t:step.good,ok:true,en:step.goodEn}, ...step.wrong.map(w=>({t:w.t,ok:false,why:w.why}))]);
  }
  return st.choiceOrder;
}

function renderScenario(){
  const host=document.getElementById('scenarioArea');
  if(!host) return;
  const st=state.scenario;
  if(!st.active){ host.innerHTML=''; return; }
  const sc=SCENARIOS.find(s=>s.id===st.id);
  const step=sc.steps[st.step];

  // Completed
  if(!step){
    const acc=st.total?Math.round(st.correct/st.total*100):0;
    state.scenarioBest=state.scenarioBest||{};
    if(acc>(state.scenarioBest[st.id]??-1)){ state.scenarioBest[st.id]=acc; saveState(); }
    host.innerHTML=`<div class="card anim-pop">
      <div style="text-align:center;padding:6px 0 2px;">
        <div style="font-size:2.5rem;">${acc>=90?'🏆':acc>=70?'🎉':'💪'}</div>
        <div style="font-weight:900;font-size:1.2rem;margin:4px 0 2px;">${sc.icon} ${esc(sc.title)} — complete!</div>
        <div class="muted small" style="margin-bottom:12px;">${acc}% on the first try. Here's the whole conversation:</div>
      </div>
      <div class="sc-transcript">
        ${st.transcript.map(t=>`
          <div class="sc-line them"><span class="sc-who">🇮🇹</span><span><strong>${esc(t.npc)}</strong><br><span class="muted small">${esc(t.npcEn)}</span></span></div>
          <div class="sc-line you"><span><strong>${esc(t.you)}</strong><br><span class="muted small">${esc(t.youEn)}</span></span><span class="sc-who">🙋</span></div>
        `).join('')}
      </div>
      <div class="action-row" style="justify-content:center;margin-top:14px;">
        <button class="btn primary" id="scReplayBtn">🔊 Hear it all</button>
        <button class="btn big2" id="scAgainBtn">↺ Play again</button>
        <button class="btn big2" id="scExitBtn">✕ Done</button>
      </div>
    </div>`;
    document.getElementById('scReplayBtn')?.addEventListener('click',()=>{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      st.transcript.forEach(t=>{
        const u1=Object.assign(new SpeechSynthesisUtterance(t.npc),{lang:'it-IT'});
        const u2=Object.assign(new SpeechSynthesisUtterance(t.you),{lang:'it-IT'});
        window.speechSynthesis.speak(u1); window.speechSynthesis.speak(u2);
      });
    });
    document.getElementById('scAgainBtn')?.addEventListener('click',()=>startScenario(st.id));
    document.getElementById('scExitBtn')?.addEventListener('click',()=>{ st.active=false; renderPractice(); });
    return;
  }

  const choices=scenarioChoices(step, st);
  const answered=st.picked!==null && choices[st.picked]?.ok;
  host.innerHTML=`<div class="card anim-pop">
    <div class="ex-label">
      <span class="pill purple">${sc.icon} ${esc(sc.title)}</span>
      <span class="pill yellow">${st.step+1} / ${sc.steps.length}</span>
      <button class="btn-icon" id="scStopBtn" title="Stop" style="margin-left:auto;">✕</button>
    </div>
    <div class="sc-line them" style="margin-top:6px;">
      <span class="sc-who">🇮🇹</span>
      <span><strong style="font-size:1.05rem;">${esc(step.npc)}</strong>
        <button class="speak-btn" id="scHearBtn" style="padding:2px 10px;font-size:.8rem;margin-left:6px;">🔊</button>
        <br><span class="muted small">${esc(step.npcEn)}</span></span>
    </div>
    <div class="task-hint" style="margin:12px 0 8px;font-weight:700;">🎯 ${esc(step.task)}</div>
    <div class="choices">
      ${choices.map((c,i)=>{
        let cls='choice';
        if(st.picked===i) cls+=c.ok?' correct':' wrong';
        else if(answered&&c.ok) cls+=' correct';
        return `<button class="${cls}" data-sci="${i}">${esc(c.t)}</button>`;
      }).join('')}
    </div>
    ${st.whyMsg?`<div class="feedback-bar wrong anim-pop">🤔 ${esc(st.whyMsg)}</div>`:''}
    ${answered?`
      <div class="feedback-bar correct anim-pop">✓ ${esc(choices.find(c=>c.ok).en)}</div>
      <div class="action-row" style="margin-top:10px;"><button class="btn primary" id="scNextBtn">${st.step+1<sc.steps.length?'Next →':'Finish 🎉'}</button></div>
    `:''}
  </div>`;

  document.getElementById('scHearBtn')?.addEventListener('click',()=>speakIt(step.npc));
  document.getElementById('scStopBtn')?.addEventListener('click',()=>{ st.active=false; renderPractice(); });
  host.querySelectorAll('[data-sci]').forEach(b=>b.addEventListener('click',()=>{
    if(answered) return;
    const i=+b.dataset.sci, c=choices[i];
    st.total++;
    if(c.ok){
      st.correct += (st.picked===null && !st.hadWrong) ? 1 : 0;
      st.picked=i; st.whyMsg=null;
      speakIt(c.t);
      renderScenario();
    } else {
      st.hadWrong=true; st.picked=i; st.whyMsg=c.why;
      renderScenario();
      setTimeout(()=>{ st.picked=null; renderScenario(); },1400);
    }
  }));
  document.getElementById('scNextBtn')?.addEventListener('click',()=>{
    const good=choices.find(c=>c.ok);
    st.transcript.push({npc:step.npc,npcEn:step.npcEn,you:good.t,youEn:good.en});
    st.step++; st.picked=null; st.choiceOrder=null; st.whyMsg=null; st.hadWrong=false;
    renderScenario();
    const nxt=sc.steps[st.step]; if(nxt) setTimeout(()=>speakIt(nxt.npc),300);
  });
}

// ── Sentence rhythm: banded full-sentence listening ──────────────────────────
function startSentPractice(lo, hi){
  const list = shuffle(PHRASES
    .map(p=>({sp:p[0],en:p[1],lesson:p[2]}))
    .filter(p=>p.lesson>=lo && p.lesson<=hi));
  if(!list.length) return;
  const band=SENT_BANDS.find(b=>b.lo===lo&&b.hi===hi);
  state.sent={active:true,label:band?band.label:`Lessons ${lo}–${hi}`,lo,hi,list,idx:0,revealed:false};
  renderPractice();
  setTimeout(()=>speakIt(list[0].sp), 400);
}

function renderSentPractice(){
  const host=document.getElementById('sentArea');
  if(!host) return;
  const st=state.sent;
  if(!st||!st.active){ host.innerHTML=''; return; }
  const cur=st.list[st.idx];

  // Completed
  if(!cur){
    host.innerHTML=`<div class="card anim-pop" style="text-align:center;">
      <div style="font-size:2.5rem;">🎧</div>
      <div style="font-weight:900;font-size:1.15rem;margin:4px 0 2px;">${st.list.length} sentences absorbed</div>
      <div class="muted small" style="margin-bottom:14px;">${esc(st.label)} — the rhythm sinks in a little more every pass.</div>
      <div class="action-row" style="justify-content:center;">
        <button class="btn primary" id="sentAgainBtn">↺ Same band again</button>
        <button class="btn big2" id="sentExitBtn">✕ Done</button>
      </div>
    </div>`;
    document.getElementById('sentAgainBtn')?.addEventListener('click',()=>{
      startSentPractice(st.lo, st.hi);
    });
    document.getElementById('sentExitBtn')?.addEventListener('click',()=>{ st.active=false; renderPractice(); });
    return;
  }

  host.innerHTML=`<div class="card anim-pop">
    <div class="ex-label">
      <span class="pill green">🎧 Sentence rhythm</span>
      <span class="pill blue">${esc(st.label)}</span>
      <span class="pill yellow">${st.idx+1} / ${st.list.length}</span>
      <button class="btn-icon" id="sentStopBtn" title="Stop" style="margin-left:auto;">✕</button>
    </div>
    ${st.revealed
      ? `<div style="text-align:center;padding:8px 0 2px;">
           <div style="font-weight:900;font-size:1.35rem;line-height:1.3;">${esc(cur.sp)}</div>
           <div class="muted" style="margin-top:6px;">${esc(cur.en)}</div>
           <div class="muted small" style="margin-top:4px;opacity:.7;">Lesson ${cur.lesson}</div>
         </div>
         <div class="action-row" style="justify-content:center;margin-top:14px;">
           <button class="btn big2" id="sentPlayBtn">🔊 Again</button>
           <button class="btn big2" id="sentSlowBtn">🐢 Slow</button>
           <button class="btn primary" id="sentNextBtn">Next →</button>
         </div>`
      : `<div style="text-align:center;padding:16px 0 6px;">
           <div style="font-size:2.2rem;">👂</div>
           <div style="font-weight:800;font-size:1.05rem;margin-top:4px;">Listen… what did you hear?</div>
           <div class="muted small" style="margin-top:4px;">Catch the melody first — the words come second.</div>
         </div>
         <div class="action-row" style="justify-content:center;margin-top:14px;">
           <button class="btn big2" id="sentPlayBtn">🔊 Again</button>
           <button class="btn big2" id="sentSlowBtn">🐢 Slow</button>
           <button class="btn primary" id="sentRevealBtn">Reveal →</button>
         </div>`}
  </div>`;

  document.getElementById('sentPlayBtn')?.addEventListener('click',()=>speakIt(cur.sp));
  document.getElementById('sentSlowBtn')?.addEventListener('click',()=>speakIt(cur.sp, 0.65));
  document.getElementById('sentRevealBtn')?.addEventListener('click',()=>{ st.revealed=true; renderSentPractice(); });
  document.getElementById('sentNextBtn')?.addEventListener('click',()=>{
    st.idx++; st.revealed=false; renderSentPractice();
    const nxt=st.list[st.idx]; if(nxt) setTimeout(()=>speakIt(nxt.sp), 300);
  });
  document.getElementById('sentStopBtn')?.addEventListener('click',()=>{ st.active=false; renderPractice(); });
}

function renderReview() {
  const host=document.getElementById('reviewArea');
  if(!host) return;
  const rev=state.rev;

  if(!rev.queue.length){
    host.innerHTML='<div class="empty">Select lessons above and press <strong>Let\'s Go! 🚀</strong></div>';
    return;
  }

  // ── Praise flash screen (brief, shown after correct typed answer) ──────────
  if(rev.showPraise){
    host.innerHTML=`<div class="card review-card anim-pop">
      <div class="praise-screen">
        <span class="praise-icon">⭐</span>
        <div class="praise-text">${esc(rev.showPraise)}</div>
      </div>
    </div>`;
    return;
  }

  const card=curCard();

  // ── Session complete (with learning summary) ────────────────────────────────
  if(!card){
    const accuracy=rev.total?Math.round(rev.correct/rev.total*100):0;
    const emoji=accuracy>=90?'🏆':accuracy>=70?'🎉':accuracy>=50?'💪':'📚';
    const slog=rev.slog||{good:new Set(),again:new Set(),mastered:new Set()};
    const nMastered=slog.mastered.size;
    const nProgressed=[...slog.good].filter(id=>!slog.mastered.has(id)).length;
    const nBack=[...slog.again].filter(id=>!slog.good.has(id)).length;
    host.innerHTML=`<div class="card session-complete anim-pop">
      <span class="complete-icon">${emoji}</span>
      <div class="complete-title">${accuracy>=70?'Great work!':'Keep going!'}</div>
      <div class="score-ring">
        <span class="ring-pct">${accuracy}%</span>
        <span class="ring-label">correct</span>
      </div>
      <div class="toolbar" style="justify-content:center;margin-bottom:8px;flex-wrap:wrap;">
        ${nMastered?`<span class="pill green">🏆 ${nMastered} newly mastered</span>`:''}
        ${nProgressed?`<span class="pill blue">📈 ${nProgressed} progressed</span>`:''}
        ${nBack?`<span class="pill yellow">🔁 ${nBack} coming back sooner</span>`:''}
      </div>
      ${nBack?`<div class="muted small" style="text-align:center;margin-bottom:16px;">Missed words return sooner — that's the spaced repetition working for you.</div>`:'<div style="margin-bottom:16px;"></div>'}
      <div class="toolbar" style="justify-content:center;gap:10px;">
        <button class="btn primary" id="restartBtn" style="font-size:1rem;padding:12px 28px;">Go again 🚀</button>
        <button class="btn big2" id="weakAgainBtn">💪 Weak words</button>
      </div>
    </div>`;
    document.getElementById('restartBtn')?.addEventListener('click',()=>{ buildQueue(); renderReview(); });
    document.getElementById('weakAgainBtn')?.addEventListener('click',()=>{
      if(!buildWeakQueue()){ alert('Not enough practiced words yet.'); return; }
      renderReview();
    });
    updateSessionBar();
    return;
  }

  // ── Match-the-pairs card branch ─────────────────────────────────────────
  if(card.ex === 'match'){
    if(!state.match) state.match = {selected:null, matched:new Set(), wrong:null};
    const m = state.match;
    const allDone = m.matched.size === 4;
    const chipsHTML = card.chips.map((chip, i) => {
      let cls = 'match-chip ' + (chip.type === 'sp' ? 'it' : 'en');
      if(m.matched.has(chip.pairId)) cls += ' matched';
      else if(m.selected === i) cls += ' selected';
      else if(m.wrong && (m.wrong.a === i || m.wrong.b === i)) cls += ' wrong';
      return `<button class="${cls}" data-mi="${i}">${esc(chip.text)}</button>`;
    }).join('');
    host.innerHTML = `<div class="card review-card anim-pop">
      <div class="ex-label">
        <span class="pill purple">${esc(card.promptLabel)}</span>
        <span class="pill green">${m.matched.size}/4 matched</span>
      </div>
      <div class="task-hint">${esc(card.taskText)}</div>
      <div class="match-grid">${chipsHTML}</div>
      ${allDone ? '<div class="action-row" style="margin-top:14px;justify-content:center;"><button class="btn primary" id="matchContBtn">Continue →</button></div>' : '<div class="action-row" style="margin-top:10px;justify-content:center;"><button class="btn" id="matchSkipBtn">Skip</button></div>'}
    </div>`;
    host.querySelectorAll('.match-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        if(allDone) return;
        const i = +btn.dataset.mi;
        const chip = card.chips[i];
        if(m.matched.has(chip.pairId)) return;
        if(m.wrong) return; // wait for wrong animation
        if(m.selected === null){
          m.selected = i;
          if(chip.type === 'sp' && 'speechSynthesis' in window){
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(chip.text),{lang:'it-IT'}));
          }
          renderReview();
        } else if(m.selected === i){
          m.selected = null;
          renderReview();
        } else {
          const other = card.chips[m.selected];
          if(chip.pairId === other.pairId && chip.type !== other.type){
            m.matched.add(chip.pairId);
            m.selected = null;
            reviewWord(chip.wordId, 'good'); logSession(chip.wordId,'good');
            rev.correct++; rev.total++;
            renderReview();
          } else {
            m.wrong = {a: m.selected, b: i};
            rev.total++;
            renderReview();
            setTimeout(() => { m.wrong = null; m.selected = null; renderReview(); }, 650);
          }
        }
      });
    });
    document.getElementById('matchContBtn')?.addEventListener('click', () => {
      state.match = null;
      nextCard();
    });
    document.getElementById('matchSkipBtn')?.addEventListener('click', () => {
      state.match = null;
      nextCard();
    });
    updateSessionBar();
    return;
  }

  const isInput=['typed','dictation','cloze','phrase'].includes(card.ex);
  const isChoice=['mcq','listen'].includes(card.ex);
  const exColors={typed:'blue',mcq:'purple',listen:'yellow',dictation:'blue',cloze:'green',phrase:'purple'};

  const speakHTML=card.speak?`<div class="speak-row"><button class="speak-btn" id="speakBtn">🔊 Play Italian</button></div>`:'';
  const inputHTML=isInput?`<div class="ans-wrap"><input id="ans" placeholder="${esc(card.ph||'Type your answer…')}" value="${esc(rev.typed)}" autocomplete="off" autocorrect="off" spellcheck="false"/></div>`:'';
  const hintHTML=card.hint?`<div class="cloze-hint">💡 ${esc(card.hint)}</div>`:'';
  const choicesHTML=isChoice?`<div class="choices">${card.choices.map(c=>`<button class="choice" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:'';
  const actionHTML=isInput
    ?`<div class="action-row"><button class="btn primary" id="checkBtn">Check ✓</button><button class="btn big2" id="revealBtn">Show answer</button><button class="btn big2" id="skipBtn">Skip</button></div>`
    :`<div class="action-row"><button class="btn big2" id="skipBtn">Skip</button></div>`;
  const feedbackHTML=rev.reveal
    ?`<div class="feedback-bar wrong-fb anim-pop">✗ ${esc(rev.lastResult)}</div>
       <div class="answer-reveal anim-pop"><div class="reveal-label">Correct answer</div><div class="reveal-text">${esc(card.answer)}</div></div>
       <div class="action-row"><button class="btn primary" id="nextBtn">Continue →</button></div>`
    :'';

  const isLong=card.prompt.length>35;
  // For cloze: render the blank visually
  const promptHTML = card.ex==='cloze'
    ? `<div class="cloze-prompt">${esc(card.prompt).replace('_____','<span class=\"cloze-blank\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')}</div>`
    : `<div class="prompt${isLong?' long':''}">${esc(card.prompt)}</div>`;
  host.innerHTML=`<div class="card review-card anim-pop">
    <div class="ex-label">
      <span class="pill ${exColors[card.ex]||'blue'}">${esc(card.promptLabel)}</span>
      <span class="pill gray">${esc(card.lessonTitle)}</span>
    </div>
    <div class="task-hint">${esc(card.taskText)}</div>
    ${promptHTML}
    ${card.context?`<button class="word-context" id="ctxSpeakBtn" title="Tap to hear this sentence">🔊 <em>${esc(card.context)}</em></button>`:''}
    ${hintHTML||''}
    ${speakHTML}${inputHTML}${choicesHTML}${actionHTML}${feedbackHTML}
  </div>`;

  // Update session bar (two-color)
  updateSessionBar();

  // Focus input
  const inp=document.getElementById('ans');
  if(inp){
    inp.focus();
    inp.addEventListener('input',e=>rev.typed=e.target.value);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('checkBtn')?.click();}});
  }

  document.getElementById('speakBtn')?.addEventListener('click',()=>{
    if('speechSynthesis'in window){window.speechSynthesis.cancel();window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(card.speak),{lang:'it-IT'}));}
  });

  document.getElementById('ctxSpeakBtn')?.addEventListener('click',()=>speakIt(card.context));

  document.getElementById('checkBtn')?.addEventListener('click',()=>{
    const t=(document.getElementById('ans')?.value||'').trim(); rev.typed=t; rev.total++;
    const variants=splitAns(card.answer);
    const ok=variants.map(norm).includes(norm(t)) || variants.map(normLoose).includes(normLoose(t));
    if(ok){
      rev.correct++;
      if(card.srsType==='phrase') reviewPhrase(card.phraseIdx,'good'); else reviewWord(card.id,'good');
      logSession(card.id,'good');
      rev.showPraise=randPraise(); rev.typed=''; rev.reveal=false;
      renderReview();
      setTimeout(()=>{ rev.showPraise=null; nextCard(); },900);
    } else {
      if(t){ if(card.srsType==='phrase') reviewPhrase(card.phraseIdx,'again'); else reviewWord(card.id,'again'); logSession(card.id,'again'); }
      rev.reveal=true; rev.lastResult=t?'Not an exact match — check the answer below.':'No answer entered.'; renderReview();
    }
  });

  document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.clicked) return; b.dataset.clicked='1';
    const ok=norm(b.dataset.c)===norm(card.answer); rev.total++;
    if(ok){
      b.classList.add('correct'); rev.correct++; reviewWord(card.id,'good'); logSession(card.id,'good');
      setTimeout(()=>nextCard(), 700);
    } else {
      b.classList.add('wrong');
      reviewWord(card.id,'again'); logSession(card.id,'again');
      document.querySelectorAll('.choice').forEach(cb=>{ if(norm(cb.dataset.c)===norm(card.answer)) cb.classList.add('correct'); });
      rev.reveal=true; rev.lastResult='Not quite — see the correct answer above.';
      setTimeout(()=>renderReview(), 800);
    }
  }));

  document.getElementById('revealBtn')?.addEventListener('click',()=>{ rev.total++; if(card.srsType==='phrase') reviewPhrase(card.phraseIdx,'again'); else reviewWord(card.id,'again'); logSession(card.id,'again'); rev.reveal=true; rev.lastResult='Answer revealed — review and continue.'; renderReview(); });
  document.getElementById('skipBtn')?.addEventListener('click',()=>{ rev.total++; if(card.srsType==='phrase'){ if(card.phraseIdx!=null) reviewPhrase(card.phraseIdx,'again'); } else { reviewWord(card.id,'again'); } logSession(card.id,'again'); nextCard(); });
  document.getElementById('nextBtn')?.addEventListener('click',nextCard);
}

}

// ── Phrases ───────────────────────────────────────────────────────────────────
function reviewPhrase(idx,rating) {
  const p=state.phraseProgress[idx], now=todayISO(), n={...p,attempts:(p.attempts||0)+1};
  if(rating==='got')   { n.correct=(n.correct||0)+1; n.level=Math.min(6,n.level+3); n.dueAt=addDays(now,(INTERVALS[Math.min(6,n.level)]||7)); }
  if(rating==='almost'){ n.correct=(n.correct||0)+1; n.level=Math.min(6,n.level+1); n.dueAt=addDays(now,INTERVALS[Math.max(1,n.level)]||1); }
  if(rating==='nope')  { n.level=Math.max(0,n.level-1); n.dueAt=todayISO(); }
  n.mastered=n.level>=6; state.phraseProgress[idx]=n; saveState();
}

function buildPhraseQueue() {
  const due=PHRASES.map((_,i)=>i).filter(i=>isDue(state.phraseProgress[i]));
  const src=due.length?due:PHRASES.map((_,i)=>i);
  state.phraseRev={queue:shuffle([...src]),idx:0,correct:0,total:0,reveal:false,typed:'',lastResult:'',started:true};
}

function renderPhrases() {
  const d=document.getElementById('phrasesSection');
  const pr=state.phraseRev, mastered=state.phraseProgress.filter(p=>p.mastered).length;
  const due=state.phraseProgress.filter(p=>isDue(p)&&!p.mastered).length;

  // ── Phrase review card (reveal-then-self-rate) ───────────────────────────
  const reviewArea = () => {
    if(!pr.started||!pr.queue.length) return '';
    const i=pr.queue[pr.idx];
    if(i===undefined){
      const pct=pr.total?Math.round(pr.correct/pr.total*100):0;
      return `<div class="card session-complete anim-pop" style="margin-bottom:16px;">
        <span class="complete-icon">${pct>=80?'🏆':pct>=60?'🎉':'📚'}</span>
        <div class="complete-title">Phrases done!</div>
        <div class="score-ring"><span class="ring-pct">${pct}%</span><span class="ring-label">got it</span></div>
        <div class="toolbar" style="justify-content:center;margin-bottom:16px;">
          <span class="pill green">✓ ${pr.correct} got it</span>
          <span class="pill red">✗ ${pr.total-pr.correct} missed</span>
        </div>
        <button class="btn primary" id="pRestartBtn">Go again</button></div>`;
    }
    const dir=pr.idx%2===0?'it-en':'en-it';
    const prompt=dir==='it-en'?PHRASES[i][0]:PHRASES[i][1];
    const answer=dir==='it-en'?PHRASES[i][1]:PHRASES[i][0];
    const sp=PHRASES[i][0];
    // Before reveal: show prompt + optional typing area + Reveal button
    // After reveal: show answer + 3 self-rate buttons
    return `<div class="card review-card anim-pop" style="margin-bottom:16px;">
      <div class="toolbar" style="justify-content:center;margin-bottom:12px;">
        <span class="pill blue">${dir==='it-en'?'Italian → English':'English → Italian'}</span>
        <span class="pill yellow">Phrase ${pr.idx+1} of ${pr.queue.length}</span>
      </div>
      <div class="prompt" style="font-size:clamp(1rem,2.8vw,1.5rem);margin-bottom:12px;">${esc(prompt)}</div>
      ${!pr.reveal?`
        <div class="muted small" style="margin-bottom:10px;font-style:italic;">Think of the ${dir==='it-en'?'English meaning':'Italian translation'}, then reveal.</div>
        <div class="speak-row"><button class="speak-btn" id="pSpeakBtn">🔊 Play Italian</button></div>
        <div class="action-row" style="margin-top:14px;">
          <button class="btn primary" id="pRevealBtn">👁 Reveal answer</button>
          <button class="btn" id="pSkipBtn">Skip</button>
        </div>
      `:`
        <div class="answer-reveal anim-pop">
          <div class="reveal-label">Answer</div>
          <div class="reveal-text">${esc(answer)}</div>
        </div>
        <div class="muted small" style="margin:12px 0 8px;text-align:center;font-weight:700;">How did you do?</div>
        <div class="action-row">
          <button class="btn primary" id="pGotBtn" style="background:var(--green);border-color:var(--gd);border-bottom-color:#337800;">✓ Got it</button>
          <button class="btn" id="pAlmostBtn" style="background:var(--golds);border-color:#e6b800;border-bottom-color:#c9a000;color:#7a5800;">~ Almost</button>
          <button class="btn danger" id="pNopeBtn">✗ Not yet</button>
        </div>
      `}
    </div>`;
  };

  // ── Phrase list ────────────────────────────────────────────────────────────
  const list=PHRASES.map(([sp,en],i)=>{
    const p=state.phraseProgress[i], st=getStatus(p);
    return `<tr><td style="font-style:italic;">${esc(sp)}</td><td class="muted small">${esc(en)}</td><td><span class="status ${st}">${st}</span></td></tr>`;
  }).join('');

  d.innerHTML=`
    <div class="toolbar" style="justify-content:space-between;margin-bottom:4px;">
      <h2 style="margin:0;">Phrases</h2>
      <button class="btn primary" id="pStartBtn">${pr.started?'New session':'Start practice'}</button>
    </div>
    <div class="summary-grid" style="margin-bottom:16px;">
      <div class="summary-box"><div class="value">${PHRASES.length}</div><div class="muted small">Total phrases</div></div>
      <div class="summary-box"><div class="value">${due}</div><div class="muted small">Due now</div></div>
      <div class="summary-box"><div class="value">${mastered}</div><div class="muted small">Mastered</div></div>
    </div>
    ${reviewArea()}
    <div class="card">
      <h3>All phrases</h3>
      <table class="word-table"><thead><tr><th>Italian</th><th>English</th><th>Status</th></tr></thead>
      <tbody>${list}</tbody></table>
    </div>`;

  document.getElementById('pStartBtn')?.addEventListener('click',()=>{ buildPhraseQueue(); renderPhrases(); });
  document.getElementById('pRestartBtn')?.addEventListener('click',()=>{ buildPhraseQueue(); renderPhrases(); });

  const nextPhrase=()=>{ pr.idx++; pr.reveal=false; pr.typed=''; pr.lastResult=''; renderPhrases(); };

  // Speak button
  const sp=pr.queue[pr.idx]!==undefined?PHRASES[pr.queue[pr.idx]]?.[0]:'';
  document.getElementById('pSpeakBtn')?.addEventListener('click',()=>{
    if('speechSynthesis'in window&&sp){window.speechSynthesis.cancel();window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(sp),{lang:'it-IT'}));}
  });

  // Reveal
  document.getElementById('pRevealBtn')?.addEventListener('click',()=>{ pr.reveal=true; renderPhrases(); });
  document.getElementById('pSkipBtn')?.addEventListener('click',()=>{ const i=pr.queue[pr.idx]; pr.total++; reviewPhrase(i,'nope'); nextPhrase(); });

  // Self-rate buttons
  document.getElementById('pGotBtn')?.addEventListener('click',()=>{
    const i=pr.queue[pr.idx]; pr.total++; pr.correct++; reviewPhrase(i,'got'); nextPhrase();
  });
  document.getElementById('pAlmostBtn')?.addEventListener('click',()=>{
    const i=pr.queue[pr.idx]; pr.total++; pr.correct++; reviewPhrase(i,'almost'); nextPhrase();
  });
  document.getElementById('pNopeBtn')?.addEventListener('click',()=>{
    const i=pr.queue[pr.idx]; pr.total++; reviewPhrase(i,'nope'); nextPhrase();
  });
}

// Convert legacy {q,c,i,e,neg} shape to token array (only used if any old data slips in).
// New CHALLENGES use the .tokens field directly.
function buildChallengeTokens(ch) {
  if(ch.tokens) return ch.tokens.map(([sp,cat]) => ({sp, cat}));
  // legacy fallback
  const tokens = [];
  if(ch.q)               tokens.push({sp:ch.q, cat:'q'});
  if(ch.neg && ch.c)     tokens.push({sp:'non', cat:'neg'});
  if(ch.c)               tokens.push({sp:ch.c, cat:'c'});
  if(ch.i)               tokens.push({sp:ch.i, cat:'i'});
  if(ch.e)               tokens.push({sp:ch.e, cat:'e'});
  return tokens;
}

// "Almost right" distractors: pull from OTHER prompts' tokens, biased to same category and topic.
function shuffleChallengeChips(tokens, currentTopic) {
  const correctSet = new Set(tokens.map(t=>norm(t.sp)));
  const usedCats   = new Set(tokens.map(t=>t.cat));
  // Build pool of all tokens from all challenges (deduped)
  const seen = new Set();
  const pool = [];
  for(const ch of CHALLENGES){
    if(!ch.tokens) continue;
    for(const [sp,cat] of ch.tokens){
      const key = norm(sp)+'|'+cat;
      if(seen.has(key) || correctSet.has(norm(sp))) continue;
      seen.add(key);
      pool.push({sp, cat, fromTopic: ch.topic});
    }
  }
  // Prefer distractors that match a category present in the answer AND the current topic
  const sameTopicSameCat = pool.filter(p=>usedCats.has(p.cat) && p.fromTopic===currentTopic);
  const sameCat          = pool.filter(p=>usedCats.has(p.cat) && p.fromTopic!==currentTopic);
  const otherCat         = pool.filter(p=>!usedCats.has(p.cat));
  // Pick ~3 distractors, prioritising same-topic/same-category for "almost right" feel
  const picks = [];
  const tryFrom = (arr, n) => { for(const p of shuffle([...arr])){ if(picks.length>=n) break; picks.push(p); } };
  tryFrom(sameTopicSameCat, 2);
  tryFrom(sameCat, 3);
  tryFrom(otherCat, 3);
  return shuffle([...tokens, ...picks.slice(0,3).map(p=>({sp:p.sp, cat:p.cat, distractor:true}))]);
}

// ── Challenge session control ────────────────────────────────────────────────
function startChallengeSession(filter={topic:null, lvl:null}) {
  const bs = buildState;
  bs.challengeActive  = true;
  bs.challengeFilter  = filter;
  // Filter CHALLENGES by topic/level if requested
  const indices = CHALLENGES
    .map((_,i)=>i)
    .filter(i => {
      const c = CHALLENGES[i];
      if(filter.topic && c.topic !== filter.topic) return false;
      if(filter.lvl && c.lvl !== filter.lvl) return false;
      return true;
    });
  bs.challengeOrder   = shuffle(indices);
  bs.challengePos     = 0;
  bs.challengeCorrect = 0;
  bs.challengeTotal   = 0;
  loadChallenge();
}

function loadChallenge() {
  const bs = buildState;
  const ch = CHALLENGES[bs.challengeOrder[bs.challengePos]];
  if(!ch){ bs.challengeTokens=[]; bs.challengeBank=[]; return; }
  bs.challengeTokens   = buildChallengeTokens(ch);
  bs.challengeBank     = shuffleChallengeChips(bs.challengeTokens, ch.topic);
  bs.challengeSelected = [];
  bs.challengeResult   = null;
}

function checkChallenge() {
  const bs = buildState;
  const correct = bs.challengeTokens.map(t=>norm(t.sp)).join('|');
  const got     = bs.challengeSelected.map(t=>norm(t.sp)).join('|');
  const idx     = bs.challengeOrder[bs.challengePos];
  bs.challengeTotal++;
  // Persistent per-prompt progress
  const prog = state.challengeProgress[idx] || {correct:0, attempts:0};
  prog.attempts = (prog.attempts||0) + 1;
  if(got === correct){
    bs.challengeCorrect++;
    bs.challengeResult = 'correct';
    prog.correct = (prog.correct||0) + 1;
  } else {
    bs.challengeResult = 'wrong';
  }
  state.challengeProgress[idx] = prog;
  saveState();
}

function nextChallenge() {
  const bs = buildState;
  bs.challengePos++;
  loadChallenge();
}

// ── Generate a random sentence from curated templates ─────────────────────────
function generateSentence(neg=null) {
  const tmpl = TEMPLATES[0|Math.random()*TEMPLATES.length];
  const [qSp, qEn, cSp0, cEn0, iSp, iEn] = tmpl;
  const isNeg = neg !== null ? neg : Math.random() > 0.8;
  const cSp = isNeg ? 'non ' + cSp0 : cSp0;
  const cEn = isNeg ? '[not] ' + cEn0 : cEn0;
  const useExtra = Math.random() > 0.45;
  const e = useExtra ? STRUCT.extras[0|Math.random()*STRUCT.extras.length] : null;
  const parts = [
    {sp:qSp.replace(/[?]/g,'').trim(), en:qEn, cat:'q'},
    {sp:cSp, en:cEn, cat:'c'},
    {sp:iSp, en:iEn, cat:'i'},
  ];
  if(e) parts.push({sp:e.sp, en:e.en, cat:'e'});
  const sp = parts.map(p=>p.sp).join(' ') + '?';
  const en = qEn + ' ' + cEn + ' ' + iSp + (e?' '+e.en:'') + '?';
  return {sp, en, parts, speak:sp};
}

      const targetSlot = chip.dataset.slot;
      const sp = chip.dataset.sp;
      bs[targetSlot] = {sp, en: chip.dataset.en};
      // Speak the Italian word so learners hear pronunciation
      if('speechSynthesis' in window && sp){
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(sp),{lang:'it-IT'}));
      }
      // Auto-advance active slot
      const order = ['q','c','i','e'];
      const next = order[order.indexOf(targetSlot)+1];
      if(next) bs.activeSlot = next;
      renderBuild();
    });
  });
  // Negative toggle
  d.querySelector('#negToggle')?.addEventListener('click', () => { bs.neg = !bs.neg; renderBuild(); });
  // Speak
  d.querySelector('#bSpeakBtn')?.addEventListener('click', () => {
    if('speechSynthesis' in window && sentence) {
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(sentence), {lang:'it-IT'}));
    }
  });
  // Shuffle
  d.querySelector('#shuffleBtn')?.addEventListener('click', () => {
    // Pick a random curated TEMPLATE — guarantees a valid combination.
    // (Old behaviour picked each slot independently, which produced nonsense like "Chi? devo cominciare".)
    const [qSp, qEn, cSp, cEn, iSp, iEn] = TEMPLATES[0|Math.random()*TEMPLATES.length];
    bs.q = {sp:qSp, en:qEn};
    bs.c = {sp:cSp, en:cEn};
    bs.i = {sp:iSp, en:iEn};
    bs.e = Math.random()>.5 ? STRUCT.extras[0|Math.random()*STRUCT.extras.length] : null;
    bs.neg = Math.random()>.8;
    renderBuild();
  });
  // Clear all
  d.querySelector('#clearAllBtn')?.addEventListener('click', () => {
    bs.q=bs.c=bs.i=bs.e=null; bs.neg=false; bs.activeSlot='q';
    renderBuild();
  });

  // ── Translation Challenge events ──────────────────────────────────────────
  d.querySelector('#chStartBtn')?.addEventListener('click', () => {
    startChallengeSession({topic: bsC._filterTopic||null, lvl: bsC._filterLvl||null});
    renderBuild();
  });
  d.querySelector('#chExitBtn')?.addEventListener('click', () => { bsC.challengeActive = false; renderBuild(); });
  d.querySelector('#chAgainBtn')?.addEventListener('click', () => {
    // Re-run with the same filter that was used for this session
    startChallengeSession(bsC.challengeFilter || {topic:null, lvl:null});
    renderBuild();
  });

  // Topic filter chips
  d.querySelectorAll('[data-topic]').forEach(btn => {
    btn.addEventListener('click', () => {
      bsC._filterTopic = btn.dataset.topic || null;
      renderBuild();
    });
  });
  // Difficulty filter chips
  d.querySelectorAll('[data-lvl]').forEach(btn => {
    btn.addEventListener('click', () => {
      bsC._filterLvl = btn.dataset.lvl ? +btn.dataset.lvl : null;
      renderBuild();
    });
  });
  d.querySelector('#chTogglePromptsBtn')?.addEventListener('click', () => {
    bsC._showPrompts = !bsC._showPrompts;
    renderBuild();
  });
  d.querySelector('#chResetStarsBtn')?.addEventListener('click', () => {
    if(confirm('Reset all Challenge stars? Your vocab progress will not be affected.')){
      state.challengeProgress = initChallengeProgress();
      saveState();
      renderBuild();
    }
  });

  // Tap bank chip → move to selected
  d.querySelectorAll('[data-chbank]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(bsC.challengeResult) return; // locked after grading
      const chip = bsC.challengeBank[+btn.dataset.chbank];
      if(!chip || bsC.challengeSelected.includes(chip)) return;
      bsC.challengeSelected.push(chip);
      // Speak the chip so the learner hears how it sounds
      if('speechSynthesis' in window && chip.sp){
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(chip.sp),{lang:'it-IT'}));
      }
      renderBuild();
    });
  });

  // Tap a selected chip → remove it (put back in bank visually)
  d.querySelectorAll('[data-chsel]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(bsC.challengeResult) return;
      bsC.challengeSelected.splice(+btn.dataset.chsel, 1);
      renderBuild();
    });
  });

  d.querySelector('#chClearBtn')?.addEventListener('click', () => {
    if(bsC.challengeResult) return;
    bsC.challengeSelected = [];
    renderBuild();
  });

  // Shared helper — speaks the current challenge's correct sentence.
  const speakChallenge = () => {
    if(!('speechSynthesis' in window) || !bsC.challengeTokens?.length) return;
    const text = bsC.challengeTokens.map(t=>t.sp).join(' ');
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'it-IT';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  };

  d.querySelector('#chCheckBtn')?.addEventListener('click', () => {
    checkChallenge();
    renderBuild();
    // Speak the correct sentence on EVERY grade — reinforces right answers, models wrong ones.
    speakChallenge();
  });

  d.querySelector('#chListenBtn')?.addEventListener('click', speakChallenge);

  d.querySelector('#chSkipBtn')?.addEventListener('click', () => {
    bsC.challengeTotal++;
    nextChallenge();
    renderBuild();
  });

  d.querySelector('#chNextBtn')?.addEventListener('click', () => {
    nextChallenge();
    renderBuild();
  });

  // ── Generate & Read events ────────────────────────────────────────────────
  const bs3=buildState;
  const speakGen = () => {
    if('speechSynthesis' in window && bs3.genSentence){
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(Object.assign(new SpeechSynthesisUtterance(bs3.genSentence.sp),{lang:'it-IT'}));
    }
  };
  // Autoplay when a new sentence is shown but not yet revealed.
  // Uses a short delay so the UI paints first, and guards against double-fire on re-renders.
  if(bs3.genActive && !bs3.genRevealed && !bs3._autoplayedFor){
    bs3._autoplayedFor = bs3.genSentence; // mark so we don't replay on every render
    setTimeout(speakGen, 250);
  }

  d.querySelector('#gStartBtn')?.addEventListener('click',()=>{
    bs3.genActive=true;
    bs3.genSentence=generateSentence();
    bs3.genRevealed=false;
    bs3._autoplayedFor=null;
    renderBuild();
  });
  d.querySelector('#gExitBtn')?.addEventListener('click',()=>{ bs3.genActive=false; renderBuild(); });
  d.querySelector('#gNextBtn')?.addEventListener('click',()=>{
    bs3.genSentence=generateSentence();
    bs3.genRevealed=false;
    bs3._autoplayedFor=null;
    renderBuild();
  });
  d.querySelector('#gRevealBtn')?.addEventListener('click',()=>{
    bs3.genRevealed=true;
    renderBuild();
  });
  d.querySelector('#gNegBtn')?.addEventListener('click',()=>{
    if(!bs3.genSentence) return;
    const gs2 = bs3.genSentence;
    const isNeg = gs2.parts[1]?.sp.startsWith('non ');
    // Flip the carrier part in place
    const newParts = gs2.parts.map(p => {
      if(p.cat !== 'c') return p;
      return isNeg
        ? {...p, sp: p.sp.replace(/^non\s+/,'')} // remove "non "
        : {...p, sp: 'non ' + p.sp};              // add "non "
    });
    const sp = newParts.map(p=>p.sp).join(' ') + '?';
    const en = newParts.map(p=>p.en).join(' ') + '?';
    bs3.genSentence = {...gs2, parts:newParts, sp, en, speak:sp};
    renderBuild();
  });
  d.querySelector('#gSpeakBtn')?.addEventListener('click', speakGen);
}

// ── Words: the reference list ─────────────────────────────────────────────────
// Every word in the course, grouped by lesson, searchable in either language.
// Because the same word is taught in several lessons, each entry notes where else it
// turns up — handy when you meet "voglio" again in L32 and wonder if you've seen it.
function renderWords() {
  const d = document.getElementById('wordsSection');
  if(!d) return;
  const ui = state.wordUI;
  const q  = norm(ui.q);

  // Which other lessons teach this same word?
  const appears = new Map();
  state.lessons.forEach(l => l.vocab.forEach(w => {
    const k = wordKey(w.italian);
    if(!appears.has(k)) appears.set(k, []);
    if(!appears.get(k).includes(l.id)) appears.get(k).push(l.id);
  }));

  const passesFilter = w => {
    if(ui.filter === 'all')      return true;
    if(ui.filter === 'mastered') return getStatus(w) === 'mastered';
    if(ui.filter === 'new')      return w.attempts === 0;
    if(ui.filter === 'weak')     return w.attempts > 0 && (w.correct / w.attempts) < 0.7;
    return true;
  };
  const matches = w => passesFilter(w) &&
    (!q || norm(w.italian).includes(q) || norm(w.english).includes(q));

  const hilite = (text, cls) => {
    const safe = esc(text);
    if(!q) return safe;
    const i = norm(text).indexOf(q);
    if(i < 0) return safe;
    // norm() can change length (accents), so highlight on a best-effort word basis
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'i');
    return safe.replace(re, '<mark>$1</mark>');
  };

  const shown = state.lessons
    .filter(l => l.vocab.length && (ui.src === 'all' || (l.course || '3MS') === ui.src))
    .map(l => ({ lesson: l, hits: l.vocab.filter(matches) }))
    .filter(x => x.hits.length);

  const totalShown = shown.reduce((s,x)=>s+x.hits.length, 0);
  const searching  = !!q || ui.filter !== 'all';

  const rowHTML = w => {
    const also = (appears.get(wordKey(w.italian)) || []).filter(id => id !== w.lessonId);
    const alsoLabel = also.map(id => getLesson(id)?.shortLabel || id).join(', ');
    return `<div class="wl-row">
      <div class="wl-it">${hilite(w.italian)}</div>
      <div class="wl-en">${hilite(w.english)}${also.length ? `<span class="wl-also">also in ${esc(alsoLabel)}</span>` : ''}</div>
      <span class="status ${getStatus(w)}">${getStatus(w)}</span>
      <button class="wl-say" data-say="${esc(w.italian)}" title="Hear it" aria-label="Hear ${esc(w.italian)}">🔊</button>
    </div>`;
  };

  const lessonHTML = ({lesson: l, hits}) => {
    const open = searching || ui.open.has(l.id);
    const core = l.vocab.filter(w => !w.pack);
    const m    = core.filter(w => getStatus(w) === 'mastered').length;
    const pct  = core.length ? Math.round(m / core.length * 100) : 0;
    const isOS = (l.course || '3MS') === 'OTHER';

    const coreHits = hits.filter(w => !w.pack);
    const packs    = [...new Set(hits.filter(w => w.pack).map(w => w.pack))];

    const body = open ? `<div class="wl-body">
      ${coreHits.map(rowHTML).join('')}
      ${packs.map(p => `<div class="wl-pack">${esc(p)}</div>${hits.filter(w=>w.pack===p).map(rowHTML).join('')}`).join('')}
    </div>` : '';

    return `<div class="wl-lesson${open?' open':''}${isOS?' os':''}">
      <button class="wl-head" data-lw="${l.id}" aria-expanded="${open}">
        <span class="wl-badge">${esc(l.shortLabel || l.id)}</span>
        <span class="wl-meta">
          <span class="wl-title">${esc(l.title)}</span>
          <span class="wl-sub">${searching ? `${hits.length} match${hits.length===1?'':'es'} · ` : ''}${l.vocab.length} word${l.vocab.length===1?'':'s'}${core.length ? ` · ${m}/${core.length} mastered` : ''}</span>
        </span>
        <span class="wl-mini${m===core.length&&core.length?' full':''}"><span style="width:${pct}%"></span></span>
        <span class="wl-chev">▶</span>
      </button>
      ${body}
    </div>`;
  };

  const chip = (group, val, label) =>
    `<button class="wl-chip${ui[group]===val?' on':''}" data-${group}="${val}">${label}</button>`;

  d.innerHTML = `
    <div class="wl-search">
      <input id="wlSearch" placeholder="Search Italian or English…" value="${esc(ui.q)}" autocomplete="off" autocorrect="off" spellcheck="false"/>
      ${ui.q ? '<button class="wl-clear" id="wlClear" title="Clear search">✕</button>' : ''}
    </div>
    <div class="wl-filters">
      ${chip('src','all','All sources')}
      ${chip('src','3MS','📘 3 Minute Italian')}
      ${chip('src','OTHER','🌐 Other Sources')}
    </div>
    <div class="wl-filters">
      ${chip('filter','all','Everything')}
      ${chip('filter','weak','🔥 Needs work')}
      ${chip('filter','mastered','⭐ Mastered')}
      ${chip('filter','new','○ Not started')}
    </div>
    <div class="wl-bar">
      <span class="wl-count">${totalShown} word${totalShown===1?'':'s'} in ${shown.length} lesson${shown.length===1?'':'s'}</span>
      <div class="toolbar">
        <button class="btn" id="wlExpand">${ui.open.size ? 'Collapse all' : 'Expand all'}</button>
        <button class="btn" id="wlCopy">📋 Copy</button>
      </div>
    </div>
    ${shown.length
      ? shown.map(lessonHTML).join('')
      : `<div class="empty">No words match${ui.q ? ` “${esc(ui.q)}”` : ' those filters'}. Try a different search.</div>`}
  `;

  // Search box — rebuilt on every keystroke, so put the cursor back where it was.
  const inp = document.getElementById('wlSearch');
  if(inp){
    if(ui.focus){ inp.focus(); inp.setSelectionRange(ui.caret, ui.caret); }
    inp.addEventListener('input', e => {
      ui.q = e.target.value;
      ui.focus = true;
      ui.caret = e.target.selectionStart;
      renderWords();
    });
    inp.addEventListener('blur', () => { ui.focus = false; });
  }
  document.getElementById('wlClear')?.addEventListener('click', () => { ui.q=''; ui.focus=true; ui.caret=0; renderWords(); });

  d.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => { ui.src = b.dataset.src; ui.focus=false; renderWords(); }));
  d.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { ui.filter = b.dataset.filter; ui.focus=false; renderWords(); }));

  d.querySelectorAll('[data-lw]').forEach(b => b.addEventListener('click', () => {
    const id = +b.dataset.lw;
    ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id);
    ui.focus = false;
    renderWords();
  }));

  d.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    speakIt(b.dataset.say);
  }));

  document.getElementById('wlExpand')?.addEventListener('click', () => {
    if(ui.open.size) ui.open.clear();
    else shown.forEach(x => ui.open.add(x.lesson.id));
    ui.focus = false;
    renderWords();
  });

  document.getElementById('wlCopy')?.addEventListener('click', async () => {
    const text = shown.map(({lesson:l, hits}) =>
      `## ${l.title}\n` + hits.map(w => `${w.italian}\t${w.english}${w.pack?`\t[${w.pack}]`:''}`).join('\n')
    ).join('\n\n');
    const btn = document.getElementById('wlCopy');
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = `✓ Copied ${totalShown}`;
    } catch {
      btn.textContent = '✕ Copy blocked';
    }
    setTimeout(() => { btn.textContent = '📋 Copy'; }, 1600);
  });
}

function renderStats() {
  // allWords() lists every lesson entry, so a word taught in three lessons is counted three
  // times. Practice drills it once. Count unique words here so the two agree.
  const seenW = new Map();
  allWords().forEach(w => { if(!seenW.has(wordKey(w.italian))) seenW.set(wordKey(w.italian), w); });
  const words=[...seenW.values()], attempts=words.reduce((s,w)=>s+w.attempts,0), correct=words.reduce((s,w)=>s+w.correct,0);
  const mastered=words.filter(w=>getStatus(w)==='mastered').length;
  const lRows=state.lessons.map(l=>{ const ws=coreWords(l.id),tot=ws.length,m=ws.filter(w=>getStatus(w)==='mastered').length; return tot?{t:l.title,tot,m,pct:Math.round(m/tot*100)}:null; }).filter(Boolean);
  const pRows=allPacks().map(s=>{ const ws=packWords(s),tot=ws.length,m=ws.filter(w=>getStatus(w)==='mastered').length; return {t:`${s.label} (L${s.lessonId})`,tot,m,pct:Math.round(m/tot*100)}; });
  const statRow=(t,m,tot,pct)=>`<div class="stat-row">
    <div class="stat-name">${esc(t)}</div>
    <div class="stat-count">${m}/${tot}</div>
    <div class="stat-bar-wrap"><div class="stat-bar${m===tot?' full':''}" style="width:${pct}%"></div></div>
  </div>`;
  document.getElementById('statsSection').innerHTML=`
    <div class="summary-grid" style="margin-bottom:16px;">
      <div class="summary-box"><div class="value">${words.length}</div><div class="label">Total words</div></div>
      <div class="summary-box"><div class="value" style="color:var(--gd)">${mastered}</div><div class="label">Mastered ⭐</div></div>
      <div class="summary-box"><div class="value" style="color:var(--blue)">${words.filter(isDue).length}</div><div class="label">Due now</div></div>
      <div class="summary-box"><div class="value" style="color:var(--gold)">${attempts?Math.round(correct/attempts*100):0}%</div><div class="label">Accuracy</div></div>
    </div>
    <div class="grid cols-2">
      <div class="card"><h2>Lesson mastery</h2>${lRows.map(r=>statRow(r.t,r.m,r.tot,r.pct)).join('')}</div>
      <div class="card"><h2>Practical travel packs</h2>${pRows.length?pRows.map(r=>statRow(r.t,r.m,r.tot,r.pct)).join(''):'<div class="empty">No packs selected yet.</div>'}</div>
    </div>`;
}

loadState(); saveState(); render();
</script>
</body>
