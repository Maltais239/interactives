<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Image Spark responsive check</title>
<style>body{font:14px system-ui;margin:12px;background:#e2e8f0}button{padding:10px;margin:3px;min-height:44px}#viewport{background:white;margin-top:12px;width:1366px;height:650px}iframe{border:0;transform-origin:top left}#report{white-space:pre-wrap}</style>
<h1>Image Spark responsive check</h1><p>Resize the same activity. Notes and the selected image should survive every change. Scroll inside the frame when needed.</p>
<nav aria-label="Viewport sizes"><button data-size="1024,540">1024 × 540</button><button data-size="1366,650">1366 × 650</button><button data-size="768,900">768 × 900</button><button data-size="390,667">390 × 667</button><button data-size="320,568">320 × 568</button><button data-size="640,360">640 × 360</button><button data-size="683,325,2">1366 × 650 at 200% scale</button><button id="measure">Check layout</button></nav>
<pre id="report" role="status"></pre><div id="viewport"><iframe title="Image Spark preview" src="index.html" width="1366" height="650"></iframe></div>
<script>
const frame=document.querySelector('iframe'),box=document.querySelector('#viewport'),report=document.querySelector('#report');
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{const [w,h,scale=1]=button.dataset.size.split(',').map(Number);frame.width=w;frame.height=h;frame.style.transform=`scale(${scale})`;box.style.width=w*scale+'px';box.style.height=h*scale+'px';report.textContent=`Viewport ${w} × ${h}; scale ${scale}.`;});
document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow,canvas=d.querySelector('.web-canvas'),panel=d.querySelector('.web-panel');if(!canvas)return;report.textContent=JSON.stringify({width:w.innerWidth,height:w.innerHeight,horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,canvasHeight:Math.round(canvas.getBoundingClientRect().height),webPanelScroll:panel.scrollHeight>panel.clientHeight,notes:d.querySelectorAll('.sticky-note').length,image:d.querySelector('h2').textContent},null,2);};
</script></html>
