<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Spark: Visual Analysis Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script src="vendor/react18.min.js"></script>
    <script src="vendor/react-dom18.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Indie+Flower&family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, hsla(225,39%,30%,0) 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, hsla(339,49%,30%,0) 50%);
            height: 100dvh;
            overflow: hidden;
        }
        
        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .handwritten {
            font-family: 'Indie Flower', cursive;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        /* Dropdown animation */
        .dropdown-enter {
            animation: slideDown 0.2s ease-out forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        button, select, input:not([type=file]) { min-height: 44px; }
        button:focus-visible, summary:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
        input, select, textarea { max-width: 100%; }
        .app-shell { height: 100dvh; }
        .analysis-grid, .analysis-grid > div { min-width: 0; }
        .web-panel { overflow-y: auto; }
        .mind-workspace { min-height: 490px; }
        .web-canvas { min-height: 260px; }
        .sticky-note { width: 160px; max-width: calc(100% - 24px); }
        .sticky-note textarea { min-height: 52px; max-height: 110px; overflow: auto; }
        .sticky-handle { min-height: 24px; height: 24px; touch-action: none; }
        .sticky-delete { min-height: 28px; width: 28px; }
        .source-details { max-height: 42%; overflow: auto; }
        .source-details summary { min-height: 44px; cursor: pointer; }
        .image-drawer { max-height: 100%; overflow-y: auto; }
        .grade-selector { width: min(360px, 44vw); }
        .status-line { min-height: 20px; }
        .prompt-list { max-height: 154px; overflow-y: auto; }
        @media (max-width: 1023px) {
            body { height: auto; overflow-y: auto; }
            .app-shell { height: auto; min-height: 100dvh; overflow: visible; }
            .analysis-grid { height: auto; }
            .image-panel { height: clamp(360px, 58vh, 600px); }
            .web-panel { height: 660px; }
            .app-header { padding: 12px 16px; }
            .header-selectors { width: 100%; flex-wrap: wrap; justify-content: center; }
            .grade-selector { width: 100%; max-width: 480px; flex: 1 1 250px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="grade7-images.js"></script>
    <script src="app.js"></script>
</body>
</html>
