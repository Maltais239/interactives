<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

:root{--bg:#211812;--surface:#2b2019;--raised:#34271f;--line:#5a4030;--cream:#fff2df;--muted:#c9ac8f;--faint:#947a65;--amber:#f2a33a;--green:#77a866}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:"Outfit",system-ui,sans-serif} body{min-height:100vh} button{font:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand h1{font-family:"Fraunces",Georgia,serif;font-size:44px;line-height:1;margin:0;letter-spacing:-.5px}.brand h1 span{color:var(--amber)}
.brand .sub{color:var(--muted);font-size:13px;letter-spacing:.13em;text-transform:uppercase;margin-top:7px}
.rule{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--amber),transparent 70%);margin:0 0 16px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:transparent;color:var(--cream);font-weight:700;padding:9px 13px;border-radius:10px;cursor:pointer}.btn:hover{filter:brightness(1.12)}
.summary{color:var(--muted);font-size:13px}.local-note{font-size:11.5px;color:var(--faint)}.btn.offline-ready{background:var(--green);border-color:var(--green);color:#142010}.btn.offline-working{opacity:.75;cursor:wait}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}.col{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.colhead{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--surface) 85%,rgba(43,32,25,.94));padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.coltitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.coltitle h2{font-family:"Fraunces",Georgia,serif;margin:0;font-size:25px}
.count{font-weight:800;color:var(--amber);font-size:13px;white-space:nowrap}.note{font-size:12px;color:var(--faint);margin-top:4px}
.list{padding:4px 10px 10px;min-height:90px}.song{display:grid;grid-template-columns:32px 30px minmax(0,1fr) 34px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(90,64,48,.55);border-radius:9px}
.song:hover{background:rgba(255,255,255,.025)}.song.done{opacity:.5}.song.done .title{text-decoration:line-through}
.play-toggle,.lyrics-btn,.drag-handle{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:8px;min-width:28px;min-height:34px}
.play-toggle{cursor:pointer}.check{width:23px;height:23px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;color:#2a1c0b;font-weight:900}.song.done .check{background:var(--amber);border-color:var(--amber)}.song.done .check:after{content:"✓"}
.drag-handle{cursor:grab;font-size:18px;letter-spacing:-3px;user-select:none;touch-action:none}.drag-handle:active{cursor:grabbing}
.song-main{border:0;background:transparent;color:inherit;text-align:left;padding:5px 2px;min-width:0;cursor:pointer;border-radius:8px}.song-main:hover .title{color:var(--amber)}
.title{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11.8px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyrics-btn{cursor:pointer;font-size:17px}.lyrics-btn:hover,.drag-handle:hover,.play-toggle:hover{background:var(--raised);color:var(--cream)}
.alt .colhead{border-top:3px solid var(--amber)}.set1 .colhead,.set2 .colhead{border-top:3px solid rgba(242,163,58,.55)}
.sortable-ghost{opacity:.18!important}.sortable-chosen{background:var(--raised)!important}.sortable-drag{box-shadow:0 12px 30px rgba(0,0,0,.45);border:1px solid var(--amber)}
.footer{margin-top:14px;color:var(--faint);font-size:12px;text-align:center}
.qr-modal{position:fixed;inset:0;background:rgba(12,8,6,.86);z-index:120;display:none;align-items:center;justify-content:center;padding:20px}
.qr-modal.open{display:flex}
.qr-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;box-shadow:0 22px 70px rgba(0,0,0,.55)}
.qr-card h2{font-family:"Fraunces",Georgia,serif;font-size:28px;margin:0 0 6px}.qr-card p{color:var(--muted);font-size:13px;margin:0 0 16px}
#qr-code{display:flex;justify-content:center;background:white;padding:14px;border-radius:14px;width:max-content;margin:0 auto 16px}
#qr-code img,#qr-code canvas{display:block}
.qr-url{font-size:11px;color:var(--faint);overflow-wrap:anywhere;margin-bottom:14px}
.audience-only{max-width:1500px;margin:0 auto;padding:20px}
.audience-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.audience-col{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.audience-col h2{font-family:"Fraunces",Georgia,serif;font-size:25px;margin:0 0 10px;color:var(--amber)}
.audience-song{font-size:17px;font-weight:700;padding:9px 4px;border-bottom:1px solid rgba(90,64,48,.5)}
.audience-song:last-child{border-bottom:0}
@media(max-width:900px){.audience-grid{grid-template-columns:1fr}.audience-only{padding:12px}.audience-col{padding:14px}.audience-song{font-size:16px;padding:8px 2px}}
.modal{position:fixed;inset:0;background:rgba(12,8,6,.84);z-index:100;display:none;padding:18px}.modal.open{display:flex}
.sheet{width:min(1180px,100%);height:100%;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.sheet-head{padding:14px 16px 11px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.sheet-title-wrap{flex:1;min-width:0}
.sheet-title{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:800;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sheet-meta{font-size:12.5px;color:var(--muted);margin-top:5px}.sheet-source{font-size:10.5px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-btn{border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer;flex:none}
.sheet-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.08)}
.tool-btn{border:1px solid var(--line);background:var(--raised);color:var(--cream);border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.tool-btn.active{background:var(--amber);color:#2a1c0b;border-color:var(--amber)}.tool-btn:disabled{opacity:.35;cursor:not-allowed}
.sheet-position{margin-left:auto;color:var(--faint);font-size:12px;font-weight:700}.sheet-body{flex:1;overflow:auto;padding:18px 20px 70px;background:#1d1510}
.lyrics{margin:0;color:#fff6e8;font-family:"Roboto Mono","Courier New",monospace;font-size:16px;line-height:1.48;white-space:pre;min-width:max-content}.lyrics.loading,.lyrics.missing{font-family:"Outfit",system-ui,sans-serif;white-space:normal;min-width:0;color:var(--muted)}
.sheet-nav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}.sheet-nav .next{text-align:right}
.nav-btn{border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.nav-btn:disabled{opacity:.3;cursor:not-allowed}.nav-label{font-size:12px;color:var(--faint);white-space:nowrap}
@media(max-width:900px){.grid{grid-template-columns:1fr}.colhead{position:static}.modal{padding:0}.sheet{height:100%;border-radius:0;border:0}}
@media(min-width:901px){
  .wrap{padding:12px 12px 20px}
  header{margin-bottom:8px}
  .brand h1{font-size:38px}
  .brand .sub{font-size:12px;margin-top:4px}
  .rule{margin-bottom:10px}
  .grid{gap:12px}
  .colhead{padding:10px 14px 8px}
  .coltitle h2{font-size:22px}
  .count{font-size:12px}
  .note{font-size:11px;margin-top:1px}
  .list{padding:2px 8px 6px;max-height:calc(100vh - 155px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .song{grid-template-columns:25px 23px minmax(0,1fr) 26px;gap:5px;padding:2px 2px;border-radius:6px}
  .play-toggle,.lyrics-btn,.drag-handle{min-width:23px;min-height:26px;border-radius:6px}
  .check{width:19px;height:19px;border-radius:6px}
  .drag-handle{font-size:15px}
  .song-main{display:flex;align-items:baseline;gap:7px;padding:3px 2px}
  .title{font-size:13.5px;flex:0 1 auto}
  .meta{font-size:10.5px;margin-top:0;flex:1 1 auto}
  .lyrics-btn{font-size:15px}
  .footer{margin-top:8px;font-size:11px}
}
@media(max-width:520px){.wrap{padding:14px 10px 30px}.brand h1{font-size:38px}.song{grid-template-columns:30px 28px minmax(0,1fr) 32px;gap:5px}.title{font-size:14.5px}.sheet-head{padding:12px}.sheet-title{font-size:22px}.sheet-tools{padding:8px;gap:5px}.tool-btn{padding:8px 9px;font-size:12px}.sheet-body{padding:14px 10px 70px}.sheet-position{width:100%;margin-left:0}}

</head>

const RAW_BASE="../songfiles/";

const ORDER_KEY="laurier:gig:order:v2",PLAYED_KEY="laurier:gig:played:v2",OLD_PLAYED_KEY="laurier:gig:played:v1",FONT_KEY="laurier:gig:lyrics-font",SPEED_KEY="laurier:gig:scroll-delay",OFFLINE_KEY="laurier:gig:offline-ready:v1";
const deepClone=x=>JSON.parse(JSON.stringify(x)); const allPublishedTitles=()=>DEFAULT_SETS.flatMap(s=>s.songs.map(x=>x[0]));
function loadOrder(){try{const saved=JSON.parse(localStorage.getItem(ORDER_KEY)||"null");if(!Array.isArray(saved)||saved.length!==DEFAULT_SETS.length)return deepClone(DEFAULT_SETS);const a=allPublishedTitles().slice().sort(),b=saved.flatMap(s=>(s.songs||[]).map(x=>x[0])).slice().sort();if(a.length!==b.length)return deepClone(DEFAULT_SETS);for(let i=0;i<a.length;i++)if(a[i]!==b[i])return deepClone(DEFAULT_SETS);return saved}catch(e){return deepClone(DEFAULT_SETS)}}
let sets=loadOrder(),played={};try{played=JSON.parse(localStorage.getItem(PLAYED_KEY)||"{}")||{};if(!Object.keys(played).length){const old=JSON.parse(localStorage.getItem(OLD_PLAYED_KEY)||"{}")||{};Object.keys(old).forEach(k=>{if(old[k]){const p=k.split(":");if(p.length>=3)played[p.slice(2).join(":")]=true}});if(Object.keys(played).length)localStorage.setItem(PLAYED_KEY,JSON.stringify(played))}}catch(e){played={}}
let sortables=[],currentSongTitle=null,scrollTimer=null,lyricsFont=Math.max(12,Math.min(28,parseInt(localStorage.getItem(FONT_KEY)||"16",10)||16)),scrollDelay=Math.max(12,Math.min(140,parseInt(localStorage.getItem(SPEED_KEY)||"50",10)||50));const lyricCache=new Map();
function saveOrder(){try{localStorage.setItem(ORDER_KEY,JSON.stringify(sets))}catch(e){}} function savePlayed(){try{localStorage.setItem(PLAYED_KEY,JSON.stringify(played))}catch(e){}}
function findSong(title){for(let si=0;si<sets.length;si++){const i=sets[si].songs.findIndex(s=>s[0]===title);if(i>=0)return{setIndex:si,index:i,song:sets[si].songs[i]}}return null}
function updateStats(){let md=0,mt=0;sets.forEach((set,si)=>{const d=set.songs.filter(s=>played[s[0]]).length,c=document.querySelector('[data-count-for="'+set.id+'"]');if(c)c.textContent=d+"/"+set.songs.length+" played";if(si<2){md+=d;mt+=set.songs.length}});document.getElementById("summary").textContent=md+"/"+mt+" main-set songs played"}
function render(){sortables.forEach(s=>{try{s.destroy()}catch(e){}});sortables=[];const grid=document.getElementById("grid");grid.innerHTML="";sets.forEach(set=>{const col=document.createElement("section");col.className="col "+set.cls;const head=document.createElement("div");head.className="colhead";const tr=document.createElement("div");tr.className="coltitle";const h=document.createElement("h2");h.textContent=set.title;const count=document.createElement("div");count.className="count";count.dataset.countFor=set.id;tr.append(h,count);const note=document.createElement("div");note.className="note";note.textContent=set.id==="alt"?"pull from here if needed":set.songs.length+" songs";head.append(tr,note);const list=document.createElement("div");list.className="list";list.id="list-"+set.id;list.dataset.setId=set.id;set.songs.forEach(song=>{const titleText=song[0],artist=song[1],key=song[2],row=document.createElement("div");row.className="song"+(played[titleText]?" done":"");row.dataset.title=titleText;const pb=document.createElement("button");pb.className="play-toggle";pb.type="button";pb.setAttribute("aria-label","Mark "+titleText+" played");pb.setAttribute("aria-pressed",played[titleText]?"true":"false");const check=document.createElement("span");check.className="check";pb.appendChild(check);pb.addEventListener("click",e=>{e.stopPropagation();if(played[titleText])delete played[titleText];else played[titleText]=true;savePlayed();row.classList.toggle("done",!!played[titleText]);pb.setAttribute("aria-pressed",played[titleText]?"true":"false");updateStats()});const handle=document.createElement("button");handle.className="drag-handle";handle.type="button";handle.setAttribute("aria-label","Drag "+titleText);handle.title="Drag to move";handle.textContent="☰";const main=document.createElement("button");main.className="song-main";main.type="button";const title=document.createElement("div");title.className="title";title.textContent=titleText;const meta=document.createElement("div");meta.className="meta";meta.textContent=[artist,key].filter(Boolean).join(" · ");main.append(title,meta);main.addEventListener("click",()=>openSong(titleText));const lb=document.createElement("button");lb.className="lyrics-btn";lb.type="button";lb.title="Chords / lyrics";lb.setAttribute("aria-label","Open chords and lyrics for "+titleText);lb.textContent="♪";lb.addEventListener("click",()=>openSong(titleText));row.append(pb,handle,main,lb);list.appendChild(row)});col.append(head,list);grid.appendChild(col)});if(window.Sortable){sets.forEach(set=>{const el=document.getElementById("list-"+set.id);if(!el)return;sortables.push(new Sortable(el,{group:"laurier-songs",animation:180,handle:".drag-handle",delay:120,delayOnTouchOnly:true,touchStartThreshold:4,forceFallback:true,fallbackOnBody:true,ghostClass:"sortable-ghost",chosenClass:"sortable-chosen",dragClass:"sortable-drag",scroll:true,scrollSensitivity:60,scrollSpeed:16,onEnd:()=>{syncSetsFromDom();if(navigator.vibrate){try{navigator.vibrate(35)}catch(e){}}}}))})}updateStats()}
function syncSetsFromDom(){const m=new Map(DEFAULT_SETS.flatMap(s=>s.songs).map(s=>[s[0],s]));sets=sets.map(set=>{const el=document.getElementById("list-"+set.id),titles=el?Array.from(el.children).map(r=>r.dataset.title):[];return{...set,songs:titles.map(t=>m.get(t)).filter(Boolean)}});saveOrder();updateStats()}
function stopAutoScroll(){if(scrollTimer)clearInterval(scrollTimer);scrollTimer=null;const b=document.getElementById("auto-scroll");b.textContent="▶ Auto";b.classList.remove("active")} function startAutoScroll(){stopAutoScroll();const body=document.getElementById("sheet-body"),b=document.getElementById("auto-scroll");b.textContent="⏸ Auto";b.classList.add("active");scrollTimer=setInterval(()=>{body.scrollTop+=1;if(body.scrollTop+body.clientHeight>=body.scrollHeight-3)stopAutoScroll()},scrollDelay)} function restartAutoIfNeeded(){if(scrollTimer)startAutoScroll()} function applyFont(){document.getElementById("lyrics-text").style.fontSize=lyricsFont+"px";try{localStorage.setItem(FONT_KEY,String(lyricsFont))}catch(e){}}

let swRegistration=null;
function chartUrl(file){return new URL("../songfiles/"+encodeURIComponent(file),window.location.href).href}
function offlineUrls(){
  const urls=[
    new URL("./index.html",window.location.href).href,
    "https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  ];
  Object.values(LYRIC_FILES).forEach(file=>urls.push(chartUrl(file)));
  return [...new Set(urls)];
}
async function swRequest(type,urls){
  if(!("serviceWorker" in navigator)) throw new Error("Service workers are not supported on this device.");
  if(!swRegistration) swRegistration=await navigator.serviceWorker.ready;
  const worker=swRegistration.active||swRegistration.waiting||swRegistration.installing||navigator.serviceWorker.controller;
  if(!worker) throw new Error("Offline worker is not ready yet.");
  return new Promise((resolve,reject)=>{
    const channel=new MessageChannel();
    const timer=setTimeout(()=>reject(new Error("Offline setup timed out.")),120000);
    channel.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data||{})};
    worker.postMessage({type,urls},[channel.port2]);
  });
}
function setOfflineUi(state,detail){
  const btn=document.getElementById("offline-btn"),status=document.getElementById("offline-status");
  if(!btn||!status)return;
  btn.classList.remove("offline-ready","offline-working");
  if(state==="ready"){
    btn.textContent="✓ Offline Ready";
    btn.classList.add("offline-ready");
    status.textContent=detail||("all "+Object.keys(LYRIC_FILES).length+" charts saved");
  }else if(state==="working"){
    btn.textContent="Saving…";
    btn.classList.add("offline-working");
    status.textContent=detail||"downloading charts";
  }else if(state==="partial"){
    btn.textContent="Refresh Offline";
    status.textContent=detail||"offline copy needs refresh";
  }else{
    btn.textContent="Prepare Offline";
    status.textContent=detail||"offline not prepared";
  }
}
async function refreshOfflineStatus(){
  try{
    const result=await swRequest("CHECK_URLS",offlineUrls());
    if(result.ok)setOfflineUi("ready","all "+Object.keys(LYRIC_FILES).length+" charts saved");
    else if(result.cached>0)setOfflineUi("partial",result.cached+"/"+result.total+" offline files saved");
    else setOfflineUi("idle","offline not prepared");
  }catch(e){
    setOfflineUi("idle","offline setup unavailable");
  }
}
async function prepareOffline(){
  const btn=document.getElementById("offline-btn");
  if(btn)btn.disabled=true;
  setOfflineUi("working","saving "+Object.keys(LYRIC_FILES).length+" chord charts…");
  try{
    if(navigator.storage&&navigator.storage.persist){try{await navigator.storage.persist()}catch(e){}}
    const result=await swRequest("CACHE_URLS",offlineUrls());
    if(result.ok){
      try{localStorage.setItem(OFFLINE_KEY,new Date().toISOString())}catch(e){}
      setOfflineUi("ready","all "+Object.keys(LYRIC_FILES).length+" charts saved");
    }else{
      setOfflineUi("partial",(result.cached||0)+"/"+(result.total||offlineUrls().length)+" offline files saved");
      alert("Most files were saved, but "+(result.failed||[]).length+" could not be cached. Stay online and tap Refresh Offline to try again.");
    }
  }catch(e){
    setOfflineUi("partial","offline setup needs an internet connection");
    alert("Offline setup could not finish. Connect to the internet and tap Prepare Offline again.");
  }finally{
    if(btn)btn.disabled=false;
  }
}
async function initOffline(){
  if(!("serviceWorker" in navigator)){setOfflineUi("idle","offline mode unsupported");return}
  try{
    swRegistration=await navigator.serviceWorker.register("./sw.js");
    await navigator.serviceWorker.ready;
    await refreshOfflineStatus();
  }catch(e){setOfflineUi("idle","offline setup unavailable")}
}

async function loadLyrics(title){if(lyricCache.has(title))return lyricCache.get(title);const file=LYRIC_FILES[title];if(!file){const r={ok:false,text:"No chord sheet is currently linked for this song.",file:null};lyricCache.set(title,r);return r}const url=RAW_BASE+encodeURIComponent(file);try{if(/\.txt$/i.test(file)){const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const r={ok:true,text:await res.text(),file};lyricCache.set(title,r);return r}if(/\.docx$/i.test(file)){const res=await fetch(url,{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const buf=await res.arrayBuffer();if(!window.mammoth)throw new Error("DOCX reader unavailable");const out=await window.mammoth.extractRawText({arrayBuffer:buf});const r={ok:true,text:out.value,file};lyricCache.set(title,r);return r}return{ok:false,text:"This chord sheet format cannot be displayed in Laurier yet.",file}}catch(e){return{ok:false,text:"Couldn't load this chord sheet. Try again with a connection.",file}}}
async function openSong(title){stopAutoScroll();currentSongTitle=title;const f=findSong(title);if(!f)return;const s=f.song,modal=document.getElementById("lyrics-modal"),text=document.getElementById("lyrics-text");document.getElementById("sheet-title").textContent=s[0];document.getElementById("sheet-meta").textContent=[s[1],s[2]].filter(Boolean).join(" · ");document.getElementById("sheet-source").textContent="";document.getElementById("sheet-position").textContent=sets[f.setIndex].title+" · "+(f.index+1)+" of "+sets[f.setIndex].songs.length;document.getElementById("nav-label").textContent=sets[f.setIndex].title;document.getElementById("prev-song").disabled=f.index===0;document.getElementById("next-song").disabled=f.index===sets[f.setIndex].songs.length-1;text.className="lyrics loading";text.textContent="Loading chord sheet…";document.getElementById("sheet-body").scrollTop=0;modal.classList.add("open");applyFont();const r=await loadLyrics(title);if(currentSongTitle!==title)return;text.className=r.ok?"lyrics":"lyrics missing";text.textContent=r.text;document.getElementById("sheet-source").textContent=r.file?"GitHub · songfiles/"+r.file:"No linked file";document.getElementById("sheet-body").scrollTop=0}
function moveModalSong(d){const f=findSong(currentSongTitle);if(!f)return;const n=f.index+d;if(n<0||n>=sets[f.setIndex].songs.length)return;openSong(sets[f.setIndex].songs[n][0])} function closeSong(){stopAutoScroll();currentSongTitle=null;document.getElementById("lyrics-modal").classList.remove("open")}
document.getElementById("close-sheet").addEventListener("click",closeSong);document.getElementById("lyrics-modal").addEventListener("click",function(e){if(e.target===this)closeSong()});document.getElementById("prev-song").addEventListener("click",()=>moveModalSong(-1));document.getElementById("next-song").addEventListener("click",()=>moveModalSong(1));document.getElementById("font-down").addEventListener("click",()=>{lyricsFont=Math.max(12,lyricsFont-1);applyFont()});document.getElementById("font-up").addEventListener("click",()=>{lyricsFont=Math.min(28,lyricsFont+1);applyFont()});document.getElementById("auto-scroll").addEventListener("click",()=>{scrollTimer?stopAutoScroll():startAutoScroll()});document.getElementById("scroll-slower").addEventListener("click",()=>{scrollDelay=Math.min(140,scrollDelay+10);try{localStorage.setItem(SPEED_KEY,String(scrollDelay))}catch(e){}restartAutoIfNeeded()});document.getElementById("scroll-faster").addEventListener("click",()=>{scrollDelay=Math.max(12,scrollDelay-10);try{localStorage.setItem(SPEED_KEY,String(scrollDelay))}catch(e){}restartAutoIfNeeded()});
function audienceUrl(){return window.location.origin+window.location.pathname+"?audience=1"}
function openAudienceQr(){
  const modal=document.getElementById("qr-modal"),box=document.getElementById("qr-code"),url=audienceUrl();
  box.innerHTML="";document.getElementById("qr-url").textContent=url;modal.classList.add("open");
  if(window.QRCode)new QRCode(box,{text:url,width:260,height:260,colorDark:"#211812",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});

function closeAudienceQr(){document.getElementById("qr-modal").classList.remove("open")}
function renderAudience(){
  document.title="Laurier — Tonight's Songs";
  document.body.innerHTML='<main class="audience-only"><div class="audience-grid" id="audience-grid"></div></main>';
  const grid=document.getElementById("audience-grid");
  DEFAULT_SETS.forEach(set=>{
    const col=document.createElement("section");col.className="audience-col";
    const h=document.createElement("h2");h.textContent=set.title;col.appendChild(h);
    set.songs.forEach(song=>{const row=document.createElement("div");row.className="audience-song";row.textContent=song[0];col.appendChild(row)});

}
document.getElementById("offline-btn").addEventListener("click",prepareOffline);

document.getElementById("reset-order").addEventListener("click",()=>{if(confirm("Restore the published Laurier set order and move every song back to its original column?")){sets=deepClone(DEFAULT_SETS);try{localStorage.removeItem(ORDER_KEY)}catch(e){}render()}});document.getElementById("reset-played").addEventListener("click",()=>{if(confirm("Clear all played checkmarks?")){played={};savePlayed();render()}});
document.addEventListener("keydown",e=>{const open=document.getElementById("lyrics-modal").classList.contains("open");if(e.key==="Escape"&&open)closeSong();if(!open)return;if(e.key==="ArrowLeft"&&!document.getElementById("prev-song").disabled)moveModalSong(-1);if(e.key==="ArrowRight"&&!document.getElementById("next-song").disabled)moveModalSong(1)});
let wakeLock=null;async function keepAwake(){if(!("wakeLock" in navigator)||document.visibilityState!=="visible"||wakeLock)return;try{wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}catch(e){}}keepAwake();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")keepAwake()});document.addEventListener("pointerdown",keepAwake,{once:true});
if(AUDIENCE_MODE){renderAudience()}else{render();applyFont();initOffline()}
