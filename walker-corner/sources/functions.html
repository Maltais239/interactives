<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Machine Detective</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for live graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Math.js for parsing algebraic expressions like "2.5x + 1" -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    
    <!-- Canvas Confetti for the win state -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Custom Google Fonts for a kid-friendly look */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        h1, h2, h3, .math-font {
            font-family: 'Fredoka', sans-serif;
        }

        .table-row-hover:hover {
            background-color: #e0f2fe;
            transition: background-color 0.2s;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border-8 border-sky-400">
        
        <!-- Header -->
        <header class="bg-sky-400 text-white p-6 text-center">
            <h1 class="text-4xl font-bold tracking-wide drop-shadow-md flex justify-center items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                Function Machine Detective
            </h1>
            <p class="mt-2 text-sky-100 text-lg">Analyze the table, plot the graph, and crack the mystery rule!</p>
        </header>

        <!-- Main Content Area -->
        <div class="p-6 md:p-8">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                
                <!-- Left Column: Table & Hint -->
                <div class="md:col-span-4 flex flex-col gap-6">
                    
                    <!-- Data Table -->
                    <div class="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 shadow-sm">
                        <h2 id="level-title" class="text-xl font-bold text-center text-slate-700 mb-4">Table of Values</h2>
                        <div class="overflow-hidden rounded-xl border border-slate-300">
                            <table class="w-full text-center border-collapse">
                                <thead class="bg-sky-100 text-sky-800 border-b-2 border-slate-300">
                                    <tr>
                                        <th class="py-3 px-4 font-bold text-lg border-r border-slate-300">Input (x)</th>
                                        <th class="py-3 px-4 font-bold text-lg">Output (y)</th>
                                    </tr>
                                </thead>
                                <tbody id="data-table-body" class="text-lg math-font">
                                    <!-- Rows generated by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Graphing -->
                <div class="md:col-span-8 flex flex-col gap-4">
                    <div class="bg-white border-2 border-slate-200 rounded-2xl p-4 shadow-sm h-80 md:h-96 relative">
                        <canvas id="graphCanvas"></canvas>
                    </div>

                    <!-- Input Area -->
                    <div class="bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-6 shadow-sm mt-2">
                        <h3 class="text-xl font-bold text-indigo-800 mb-3">What is the mystery rule?</h3>
                        <div class="flex flex-col sm:flex-row gap-4 items-center">
                            <div class="flex items-center text-3xl math-font font-bold text-slate-700 flex-1">
                                <span class="mr-3 text-indigo-600">y =</span>
                                <input type="text" id="rule-input" placeholder="e.g. 2x - 1" 
                                    class="w-full border-2 border-indigo-300 rounded-xl px-4 py-3 text-2xl focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition"
                                    autocomplete="off">
                            </div>
                            <button id="btn-check" class="w-full sm:w-auto bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-xl py-3 px-8 rounded-xl shadow-md transform hover:scale-105 transition">
                                Check Rule!
                            </button>
                        </div>
                        <p class="text-sm text-indigo-500 mt-2 font-semibold">Graph updates automatically as you type!</p>
                        
                        <!-- Feedback Message -->
                        <div id="feedback-msg" class="hidden mt-4 p-4 rounded-xl text-center font-bold text-lg transform transition-all"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer / Next Level -->
        <div class="bg-slate-50 border-t-2 border-slate-200 p-4 flex justify-between items-center">
            <span class="text-slate-500 font-semibold">Alberta Math Grade 6</span>
            <button id="btn-next" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-6 rounded-lg shadow transition flex items-center gap-2">
                Next Level
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </div>

    </div>

    <script>
        // --- Curriculum Config (Alberta Grade 6) ---
        // 20 predefined levels using whole numbers only, mixing addition and subtraction.
        const levels = [
            { a: 1, b: 1 },   // Level 1: y = x + 1
            { a: 2, b: 0 },   // Level 2: y = 2x
            { a: 2, b: -1 },  // Level 3: y = 2x - 1
            { a: 3, b: 1 },   // Level 4: y = 3x + 1
            { a: 3, b: -2 },  // Level 5: y = 3x - 2
            { a: 1, b: 4 },   // Level 6: y = x + 4
            { a: 2, b: -2 },  // Level 7: y = 2x - 2
            { a: 4, b: 0 },   // Level 8: y = 4x
            { a: 4, b: -3 },  // Level 9: y = 4x - 3
            { a: 2, b: 3 },   // Level 10: y = 2x + 3
            { a: 3, b: -1 },  // Level 11: y = 3x - 1
            { a: 5, b: 0 },   // Level 12: y = 5x
            { a: 5, b: -4 },  // Level 13: y = 5x - 4
            { a: 2, b: 5 },   // Level 14: y = 2x + 5
            { a: 4, b: -2 },  // Level 15: y = 4x - 2
            { a: 3, b: 4 },   // Level 16: y = 3x + 4
            { a: 6, b: -5 },  // Level 17: y = 6x - 5
            { a: 5, b: 2 },   // Level 18: y = 5x + 2
            { a: 4, b: -1 },  // Level 19: y = 4x - 1
            { a: 6, b: -3 }   // Level 20: y = 6x - 3
        ];
        
        let currentLevel = 0;
        let currentRule = levels[0];
        let tableData = [];
        let chartInstance = null;

        // DOM Elements
        const tableBody = document.getElementById('data-table-body');
        const ruleInput = document.getElementById('rule-input');
        const checkBtn = document.getElementById('btn-check');
        const nextBtn = document.getElementById('btn-next');
        const feedbackMsg = document.getElementById('feedback-msg');
        const levelTitle = document.getElementById('level-title');

        // --- Initialization ---
        window.onload = () => {
            initChart();
            loadLevel();
            
            // Event Listeners
            ruleInput.addEventListener('input', handleLiveGraphing);
            checkBtn.addEventListener('click', checkAnswer);
            nextBtn.addEventListener('click', () => {
                currentLevel++;
                loadLevel();
            });
            
            // Allow checking with Enter key
            ruleInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkAnswer();
            });
        };

        // --- Core Logic ---
        function loadLevel() {
            if (currentLevel >= levels.length) {
                showFeedback("🏆 You beat all 20 levels! Amazing job!", "success");
                ruleInput.disabled = true;
                checkBtn.disabled = true;
                nextBtn.classList.add('hidden');
                return;
            }

            // Reset UI
            ruleInput.value = '';
            feedbackMsg.classList.add('hidden');
            ruleInput.disabled = false;
            checkBtn.disabled = false;
            nextBtn.classList.add('hidden');
            
            currentRule = levels[currentLevel];
            levelTitle.innerText = `Table of Values (Level ${currentLevel + 1} / ${levels.length})`;
            
            // Generate Data Points
            tableData = [];
            for (let x = 1; x <= 5; x++) {
                let y = currentRule.a * x + currentRule.b;
                tableData.push({ x: x, y: y });
            }

            renderTable();
            updateChartActualPoints();
            clearLiveGraph();
            ruleInput.focus();
        }

        function renderTable() {
            tableBody.innerHTML = '';
            tableData.forEach(point => {
                const tr = document.createElement('tr');
                tr.className = 'table-row-hover border-b border-slate-200';
                tr.innerHTML = `
                    <td class="py-3 px-4 border-r border-slate-300 text-sky-700 font-bold">${point.x}</td>
                    <td class="py-3 px-4 text-emerald-700 font-bold">${point.y}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // --- Charting Logic ---
        function initChart() {
            const ctx = document.getElementById('graphCanvas').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: 'Mystery Points',
                            data: [],
                            backgroundColor: '#ef4444', // Red dots
                            borderColor: '#ef4444',
                            pointRadius: 8,
                            pointHoverRadius: 10,
                            showLine: false
                        },
                        {
                            label: 'Your Guess',
                            data: [],
                            borderColor: '#8b5cf6', // Purple line
                            borderWidth: 4,
                            type: 'line',
                            fill: false,
                            pointRadius: 0,
                            tension: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 0 // Snappy updates for live typing
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            min: 0,
                            max: 10,
                            grid: { color: '#e2e8f0' },
                            title: { display: true, text: 'Input (x)', font: { size: 14, weight: 'bold', family: 'Nunito' } }
                        },
                        y: {
                            type: 'linear',
                            min: 0,
                            max: 30, // Default max, adjusted dynamically
                            grid: { color: '#e2e8f0' },
                            title: { display: true, text: 'Output (y)', font: { size: 14, weight: 'bold', family: 'Nunito' } }
                        }
                    },
                    plugins: {
                        legend: { position: 'top', labels: { font: { family: 'Nunito', weight: 'bold' } } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `(x: ${context.parsed.x}, y: ${context.parsed.y})`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function updateChartActualPoints() {
            chartInstance.data.datasets[0].data = tableData;
            
            // Adjust Y-Axis dynamically based on the max Y value in the table
            const maxY = Math.max(...tableData.map(d => d.y));
            chartInstance.options.scales.y.max = Math.ceil(maxY / 5) * 5 + 5; // Round up to nearest 5, add padding
            chartInstance.update();
        }

        function clearLiveGraph() {
            chartInstance.data.datasets[1].data = [];
            chartInstance.update();
        }

        function handleLiveGraphing() {
            const expression = ruleInput.value.trim().toLowerCase();
            if (expression === '') {
                clearLiveGraph();
                return;
            }

            try {
                // Compile the math expression safely using math.js
                const compiledExpr = math.compile(expression);
                
                // Generate points to draw the line
                let lineData = [];
                for (let x = 0; x <= 10; x++) {
                    const y = compiledExpr.evaluate({ x: x });
                    // Prevent crazy values from breaking the chart display
                    if (y >= -50 && y <= 100) {
                        lineData.push({ x: x, y: y });
                    }
                }
                
                chartInstance.data.datasets[1].data = lineData;
                chartInstance.update();
            } catch (err) {
                // If expression is invalid/incomplete while typing (e.g. "2x + "), 
                // we just ignore the error and don't draw the line yet.
            }
        }

        // --- Validation Logic ---
        function checkAnswer() {
            const expression = ruleInput.value.trim().toLowerCase();
            
            if (expression === '') {
                showFeedback("Please enter a rule first!", "error");
                return;
            }

            try {
                const compiledExpr = math.compile(expression);
                let isCorrect = true;

                // Test the student's expression against all 5 table points
                for (let i = 0; i < tableData.length; i++) {
                    const point = tableData[i];
                    const studentY = compiledExpr.evaluate({ x: point.x });
                    
                    // Allow small floating point differences (e.g., if decimal math gets weird)
                    if (Math.abs(studentY - point.y) > 0.01) {
                        isCorrect = false;
                        break;
                    }
                }

                if (isCorrect) {
                    showFeedback("🎉 Amazing work, Detective! Rule cracked!", "success");
                    triggerConfetti();
                    ruleInput.disabled = true;
                    checkBtn.disabled = true;
                    nextBtn.classList.remove('hidden');
                } else {
                    showFeedback("Not quite! Look at the graph. Does your line hit the red dots?", "error");
                }

            } catch (err) {
                showFeedback("I couldn't read that rule. Try something like '2x + 1' or '3x - 2'", "error");
            }
        }

        function showFeedback(message, type) {
            feedbackMsg.innerHTML = message;
            feedbackMsg.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700');
            
            if (type === 'success') {
                feedbackMsg.classList.add('bg-emerald-100', 'text-emerald-800', 'border-2', 'border-emerald-400');
            } else {
                feedbackMsg.classList.add('bg-red-100', 'text-red-700', 'border-2', 'border-red-400');
            }
        }

        function triggerConfetti() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#38bdf8', '#818cf8', '#34d399', '#fbbf24']
            });
        }
    </script>
</body>
</html>
