<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bridge screen checks</title><style>body{margin:0;font:14px system-ui;background:#cbd3cc}header{padding:8px;background:#fff;display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:2}select,button{font:inherit;min-height:44px}iframe{display:block;border:0;margin:10px auto;background:white}#frameWrap{overflow:auto;height:calc(100vh - 65px)}</style></head><body><header><label>Viewport <select id="size"><option value="1366,650">1366 × 650</option><option value="1024,540">1024 × 540</option><option value="768,900">768 × 900</option><option value="390,667">390 × 667</option><option value="320,568">320 × 568</option><option value="640,360">640 × 360</option><option value="1280,800">1280 × 800</option></select></label><label>Text size <select id="text"><option value="100">100%</option><option value="150">150%</option><option value="200">200%</option></select></label><button id="read">Read layout</button><output id="out"></output></header><div id="frameWrap"><iframe id="frame" title="Bridge game responsive preview" src="../index.html?v=20261007-game3"></iframe></div><script>const f=document.getElementById('frame'),s=document.getElementById('size');function resize(){const[w,h]=s.value.split(',');f.style.width=w+'px';f.style.height=h+'px';}s.onchange=resize;document.getElementById('text').onchange=()=>{f.contentDocument.documentElement.style.fontSize=document.getElementById('text').value+'%';f.contentWindow.dispatchEvent(new Event('resize'));};document.getElementById('read').onclick=()=>{const d=f.contentDocument,c=d.querySelector('canvas');document.getElementById('out').textContent=JSON.stringify({viewport:[f.clientWidth,f.clientHeight],overflow:d.documentElement.scrollWidth-f.clientWidth,canvas:[c.clientWidth,c.clientHeight],mode:d.getElementById('modeBadge').textContent,pieces:d.getElementById('pieces').textContent,cost:d.getElementById('cost').textContent});};resize();</script></body></html>
