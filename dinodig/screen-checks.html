<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRATA screen checks</title><style>body{font:15px system-ui;margin:18px;background:#ece7df;color:#272117}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{font:inherit;padding:10px 12px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#4b3822;color:white}#frame-wrap{width:100%;overflow:auto}iframe{display:block;border:1px solid #77664d;background:#15100b}p{max-width:75ch;line-height:1.5}</style></head><body><h1>STRATA screen checks</h1><p>Choose a viewport. Changes resize the same activity frame and preserve the dig and notebook. Use the activity’s real tools and Clear next section to check partial and completed digs.</p><nav aria-label="Preview size" id="sizes"></nav><p id="size-status" role="status"></p><div id="frame-wrap"><iframe id="activity" title="STRATA test activity" src="./?screen-check=20261008"></iframe></div><script>
const sizes=[[1024,540],[1366,650],[768,900],[390,667],[320,568],[640,360]];
const frame=document.getElementById('activity'),nav=document.getElementById('sizes');frame.src='./?screen-check='+Date.now();
function resize(w,h){frame.style.width=w+'px';frame.style.height=h+'px';document.getElementById('size-status').textContent=w+' × '+h;nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===w+'x'+h));}
sizes.forEach(([w,h])=>{const b=document.createElement('button');b.textContent=w+' × '+h;b.dataset.size=w+'x'+h;b.onclick=()=>resize(w,h);nav.append(b);});resize(1024,540);
</script></body></html>
