<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Geography 195 — Neon 1980s Edition</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03010d;
    }
    #game {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #03010d;
    }
  </style>
</head>
<body>
  <iframe id="game" src="../worldgeography195/" title="World Geography 195 Neon Edition"></iframe>

  <script>
    const game = document.getElementById('game');

    game.addEventListener('load', () => {
      const doc = game.contentDocument;
      if (!doc) return;

      doc.title = 'World Geography 195 — Neon 1980s Edition';

      const fontLink = doc.createElement('link');
      fontLink.rel = 'stylesheet';
      fontLink.href = 'https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap';
      doc.head.appendChild(fontLink);

      const style = doc.createElement('style');
      style.id = 'neon-1980s-theme';
      style.textContent = `
        :root {
          --night: #03010d;
          --deep: #08051d;
          --panel: #0c0824;
          --cyan: #00f5ff;
          --blue: #3b82ff;
          --pink: #ff2bd6;
          --purple: #8b5cf6;
          --yellow: #ffe66d;
          --green: #55ff9a;
          --muted: #a9b3d9;
        }

        * { box-sizing: border-box; }

        html, body {
          background: var(--night) !important;
          color: #eefaff !important;
          font-family: 'Rajdhani', 'Poppins', sans-serif !important;
        }

        body::after {
          content: '';
          position: fixed;
          inset: 0;
          pointer-events: none;
          z-index: 9999;
          opacity: 0.085;
          background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.18) 0px,
            rgba(255,255,255,0.18) 1px,
            transparent 1px,
            transparent 4px
          );
        }

        .leaflet-container {
          background:
            radial-gradient(circle at 50% 38%, #151052 0%, #08051d 38%, #03010d 76%) !important;
          outline: 1px solid rgba(0,245,255,.25) !important;
        }

        #map {
          position: relative !important;
          border-right: 1px solid rgba(0,245,255,.6) !important;
          box-shadow:
            inset -18px 0 40px rgba(0,245,255,.06),
            inset 0 -60px 100px rgba(255,43,214,.06) !important;
        }

        #map .leaflet-overlay-pane canvas {
          filter:
            invert(.95)
            hue-rotate(175deg)
            brightness(.54)
            contrast(1.85)
            saturate(2.6)
            drop-shadow(0 0 2px rgba(0,245,255,.72));
        }

        #info-panel {
          width: 390px !important;
          max-width: 42% !important;
          padding: 1.65rem !important;
          background:
            linear-gradient(180deg, rgba(13,7,39,.98) 0%, rgba(5,3,22,.99) 100%) !important;
          border-left: 2px solid var(--cyan) !important;
          box-shadow:
            -7px 0 0 rgba(255,43,214,.28),
            -18px 0 55px rgba(0,245,255,.15),
            inset 18px 0 45px rgba(139,92,246,.07) !important;
        }

        #info-panel h2 {
          margin: .15rem 0 1rem !important;
          padding: 0 0 .75rem !important;
          border-bottom: 1px solid rgba(0,245,255,.55) !important;
          font-family: 'Orbitron', sans-serif !important;
          font-size: 1.52rem !important;
          line-height: 1.18 !important;
          letter-spacing: .09em !important;
          text-transform: uppercase !important;
          color: var(--cyan) !important;
          text-shadow:
            0 0 5px rgba(0,245,255,.95),
            0 0 16px rgba(0,245,255,.55),
            2px 2px 0 rgba(255,43,214,.7) !important;
        }

        .neon-subtitle {
          display: block;
          margin-top: .45rem;
          font-family: 'Rajdhani', sans-serif;
          font-size: .75rem;
          font-weight: 700;
          letter-spacing: .28em;
          color: var(--pink);
          text-shadow: 0 0 7px rgba(255,43,214,.8);
        }

        .mode-switcher,
        .region-switcher {
          gap: .35rem !important;
          padding: .38rem !important;
          border: 1px solid rgba(0,245,255,.34) !important;
          border-radius: 8px !important;
          background: rgba(4,4,22,.76) !important;
          box-shadow: inset 0 0 20px rgba(0,245,255,.05) !important;
        }

        .region-switcher {
          border-color: rgba(255,43,214,.32) !important;
          box-shadow: inset 0 0 20px rgba(255,43,214,.05) !important;
        }

        .mode-btn,
        .region-btn {
          font-family: 'Orbitron', sans-serif !important;
          font-size: .78rem !important;
          letter-spacing: .03em !important;
          color: #aeefff !important;
          border: 1px solid transparent !important;
          border-radius: 5px !important;
          background: transparent !important;
          transition: .18s ease !important;
        }

        .region-btn {
          font-family: 'Rajdhani', sans-serif !important;
          font-size: .88rem !important;
          font-weight: 700 !important;
          color: #efc6ff !important;
        }

        .mode-btn:hover,
        .region-btn:hover {
          color: #fff !important;
          border-color: rgba(0,245,255,.6) !important;
          box-shadow: 0 0 13px rgba(0,245,255,.15) !important;
        }

        .mode-btn.active {
          color: #041017 !important;
          background: linear-gradient(135deg, var(--cyan), #72f7ff) !important;
          border-color: #aafaff !important;
          box-shadow:
            0 0 8px rgba(0,245,255,.75),
            0 0 22px rgba(0,245,255,.35) !important;
        }

        .region-btn.active {
          color: #fff !important;
          background: linear-gradient(135deg, #9b38ff, var(--pink)) !important;
          border-color: #ff97ec !important;
          box-shadow:
            0 0 8px rgba(255,43,214,.75),
            0 0 20px rgba(255,43,214,.28) !important;
        }

        #info-content,
        #result-box {
          border-top: 1px solid rgba(0,245,255,.2) !important;
        }

        #info-content h3,
        #result-box h3,
        #practice-panel h3,
        #result-box h2 {
          font-family: 'Orbitron', sans-serif !important;
          color: var(--cyan) !important;
          letter-spacing: .04em !important;
          text-shadow: 0 0 8px rgba(0,245,255,.48) !important;
        }

        #info-content p,
        #result-box p,
        #practice-panel p,
        .loading-text {
          color: #d7e8ff !important;
          font-size: 1.03rem !important;
          line-height: 1.5 !important;
        }

        #info-content p strong,
        #result-box p strong,
        #question-box strong {
          color: var(--yellow) !important;
          text-shadow: 0 0 6px rgba(255,230,109,.4) !important;
        }

        #question-box {
          background:
            linear-gradient(135deg, rgba(0,245,255,.08), rgba(255,43,214,.07)) !important;
          border: 1px solid rgba(0,245,255,.6) !important;
          border-radius: 7px !important;
          color: #effcff !important;
          box-shadow:
            inset 0 0 26px rgba(0,245,255,.05),
            0 0 18px rgba(0,245,255,.08) !important;
        }

        #question-box small {
          color: #efb9ff !important;
        }

        #result-box p.feedback-correct {
          color: var(--green) !important;
          text-shadow: 0 0 7px rgba(85,255,154,.45) !important;
        }

        #result-box p.feedback-incorrect {
          color: #ff6bcf !important;
          text-shadow: 0 0 7px rgba(255,43,214,.42) !important;
        }

        .game-btn {
          font-family: 'Orbitron', sans-serif !important;
          font-size: .76rem !important;
          letter-spacing: .03em !important;
          border: 1px solid currentColor !important;
          color: #fff !important;
          background: #11092e !important;
          box-shadow: 0 0 15px rgba(139,92,246,.12) !important;
        }

        #next-question-btn {
          color: var(--cyan) !important;
          border-color: var(--cyan) !important;
        }
        #play-again-btn {
          color: var(--green) !important;
          border-color: var(--green) !important;
        }
        #hint-btn {
          color: var(--yellow) !important;
          border-color: var(--yellow) !important;
        }
        #hint-btn:disabled {
          color: #686b82 !important;
          border-color: #45485b !important;
          background: #090816 !important;
        }

        .practice-item {
          color: #e8faff !important;
          background: rgba(8,7,30,.88) !important;
          border: 1px solid rgba(255,43,214,.4) !important;
          border-left: 3px solid var(--pink) !important;
          box-shadow: inset 0 0 15px rgba(255,43,214,.04) !important;
        }
        .practice-item:hover {
          background: rgba(255,43,214,.11) !important;
          box-shadow: 0 0 14px rgba(255,43,214,.14) !important;
        }

        #info-panel::-webkit-scrollbar { width: 8px; }
        #info-panel::-webkit-scrollbar-track { background: #07051a; }
        #info-panel::-webkit-scrollbar-thumb {
          background: linear-gradient(var(--cyan), var(--pink));
          border-radius: 10px;
        }

        @media (max-width: 800px) {
          #info-panel {
            width: 330px !important;
            padding: 1.15rem !important;
          }
          #info-panel h2 { font-size: 1.18rem !important; }
        }
      `;
      doc.head.appendChild(style);

      const heading = doc.querySelector('#info-panel h2');
      if (heading) {
        heading.innerHTML = 'World Geography 195<span class="neon-subtitle">NEON EDITION // 1986</span>';
      }

      const map = doc.getElementById('map');
      if (map && !doc.getElementById('retro-grid-overlay')) {
        const grid = doc.createElement('div');
        grid.id = 'retro-grid-overlay';
        grid.setAttribute('aria-hidden', 'true');
        grid.style.cssText = `
          position:absolute;
          left:0;
          right:0;
          bottom:0;
          height:38%;
          z-index:500;
          pointer-events:none;
          opacity:.20;
          background-image:
            linear-gradient(rgba(0,245,255,.55) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,43,214,.45) 1px, transparent 1px);
          background-size:36px 22px;
          transform-origin:bottom center;
          transform:perspective(430px) rotateX(58deg) scaleX(1.16);
          mask-image:linear-gradient(to top, #000 8%, rgba(0,0,0,.65) 54%, transparent 100%);
        `;
        map.appendChild(grid);
      }

      const corner = doc.createElement('div');
      corner.setAttribute('aria-hidden', 'true');
      corner.textContent = 'WORLD // 195';
      corner.style.cssText = `
        position:fixed;
        left:16px;
        top:14px;
        z-index:950;
        pointer-events:none;
        padding:6px 9px;
        font:700 10px/1 'Orbitron', sans-serif;
        letter-spacing:.16em;
        color:#00f5ff;
        border:1px solid rgba(0,245,255,.65);
        background:rgba(3,1,13,.68);
        box-shadow:0 0 14px rgba(0,245,255,.22);
        text-shadow:0 0 6px rgba(0,245,255,.7);
      `;
      doc.body.appendChild(corner);
    });
  </script>
</body>
</html>
