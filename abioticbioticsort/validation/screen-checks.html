<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biotic & Abiotic screen checks</title><style>body{margin:0;background:#edf2f5;color:#17344d;font:16px/1.4 system-ui}header{padding:12px 18px;background:white}h1{font-size:20px;margin:0 0 8px}label,button{font:inherit}select,button{padding:8px;min-height:44px;margin:3px;border:1px solid #b7c6d0;border-radius:5px;background:white}main{padding:14px;overflow:auto}iframe{display:block;border:1px solid #7997a4;background:white;max-width:none}</style></head><body><header><h1>Biotic &amp; Abiotic screen checks</h1><label>Viewport <select id="viewport"><option value="1366,650">1366 × 650</option><option value="1024,540">1024 × 540</option><option value="768,900">768 × 900</option><option value="390,667">390 × 667</option><option value="320,568">320 × 568</option><option value="640,360">640 × 360</option><option value="512,270">512 × 270</option></select></label><button id="zoom" type="button">200% text</button><p id="status">Choose a viewport; game state is preserved.</p></header><main><iframe id="activity" title="Biotic & Abiotic" src="../index.html"></iframe></main><script>const frame=document.getElementById('activity'),select=document.getElementById('viewport');function resize(){const [width,height]=select.value.split(',');frame.width=width;frame.height=height;document.getElementById('status').textContent=width+' × '+height+' — same game, no reload';}select.addEventListener('change',resize);document.getElementById('zoom').addEventListener('click',()=>{const doc=frame.contentDocument;const expanded=doc.documentElement.dataset.zoom!=='2';doc.documentElement.dataset.zoom=expanded?'2':'1';doc.documentElement.style.zoom=expanded?'2':'';document.getElementById('zoom').textContent=expanded?'100% text':'200% text';});resize();</script></body></html>
