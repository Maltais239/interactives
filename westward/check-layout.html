<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Westward · Screen checks</title><style>body{margin:0;background:#edf2f7;color:#193d54;font:16px system-ui,sans-serif}header{padding:14px 20px;background:white;border-bottom:1px solid #cad8e3}h1{font-size:20px;margin:0 0 10px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{font-weight:600}select,button,a{font:inherit;padding:10px;border:1px solid #bbccd9;border-radius:7px;background:white;color:#14596b;min-height:44px;box-sizing:border-box}a{text-decoration:none;display:inline-flex;align-items:center}p{font-size:13px;color:#7a8fa1;margin:10px 0 0}.stage{padding:16px;overflow:auto}iframe{display:block;border:1px solid #b5c6d4;background:white;box-shadow:0 3px 18px #16394c18}</style></head><body><header><h1>Westward screen checks</h1><div class="controls"><label>Screen <select id="screen"><option value="1024,540">Small Chromebook · 1024 × 540</option><option value="1366,650">Laptop · 1366 × 650</option><option value="768,900">Tablet · 768 × 900</option><option value="390,667">Phone · 390 × 667</option><option value="320,568">Small phone · 320 × 568</option><option value="640,360">Landscape phone · 640 × 360</option></select></label><button id="check">Check layout</button><a href="./">Open app</a></div><p id="status" role="status">Loading…</p></header><main class="stage"><iframe id="preview" title="Westward screen preview" src="./index.html?layout-check=3"></iframe></main><script>
const frame=document.querySelector('#preview'),screen=document.querySelector('#screen'),status=document.querySelector('#status');
function measure(){try{const doc=frame.contentDocument,win=frame.contentWindow,root=doc.documentElement,map=doc.querySelector('#map'),box=map?.getBoundingClientRect();status.textContent=`${win.innerWidth} × ${win.innerHeight} · Horizontal overflow: ${Math.max(0,Math.max(root.scrollWidth,doc.body.scrollWidth)-root.clientWidth)} px`+(box?` · Map: ${Math.round(box.width)} × ${Math.round(box.height)} px`:'')+' · Resize without reloading to check that edits and map position persist.';}catch{status.textContent='Check the app visually.';}}
function resize(){const [w,h]=screen.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';requestAnimationFrame(()=>requestAnimationFrame(measure));}
screen.addEventListener('change',resize);document.querySelector('#check').addEventListener('click',measure);frame.addEventListener('load',()=>{measure();frame.contentDocument.fonts?.ready.then(measure);});resize();
</script></body></html>
