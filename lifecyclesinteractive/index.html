<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5944bc">
<title>Life Cycles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#29234c;--green:#6041cf;--paper:#5944bc;--line:#29234c;--accent:#ffcf3e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 20%,#8062d4 0 18%,transparent 18.2%),radial-gradient(ellipse at 100% 95%,#4435a0 0 28%,transparent 28.2%),var(--paper);color:var(--ink);font-family:Nunito,"Trebuchet MS",sans-serif;min-height:100vh;overflow-anchor:none}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible{outline:4px solid #ffbd25;outline-offset:5px}button:disabled{cursor:default}button,img{-webkit-user-select:none;user-select:none}img{object-fit:contain}h1,h2,p{margin:0}[hidden]{display:none!important}
.page{max-width:1100px;margin:auto;padding:clamp(20px,4vw,42px) 24px 20px}.masthead{text-align:center;margin-bottom:28px;color:white}.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px;color:#ffe678}.leaf{display:inline-block;width:19px;height:19px;background:#ffcf3e;clip-path:polygon(50% 0,62% 32%,98% 15%,77% 48%,100% 65%,66% 69%,68% 100%,48% 79%,20% 100%,29% 66%,0 56%,29% 40%,12% 10%,43% 30%)}h1{font-size:clamp(40px,6vw,68px);font-weight:900;letter-spacing:-.04em;line-height:1.05;text-shadow:0 4px 0 #352876}h1 span{color:#ffda46}.subtitle{font-size:clamp(18px,2vw,22px);margin-top:12px;color:#fff2d7}
body:has(#game:not([hidden])) .masthead{display:none}body:has(#game:not([hidden])) .page{padding-top:24px}.intro{text-align:center}.intro h2{font-size:22px;font-weight:900;margin-bottom:22px;color:white}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:950px;margin:auto}.choice{position:relative;border:3px solid var(--ink);border-radius:32px 32px 46px 32px;padding:24px 16px 22px;min-height:310px;box-shadow:0 8px 0 #30265c;transition:transform .15s,box-shadow .15s;background:var(--tint)}.choice:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 13px 0 #30265c}.choice img{display:block;width:178px;height:178px;padding:16px;background:#fffaf0;border:2px solid var(--ink);border-radius:50%;margin:0 auto 18px;filter:drop-shadow(0 4px 0 rgba(41,35,76,.15))}.choice strong{display:block;font-size:30px;font-weight:900;line-height:1.15}.choice span{display:inline-block;margin-top:10px;font-size:16px;font-weight:900;border-radius:30px;background:#fffaf0;padding:6px 15px}.choice span::after{content:' →';padding-left:5px}.butterfly{--tint:#ffac82}.frog{--tint:#ffe052}.tree{--tint:#79dfed}.intro-note{margin:28px auto 10px;font-size:18px;color:#fff2d7;font-weight:700}
.game{background:#fffcf5;border:3px solid var(--ink);border-radius:28px;padding:24px 28px 20px;box-shadow:0 9px 0 #30265c}.game-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding-bottom:16px;border-bottom:3px solid #ede3fb}.game-heading{display:flex;align-items:center;gap:12px}.game-icon{width:60px;height:60px;padding:8px;border:2px solid var(--ink);border-radius:20px;background:var(--tint)}.game h2{font-size:29px;line-height:1.15;font-weight:900}.quiet{border:2px solid var(--ink);background:white;border-radius:13px;padding:10px 16px;min-height:44px;font-weight:900;box-shadow:0 3px 0 #e6d8ee}.quiet:hover{background:#ffe577}.instruction{font-size:20px;font-weight:900;margin-bottom:16px}.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;min-height:174px;align-content:start}.picture{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:2px solid var(--ink);background:#ffdd62;border-radius:19px;padding:12px 8px;min-height:174px;box-shadow:0 5px 0 #cbbcdb;font-size:19px;font-weight:900;transition:transform .15s,box-shadow .15s}.picture[data-stage="larva"],.picture[data-stage="tadpole"],.picture[data-stage="seedling"]{background:#9ce5ee}.picture[data-stage="pupa"],.picture[data-stage="froglet"],.picture[data-stage="sapling"]{background:#ceb0fa}.picture[data-stage="adult"]{background:#ffb096}.picture img{width:109px;height:109px;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(41,35,76,.08))}.picture:hover{transform:translateY(-3px);box-shadow:0 8px 0 #cbbcdb}.picture[aria-pressed="true"]{outline:4px solid var(--green);outline-offset:3px;transform:translateY(-4px)}.empty-shelf{grid-column:1/-1;align-self:center;text-align:center;font-size:19px;color:#664b8f;padding:40px 8px;font-weight:800}
.sequence-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 17px}.sequence-heading h3{font-size:20px;margin:0;font-weight:900}.progress{font-size:14px;color:#4f3582;font-weight:900;background:#ede3fb;border-radius:25px;padding:5px 12px}.sequence{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.slot{position:relative;min-width:0;min-height:168px;border:3px dashed #9673ce;border-radius:20px;background:#f0e8fc;padding:32px 8px 10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:19px;font-weight:900}.slot:not(:last-child)::after{content:'→';position:absolute;right:-24px;top:calc(50% - 16px);font-size:25px;font-weight:900;color:#6b43b0;pointer-events:none}.number{position:absolute;top:-16px;left:10px;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#ffdd62;color:var(--ink);font-size:21px;border:2px solid var(--ink);box-shadow:0 3px 0 #cbbcdb}.slot:nth-child(2) .number{background:#9ce5ee}.slot:nth-child(3) .number{background:#ceb0fa}.slot:nth-child(4) .number{background:#ffb096}.slot img{width:91px;height:91px;pointer-events:none}.slot .hint{font-weight:800;font-size:16px;color:#75549e}.slot.filled{border-style:solid;background:white;border-color:var(--ink);box-shadow:0 4px 0 #e6d8ee}.slot.ready,.slot.over{border-color:#6041cf;background:#e9dbff}.slot.correct{border-color:#138168;background:#d0f4e6}.slot.retry{border-color:#cb6725;background:#fff0cd}.result-mark{font-size:12px;line-height:1;font-weight:900;color:#096954}.retry .result-mark{color:#92501f}.cycle-note{font-size:15px;color:#664b8f;text-align:center;margin-top:13px;font-weight:700}.cycle-note span{font-size:21px;vertical-align:middle;margin-right:5px}
.bottom{margin-top:18px;text-align:center}.feedback{min-height:30px;font-size:18px;font-weight:900;margin-bottom:12px;line-height:1.4}.feedback.success{color:#096954}.buttons{display:flex;align-items:center;justify-content:center;gap:14px}.primary{border:2px solid var(--ink);border-radius:14px;background:var(--green);color:white;padding:12px 28px;min-height:48px;font-size:18px;font-weight:900;box-shadow:0 4px 0 #30265c}.primary:hover{background:#4d2eaf}.primary:disabled{background:#e9def3;color:#625176;box-shadow:0 3px 0 #d1c0df;border-color:#b49acb}.footer{text-align:center;margin-top:26px;font-size:12px;line-height:1.5;color:#f0e6ff}.footer a{color:inherit}
@media(max-width:650px){.page{padding:22px 16px 16px}.masthead{margin-bottom:24px}.choices{gap:12px;grid-template-columns:1fr;max-width:400px}.choice{display:grid;grid-template-columns:100px 1fr;align-items:center;text-align:left;min-height:135px;padding:14px 20px;border-radius:24px}.choice img{grid-row:1/3;width:88px;height:88px;margin:0;padding:8px}.choice strong{align-self:end;font-size:24px}.choice span{align-self:start;margin-top:4px}.intro h2{font-size:20px;margin-bottom:16px}.intro-note{font-size:16px;margin-top:20px}.game{padding:20px 14px;border-radius:22px}.game-header{gap:8px;align-items:flex-start}.game-icon{width:44px;height:44px;border-radius:14px;padding:6px}.game-heading{gap:8px}.game h2{font-size:22px;max-width:130px}.game-header .quiet{font-size:14px;padding:8px 10px}.instruction{font-size:17px}.shelf{grid-template-columns:repeat(2,minmax(0,1fr));min-height:282px;gap:12px}.picture{min-height:135px;font-size:17px;padding:10px 6px}.picture img{width:78px;height:78px}.sequence{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px}.slot{min-height:150px;font-size:17px}.slot img{width:78px;height:78px}.slot:nth-child(2)::after{content:none}.slot:nth-child(3)::after{content:'→'}.sequence-heading{margin-top:22px}.sequence-heading h3{font-size:18px}.progress{font-size:13px}.feedback{font-size:17px}.buttons .primary{padding:12px 20px}.bottom .quiet{padding:10px 12px}.footer{margin-top:20px}.empty-shelf{padding:90px 8px}}
@media(max-width:350px){.page{padding:18px 12px}.game{padding:18px 10px}.game-heading{gap:6px}.game-icon{width:36px;height:36px}.game h2{font-size:20px}.game-header .quiet{max-width:84px}.picture,.slot{font-size:16px}.buttons{gap:8px}.buttons .primary{padding:12px 16px;font-size:17px}.bottom .quiet{font-size:15px}}
@media(max-height:760px) and (min-width:651px){.page{padding-top:20px}.masthead{margin-bottom:18px}h1{font-size:40px}.subtitle{margin-top:6px}.game{padding:18px 24px}.game-header{margin-bottom:10px}.game-icon{width:44px;height:44px}.shelf{min-height:125px}.picture{min-height:125px;padding:8px}.picture img{width:72px;height:72px}.slot{min-height:135px}.slot img{width:70px;height:70px}.sequence-heading{margin-top:20px}.footer{margin-top:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
 <header class="masthead"><p class="eyebrow"><span class="leaf" aria-hidden="true"></span> Watch life grow</p><h1>Life <span>cycles</span></h1><p class="subtitle">Little beginnings. Amazing changes.</p></header>
 <section id="intro" class="intro" aria-labelledby="choose-heading"><h2 id="choose-heading">Choose a life cycle</h2><div class="choices">
  <button class="choice butterfly" data-cycle="butterfly"><img src="assets/summer.webp" alt=""><strong>Butterfly</strong><span>Let's explore</span></button>
  <button class="choice frog" data-cycle="frog"><img src="assets/frog.webp" alt=""><strong>Frog</strong><span>Let's explore</span></button>
  <button class="choice tree" data-cycle="tree"><img src="assets/tree.webp" alt=""><strong>Tree</strong><span>Let's explore</span></button>
 </div><p class="intro-note">Put the pictures in order. See how life changes!</p></section>
 <section id="game" class="game" hidden aria-labelledby="game-title">
  <div class="game-header"><div class="game-heading"><img id="game-icon" class="game-icon" alt=""><h2 id="game-title" tabindex="-1"></h2></div><button id="back" class="quiet">← Choose another</button></div>
  <p class="instruction">Tap a picture. Tap a space.</p>
  <div id="shelf" class="shelf" aria-label="Pictures to put in order"></div>
  <div class="sequence-heading"><h3>What comes first?</h3><span id="progress" class="progress">0 of 4 placed</span></div>
  <div id="sequence" class="sequence" aria-label="Life cycle order"></div>
  <p class="cycle-note"><span aria-hidden="true">↻</span> A life cycle starts again.</p>
  <div class="bottom"><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div class="buttons"><button id="reset" class="quiet">Start again</button><button id="check" class="primary" disabled>Check order</button></div></div>
 </section>
 <footer class="footer">Icons by Freepik · <a href="https://www.flaticon.com" target="_blank" rel="noopener">Flaticon</a></footer>
</main>
<script>
const cycles = {
 butterfly:{name:'Butterfly',image:'summer',stages:[['egg','Eggs','butterflyeggs'],['larva','Caterpillar','caterpillar'],['pupa','Chrysalis','chrysalis'],['adult','Butterfly','summer']]},
 frog:{name:'Frog',image:'frog',stages:[['egg','Eggs','eggs'],['tadpole','Tadpole','tadpole'],['froglet','Froglet','froglet'],['adult','Frog','frog']]},
 tree:{name:'Tree',image:'tree',stages:[['seed','Seed','sunflower-seed'],['seedling','Seedling','sprout'],['sapling','Young tree','sapling'],['adult','Tree','tree']]}
};
const $=id=>document.getElementById(id);
let cycle, order=[], placed=[null,null,null,null], selected=null, checked=false, solved=false;
function shuffle(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
function image(stage){return `<img src="assets/${stage[2]}.webp" alt="">`}
function stageFor(id){return cycle.stages.find(stage=>stage[0]===id)}
function say(text,success=false){$('feedback').textContent=text;$('feedback').classList.toggle('success',success)}
function render(){
 $('shelf').innerHTML=order.filter(stage=>!placed.includes(stage[0])).map(stage=>`<button class="picture" draggable="${!solved}" data-stage="${stage[0]}" aria-pressed="${selected===stage[0]}" aria-label="${stage[1]}, choose picture">${image(stage)}<span>${stage[1]}</span></button>`).join('') || '<p class="empty-shelf">All four pictures are in place!</p>';
 $('sequence').innerHTML=placed.map((id,i)=>{
  const stage=id&&stageFor(id),correct=id===cycle.stages[i][0];
  return `<button class="slot ${id?'filled':''} ${selected?'ready':''} ${checked?(correct?'correct':'retry'):''}" data-slot="${i}" aria-label="Space ${i+1}${stage?', '+stage[1]+(solved?', correct':', tap to return picture'): ', empty'}" ${solved?'disabled':''}><span class="number">${i+1}</span>${stage?image(stage)+'<span>'+stage[1]+'</span>':'<span class="hint">Place here</span>'}${checked?'<span class="result-mark">'+(correct?'✓ Correct':'Try again')+'</span>':''}</button>`
 }).join('');
 const count=placed.filter(Boolean).length;$('progress').textContent=`${count} of 4 placed`;$('check').disabled=count!==4||solved;
}
function reset(){placed=[null,null,null,null];selected=null;checked=false;solved=false;order=shuffle([...cycle.stages]);say('');render()}
function start(id){cycle=cycles[id];$('intro').hidden=true;$('game').hidden=false;$('game').className='game '+id;$('game-title').textContent=cycle.name+' life cycle';$('game-icon').src='assets/'+cycle.image+'.webp';reset();$('game-title').focus({preventScroll:true});window.scrollTo(0,0)}
function place(id,index){if(solved||!stageFor(id))return;const old=placed.indexOf(id);if(old!==-1)placed[old]=null;placed[index]=id;selected=null;checked=false;render();say(`${stageFor(id)[1]} in space ${index+1}.`);$('sequence').querySelector(`[data-slot="${index}"]`).focus({preventScroll:true})}
document.querySelectorAll('[data-cycle]').forEach(button=>button.addEventListener('click',()=>start(button.dataset.cycle)));
$('shelf').addEventListener('click',event=>{const button=event.target.closest('[data-stage]');if(!button||solved)return;selected=selected===button.dataset.stage?null:button.dataset.stage;render();say(selected?'Now tap a space.':'Choose a picture.');$('shelf').querySelector(`[data-stage="${button.dataset.stage}"]`).focus({preventScroll:true})});
$('sequence').addEventListener('click',event=>{const button=event.target.closest('[data-slot]');if(!button||solved)return;const i=Number(button.dataset.slot);if(selected){place(selected,i)}else if(placed[i]){const stage=stageFor(placed[i]);placed[i]=null;checked=false;render();say(stage[1]+' is back with the pictures.');$('shelf').querySelector(`[data-stage="${stage[0]}"]`).focus({preventScroll:true})}else{say('Choose a picture first.')}});
// Mouse users can drag pictures; touch and keyboard users can choose and place them.
$('shelf').addEventListener('dragstart',event=>{const button=event.target.closest('[data-stage]');if(!button||solved)return;event.dataTransfer.setData('text/plain',button.dataset.stage);event.dataTransfer.effectAllowed='move'});
$('sequence').addEventListener('dragover',event=>{const button=event.target.closest('[data-slot]');if(button&&!solved){event.preventDefault();event.dataTransfer.dropEffect='move';button.classList.add('over')}});
$('sequence').addEventListener('dragleave',event=>{const button=event.target.closest('[data-slot]');if(button&&!button.contains(event.relatedTarget))button.classList.remove('over')});
$('sequence').addEventListener('drop',event=>{const button=event.target.closest('[data-slot]');if(button){event.preventDefault();place(event.dataTransfer.getData('text/plain'),Number(button.dataset.slot))}});
$('check').addEventListener('click',()=>{if(placed.some(id=>!id))return;checked=true;solved=placed.every((id,i)=>id===cycle.stages[i][0]);render();say(solved?'You did it! You put the life cycle in order.':'Some pictures need a new spot. Try again!',solved);if(solved)$('reset').focus({preventScroll:true})});
$('reset').addEventListener('click',reset);
$('back').addEventListener('click',()=>{$('game').hidden=true;$('intro').hidden=false;document.querySelector(`[data-cycle="${Object.keys(cycles).find(id=>cycles[id]===cycle)}"]`).focus({preventScroll:true});window.scrollTo(0,0)});
</script>
</body>
</html>
