/* Cropper-style 6ths: pairs of 6ths anchored to the key's I chord.
   Melody degree over harmony degree a 6th below: R/3, 2/4, 3/5, plus the
   dominant 5/b7 pair for soul flavor. Played on skip-string pairs (mute the middle). */
const CROPPER_PAIR_SETS = { "1 & 3": [3, 5], "2 & 4": [2, 4] }; // [harmony string, melody string]
const CROPPER_DEFS = [
  { mIv: 0, hIv: 4, semi: 8, label: "R / 3" },
  { mIv: 2, hIv: 5, semi: 9, label: "2 / 4" },
  { mIv: 4, hIv: 7, semi: 9, label: "3 / 5" },
  { mIv: 7, hIv: 10, semi: 9, label: "5 / ♭7", dom: true },
];
function cropperPairs(keyPc, loS, hiS) {
  const m0 = (keyPc - OPEN_PC[hiS] + 12) % 12; // root pair's melody fret
  return CROPPER_DEFS.map((d) => {
    const mf = m0 + d.mIv;
    const hf = OPEN_SEMIS[hiS] + mf - d.semi - OPEN_SEMIS[loS];
    const frets = [-1, -1, -1, -1, -1, -1];
    frets[loS] = hf; frets[hiS] = mf;
    return { frets, label: d.label, dom: !!d.dom, mPc: (keyPc + d.mIv) % 12, hPc: (keyPc + d.hIv) % 12, mf, hf };
  });
}

/* ---------------- Rhythm Trainer (standard notation) ---------------- */
/* Cells are one- or two-beat rhythm figures on a percussion line. Everything —
   noteheads, rests, counts, gridlines — is placed off ONE absolute beat grid,
   so the count syllable always sits directly under the note it names.
   labels: [offsetInCell, kind, isRest]; kind "n" prints the beat number. */
const RHYTHM_CELLS = {
  q:    { beats: 1, events: [0],                  labels: [[0, "n"]] },
  h:    { beats: 2, events: [0],                  labels: [[0, "n"], [1, "n", true]] },
  ee:   { beats: 1, events: [0, 0.5],             labels: [[0, "n"], [0.5, "&"]] },
  ssss: { beats: 1, events: [0, 0.25, 0.5, 0.75], labels: [[0, "n"], [0.25, "e"], [0.5, "&"], [0.75, "a"]], sixt: true },
  ess:  { beats: 1, events: [0, 0.5, 0.75],       labels: [[0, "n"], [0.5, "&"], [0.75, "a"]], sixt: true },
  sse:  { beats: 1, events: [0, 0.25, 0.5],       labels: [[0, "n"], [0.25, "e"], [0.5, "&"]], sixt: true },
  re:   { beats: 1, events: [0.5],                labels: [[0, "n", true], [0.5, "&"]] },
  qr:   { beats: 1, events: [],                   labels: [[0, "n", true]] },
  t:    { beats: 1, events: [0, 1 / 3, 2 / 3],    labels: [[0, "n"], [1 / 3, "trip"], [2 / 3, "let"]], trip: true },
  dqe:  { beats: 2, events: [0, 1.5],             labels: [[0, "n"], [1, "n", true], [1.5, "&"]] },
};
/* Swing: eighth-note offbeats slide to the last third of the beat.
   Cells built from sixteenths or triplets are left straight — swinging them is
   meaningless (and the notes would collide). */
const swingOff = (o, cell) => (cell.sixt || cell.trip || o % 1 !== 0.5 ? o : Math.floor(o) + 2 / 3);
const RHYTHM_EXERCISES = [
  { name: "Quarter pulse", cells: ["q", "q", "q", "q"], hint: "One strum per click — the anchor" },
  { name: "Half notes", cells: ["h", "h"], hint: "Hold two full beats; count through the space" },
  { name: "Even eighths", cells: ["ee", "ee", "ee", "ee"], hint: "Down-up, perfectly even" },
  { name: "Quarters & eighths", cells: ["q", "ee", "q", "ee"], hint: "Switch densities without rushing" },
  { name: "Rests count too", cells: ["q", "qr", "ee", "q"], hint: "Silence has a beat — feel the empty 2" },
  { name: "Offbeat eighths", cells: ["re", "re", "re", "re"], hint: "Only the &s — reggae skank territory" },
  { name: "Sixteenth bursts", cells: ["ssss", "q", "ssss", "q"], hint: "1 e & a — keep it a burst, not a blur" },
  { name: "Gallop", cells: ["ess", "ess", "q", "q"], hint: "Eighth + two sixteenths — the driving figure" },
  { name: "Reverse gallop", cells: ["sse", "sse", "q", "q"], hint: "Two sixteenths + eighth — flip the gallop" },
  { name: "Triplets", cells: ["t", "t", "t", "t"], hint: "Three per beat — say trip-l-et" },
  { name: "Dotted quarter", cells: ["dqe", "ee", "q"], hint: "The push — land on the & of 2" },
  { name: "Syncopa", cells: ["ee", "re", "ee", "q"], hint: "The missing downbeat of 2 is the hook" },
  { name: "Shuffle", cells: ["ee", "ee", "ee", "ee"], hint: "Same eighths, swung — long-short, the blues engine", feel: "swing" },
  { name: "Charleston", cells: ["dqe", "qr", "qr"], hint: "Beat 1 and the & of 2, then let it ring — swing it", feel: "swing" },
  { name: "Shuffle & rest", cells: ["ee", "qr", "ee", "re"], hint: "Swung, with holes — comp like a jazz guitarist", feel: "swing" },
];
function RhythmStaff({ cells, hotBeat, swing }) {
  const TOP = 14, LINE = 48, CNT = 74, PAD = 10, W1 = 112;
  const totalBeats = cells.reduce((a, c) => a + RHYTHM_CELLS[c].beats, 0);
  const width = PAD * 2 + totalBeats * W1;
  const L = PAD + 18, R = width - PAD - 14;       // note field
  const xAt = (b) => L + (b / totalBeats) * (R - L); // ONE grid: absolute beat → x
  const unit = (R - L) / totalBeats;
  const els = [];

  const head = (cx, open, key) => (
    <ellipse key={key} cx={cx} cy={LINE} rx={6} ry={4.6} fill={open ? "none" : T.cream} stroke={T.cream} strokeWidth={open ? 2 : 1} transform={`rotate(-18 ${cx} ${LINE})`} />
  );
  const stem = (cx, key) => <line key={key} x1={cx + 5.6} y1={LINE - 2} x2={cx + 5.6} y2={TOP + 4} stroke={T.cream} strokeWidth="1.6" />;
  const flag = (cx, key) => <path key={key} d={`M ${cx + 5.6} ${TOP + 4} q 9 3 7 14 q -1 -7 -7 -8 Z`} fill={T.cream} />;
  const dot = (cx, key) => <circle key={key} cx={cx + 11} cy={LINE - 3} r={2.2} fill={T.cream} />;
  const beam = (x1, x2, level, key) => (
    <rect key={key} x={x1 + 5.6} y={TOP + 4 + level * 6} width={Math.max(4, x2 - x1)} height={3.4} fill={T.cream} />
  );
  const eighthRest = (cx, key) => (
    <g key={key}>
      <circle cx={cx - 1} cy={LINE - 13} r={2.8} fill={T.muted} />
      <path d={`M ${cx - 1} ${LINE - 11} Q ${cx + 5} ${LINE - 10} ${cx + 6} ${LINE - 14} L ${cx + 1} ${LINE + 3}`} stroke={T.muted} strokeWidth="1.8" fill="none" />
    </g>
  );
  const quarterRest = (cx, key) => (
    <path key={key} d={`M ${cx} ${LINE - 16} L ${cx + 6} ${LINE - 8} L ${cx + 1} ${LINE - 2} Q ${cx + 9} ${LINE + 2} ${cx + 4} ${LINE + 9} Q ${cx - 1} ${LINE + 3} ${cx + 3} ${LINE}`} stroke={T.muted} strokeWidth="2.4" fill="none" />
  );

  /* beat grid — the reference the counts and noteheads both hang from */
  for (let b = 0; b < totalBeats; b++) {
    els.push(<line key={"g" + b} x1={xAt(b)} y1={TOP - 2} x2={xAt(b)} y2={CNT - 12} stroke={T.line} strokeWidth="1" opacity={b === 0 ? 0 : 0.35} strokeDasharray="2 4" />);
    if (hotBeat === b) els.push(<rect key={"hb" + b} x={xAt(b) - 12} y={TOP - 8} width={unit} height={CNT - TOP + 4} rx={7} fill={T.amber} opacity="0.13" />);
  }

  let beat = 0;
  cells.forEach((type, ci) => {
    const cell = RHYTHM_CELLS[type];
    const xs = cell.events.map((o) => xAt(beat + o));
    if (type === "q") els.push(head(xs[0], false, ci + "n0"), stem(xs[0], ci + "s0"));
    else if (type === "h") els.push(head(xs[0], true, ci + "n0"), stem(xs[0], ci + "s0"));
    else if (type === "ee") els.push(head(xs[0], false, ci + "n0"), head(xs[1], false, ci + "n1"), stem(xs[0], ci + "s0"), stem(xs[1], ci + "s1"), beam(xs[0], xs[1], 0, ci + "b0"));
    else if (type === "ssss") {
      xs.forEach((cx, k) => els.push(head(cx, false, ci + "n" + k), stem(cx, ci + "s" + k)));
      els.push(beam(xs[0], xs[3], 0, ci + "b0"), beam(xs[0], xs[3], 1, ci + "b1"));
    } else if (type === "ess") {
      xs.forEach((cx, k) => els.push(head(cx, false, ci + "n" + k), stem(cx, ci + "s" + k)));
      els.push(beam(xs[0], xs[2], 0, ci + "b0"), beam(xs[1], xs[2], 1, ci + "b1"));
    } else if (type === "sse") {
      xs.forEach((cx, k) => els.push(head(cx, false, ci + "n" + k), stem(cx, ci + "s" + k)));
      els.push(beam(xs[0], xs[2], 0, ci + "b0"), beam(xs[0], xs[1], 1, ci + "b1"));
    } else if (type === "re") {
      els.push(eighthRest(xAt(beat) + 2, ci + "r0"), head(xs[0], false, ci + "n0"), stem(xs[0], ci + "s0"), flag(xs[0], ci + "f0"));
    } else if (type === "qr") {
      els.push(quarterRest(xAt(beat) + unit / 2 - 4, ci + "r0"));
    } else if (type === "t") {
      xs.forEach((cx, k) => els.push(head(cx, false, ci + "n" + k), stem(cx, ci + "s" + k)));
      els.push(beam(xs[0], xs[2], 0, ci + "b0"));
      els.push(<text key={ci + "t3"} x={(xs[0] + xs[2]) / 2 + 5} y={TOP - 1} fontSize="11" fontStyle="italic" fontWeight="700" fill={T.muted} textAnchor="middle">3</text>);
    } else if (type === "dqe") {
      els.push(head(xs[0], false, ci + "n0"), stem(xs[0], ci + "s0"), dot(xs[0], ci + "d0"));
      els.push(head(xs[1], false, ci + "n1"), stem(xs[1], ci + "s1"), flag(xs[1], ci + "f1"));
    }
    /* counts — one per label, anchored to the same x as its note */
    cell.labels.forEach(([o, kind, rest], li) => {
      const abs = beat + o;
      const txt = kind === "n" ? String(Math.floor(abs) + 1) : kind;
      const hot = Math.floor(abs) === hotBeat;
      els.push(
        <text key={ci + "c" + li} x={xAt(abs)} y={CNT} fontSize={kind === "trip" || kind === "let" ? 9.5 : 11.5}
          fontWeight="700" fill={rest ? T.faint : hot ? T.amber : T.muted} textAnchor="middle" fontFamily="inherit" opacity={rest ? 0.75 : 1}>
          {rest ? `(${txt})` : txt}
        </text>
      );
    });
    beat += cell.beats;
  });

  return (
    <svg viewBox={`0 0 ${width} 84`} style={{ width: "100%", maxWidth: 560, display: "block", margin: "0 auto" }}>
      <line x1={PAD - 4} y1={LINE} x2={width - PAD + 4} y2={LINE} stroke={T.muted} strokeWidth="1.4" opacity="0.7" />
      <line x1={PAD - 4} y1={TOP} x2={PAD - 4} y2={LINE + 8} stroke={T.cream} strokeWidth="3" />
      <line x1={width - PAD + 4} y1={TOP} x2={width - PAD + 4} y2={LINE + 8} stroke={T.cream} strokeWidth="3" />
      {els}
      {swing && (
        <text x={width - PAD - 6} y={TOP - 3} fontSize="10.5" fontWeight="700" fill={T.amber} textAnchor="end" fontFamily="inherit">
          swing ♪♪ = long–short
        </text>
      )}
    </svg>
  );
}
function RhythmTrainer() {
  const [exIdx, setExIdx] = useState(0);
  const [bpm, setBpm] = useState(70);
  const [barsPer, setBarsPer] = useState(4);
  const [swing, setSwing] = useState(false);
  const [running, setRunning] = useState(false);
  const [hotBeat, setHotBeat] = useState(-1);
  const [sessionDone, setSessionDone] = useState(false);
  const bpmRef = useRef(bpm); useEffect(() => { bpmRef.current = bpm; }, [bpm]);
  const exRef = useRef(exIdx); useEffect(() => { exRef.current = exIdx; }, [exIdx]);
  const barsRef = useRef(barsPer); useEffect(() => { barsRef.current = barsPer; }, [barsPer]);
  const swingRef = useRef(swing); useEffect(() => { swingRef.current = swing; }, [swing]);
  /* an exercise that wants a feel sets it as the circuit rolls in */
  useEffect(() => { const f = RHYTHM_EXERCISES[exIdx].feel; if (f) setSwing(f === "swing"); }, [exIdx]);
  const nextRef = useRef(0); const barCountRef = useRef(0); const schedRef = useRef(null); const uiRef = useRef([]);

  const voiceBar = (at) => {
    const ex = RHYTHM_EXERCISES[exRef.current];
    const spb = 60 / bpmRef.current;
    let beat = 0;
    for (let b = 0; b < 4; b++) click(at + b * spb, b === 0);
    ex.cells.forEach((type) => {
      const cell = RHYTHM_CELLS[type];
      cell.events.forEach((o) => {
        const off = swingRef.current ? swingOff(o, cell) : o;
        pluck(523.25, at + (beat + off) * spb, { gain: off === 0 && beat === 0 ? 0.36 : 0.3, dur: 0.35, damp: 0.93 });
      });
      beat += cell.beats;
    });
    const ctx = audioCtx();
    for (let b = 0; b < 4; b++) uiRef.current.push(setTimeout(() => setHotBeat(b), Math.max(0, (at + b * spb - ctx.currentTime) * 1000)));
  };
  const scheduler = () => {
    const ctx = audioCtx(); if (!ctx) return;
    const spb = 60 / bpmRef.current;
    while (nextRef.current < ctx.currentTime + 0.2) {
      voiceBar(nextRef.current);
      const barEnd = nextRef.current + 4 * spb;
      barCountRef.current++;
      if (barCountRef.current >= barsRef.current) {
        barCountRef.current = 0;
        const isLast = exRef.current + 1 >= RHYTHM_EXERCISES.length;
        const delay = Math.max(0, (barEnd - ctx.currentTime) * 1000);
        if (isLast) {
          [0, 4, 7, 12].forEach((iv, i) => pluck(261.63 * Math.pow(2, iv / 12), barEnd - ctx.currentTime + 0.1 + i * 0.12, { gain: 0.32, dur: 1.4 }));
          uiRef.current.push(setTimeout(() => { setSessionDone(true); stop(); setExIdx(0); }, delay));
          nextRef.current = barEnd;
          return;
        }
        pluck(1318.5, barEnd - ctx.currentTime, { gain: 0.35, dur: 0.5 });
        uiRef.current.push(setTimeout(() => setExIdx((e) => e + 1), delay));
      }
      nextRef.current = barEnd;
    }
    schedRef.current = setTimeout(scheduler, 30);
  };
  const start = () => {
    const ctx = audioCtx(); if (!ctx) return;
    setRunning(true); setSessionDone(false);
    barCountRef.current = 0;
    nextRef.current = ctx.currentTime + 0.15;
    scheduler();
  };
  const stop = () => {
    setRunning(false);
    clearTimeout(schedRef.current);
    uiRef.current.forEach(clearTimeout); uiRef.current = [];
    setHotBeat(-1);
  };
  useEffect(() => () => { clearTimeout(schedRef.current); uiRef.current.forEach(clearTimeout); }, []);

  const ex = RHYTHM_EXERCISES[exIdx];
  const swingable = !ex.cells.every((c) => RHYTHM_CELLS[c].sixt || RHYTHM_CELLS[c].trip || RHYTHM_CELLS[c].events.every((o) => o % 1 !== 0.5));
  return (
    <div className="card" style={{ marginBottom: 14 }}>
      <div style={{ fontWeight: 800, fontSize: 17, fontFamily: "'Fraunces', Georgia, serif", marginBottom: 4 }}>Rhythm Reading</div>
      <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 10 }}>
        Read the bar, count it out loud, then clap or strum it against the click. Each rhythm repeats for your set number of bars, then rolls to the next — a full reading circuit.
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {RHYTHM_EXERCISES.map((e, i) => (
          <button key={e.name} className="chip" style={drillChip(exIdx === i)} onClick={() => { setExIdx(i); barCountRef.current = 0; }}>{e.name}</button>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 6 }}>
        <div>
          <span style={{ fontWeight: 800, fontSize: 16, fontFamily: "'Fraunces', Georgia, serif", color: T.amber }}>{ex.name}</span>
          <span style={{ color: T.faint, fontSize: 13 }}> · {exIdx + 1} of {RHYTHM_EXERCISES.length}</span>
          <div style={{ fontSize: 12.5, color: T.muted }}>{ex.hint}</div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="chip" style={running ? btnGhost : btnAmber} onClick={running ? stop : start}>{running ? "■ Stop" : "▶ Start"}</button>
          <button className="chip" style={btnGhost} onClick={() => { setExIdx((exIdx + 1) % RHYTHM_EXERCISES.length); barCountRef.current = 0; }}>Skip ▸</button>
        </div>
      </div>
      {sessionDone && <div style={{ color: T.green, fontWeight: 800, fontSize: 13, marginBottom: 6 }}>Reading circuit complete — every figure 🎸</div>}
      <div style={{ background: T.raised, border: `1px solid ${T.line}`, borderRadius: 12, padding: "12px 8px 6px" }}>
        <RhythmStaff cells={ex.cells} hotBeat={hotBeat} swing={swing && swingable} />
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 12 }}>
        <button className="chip" style={drillChip(false)} onClick={() => setBpm(Math.max(40, bpm - 5))}>−</button>
        <span style={{ fontSize: 13.5, fontWeight: 800, minWidth: 64, textAlign: "center" }}>{bpm} bpm</span>
        <button className="chip" style={drillChip(false)} onClick={() => setBpm(Math.min(180, bpm + 5))}>+</button>
        <span style={{ width: 10 }} />
        <span style={{ fontSize: 11.5, color: T.faint }}>bars each</span>
        {[2, 4, 8].map((n) => (
          <button key={n} className="chip" style={drillChip(barsPer === n)} onClick={() => setBarsPer(n)}>{n}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 8 }}>
        <span style={{ fontSize: 11.5, color: T.faint }}>feel</span>
        <button className="chip" style={drillChip(!swing)} onClick={() => setSwing(false)}>Straight</button>
        <button className="chip" style={drillChip(swing)} onClick={() => setSwing(true)}>Swing</button>
        <span style={{ fontSize: 11.5, color: swing && !swingable ? T.amber : T.faint }}>
          {swing ? (swingable ? "offbeats land late — long-short, ⅔ of the beat" : "this figure has no eighth offbeats — plays straight") : "eighths split the beat evenly"}
        </span>
      </div>
    </div>
  );
}

/* ---------------- Diatonic Triad Drill ---------------- */
const TRIAD_PREFS = { keyPc: 0, secs: 20 };
function DiatonicTriadDrill() {
  const SET_ORDER = ["3–5", "2–4", "1–3"];
  const [keyPc, setKeyPc] = useState(TRIAD_PREFS.keyPc);
  const [secs, setSecs] = useState(TRIAD_PREFS.secs);
  const [bpm, setBpm] = useState(70);
  const [step, setStep] = useState(0); // 0..8: (set,inv) pairs, set-major order
  const [focus, setFocus] = useState(false);
  const [sessionDone, setSessionDone] = useState(false);
  useEffect(() => { TRIAD_PREFS.keyPc = keyPc; }, [keyPc]);
  useEffect(() => { TRIAD_PREFS.secs = secs; }, [secs]);
  const stopRef = useRef(() => {});
  const setIdxOf = Math.floor(step / 3);
  const invOf = step % 3;
  const setName = SET_ORDER[setIdxOf];
  const advance = () => {
    if (step + 1 >= 9) {
      setSessionDone(true);
      [0, 4, 7, 12].forEach((iv, i) => pluck(261.63 * Math.pow(2, iv / 12), 0.3 + i * 0.12, { gain: 0.32, dur: 1.4 }));
      stopRef.current();
      setStep(0);
      return;
    }
    setStep(step + 1);
  };
  const { running, remaining, start, stop } = useDrillClock(bpm, secs, advance);
  stopRef.current = stop;
  const begin = () => { setSessionDone(false); start(); };

  const row = useMemo(() => diatonicRow(keyPc, invOf, TRIAD_SETS[setName]), [keyPc, invOf, setName]);
  const playRow = () => row.forEach((c, i) => strum(c.frets, false, i * 0.42));

  return (
    <div className="card" style={{ marginBottom: 14 }}>
      <div style={{ fontWeight: 800, fontSize: 17, fontFamily: "'Fraunces', Georgia, serif", marginBottom: 4 }}>Diatonic Triad Drill</div>
      {!focus && (
        <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 10 }}>
          All seven chords of the key as triads. Each chime advances the inversion — Root → 1st → 2nd — then rolls to the next string set. Play each chord across the row in time.
        </div>
      )}
      {!focus && (
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 10 }}>
          {NOTES.map((n, i) => (
            <button key={n} className="chip" style={drillChip(keyPc === i)} onClick={() => setKeyPc(i)}>{n}</button>
          ))}
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        <div>
          <span style={{ fontWeight: 800, fontSize: 16 }}>{NOTES[keyPc]} major</span>
          <span style={{ color: T.amber, fontWeight: 700, fontSize: 14 }}> · {INV_NAMES[invOf]} · strings {setName}</span>
          <span style={{ color: T.faint, fontSize: 13 }}> · {step + 1} of 9</span>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="chip" style={running ? btnGhost : btnAmber} onClick={running ? stop : begin}>{running ? "■ Stop" : "▶ Start drill"}</button>
          <button className="chip" style={btnGhost} onClick={advance}>Skip ▸</button>
          <button className="chip" style={btnGhost} onClick={playRow}>♪ Hear row</button>
          <button className="chip" style={btnGhost} onClick={() => setFocus(!focus)}>{focus ? "⛶ Exit" : "⛶ Focus"}</button>
        </div>
      </div>
      <TimerBar remaining={remaining} secs={secs} />
      {sessionDone && <div style={{ color: T.green, fontWeight: 800, fontSize: 13, marginTop: 6 }}>Complete — all inversions, all string sets 🎸</div>}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 12, justifyContent: "center" }}>
        {row.map((c, i) => (
          <div key={i} onClick={() => strum(c.frets)}
            style={{ cursor: "pointer", textAlign: "center", background: T.raised, borderRadius: 10, padding: "4px 4px 2px", border: `1px solid ${T.line}`, minWidth: 74 }}>
            <div style={{ fontSize: 12.5, fontWeight: 800 }}>{c.name} <span style={{ color: T.faint, fontWeight: 400, fontSize: 10 }}>{c.deg}</span></div>
            <ChordDiagram frets={c.frets} size={78} label={c.name} rootPc={rootPcOf(c.name)} />
          </div>
        ))}
      </div>
      {!focus && (
        <DrillControls bpm={bpm} setBpm={setBpm} secs={secs} setSecs={setSecs} />
      )}
    </div>
  );
}

/* ---------------- 6ths in Context (I–IV–V across the string sets) ---------------- */
/* 6ths aren't licks you memorise — they're a map. Over each chord you play that
   chord's own R/3, 2/4, 3/5 (and 5/♭7 for dominant grit). The real skill is
   choosing WHICH string set keeps your hand still as the changes move: a song in
   E sits on the 2&4 set for the I, then hops to the top set for the IV and V. */
const SIXTH_PROGS = [
  { id: "145", name: "I – IV – V", seq: [0, 5, 7], hint: "The backbone — one bar each" },
  { id: "1454", name: "I – IV – V – IV", seq: [0, 5, 7, 5], hint: "The soul/country vamp" },
  { id: "1541", name: "I – V – IV – I", seq: [0, 7, 5, 0], hint: "Descending — the fall home" },
  { id: "blues", name: "12-bar blues", seq: [0, 0, 0, 0, 5, 5, 0, 0, 7, 5, 0, 7], hint: "Where the 6ths live across a whole blues", dom: true },
];
const ROMAN_OF_OFF = { 0: "I", 5: "IV", 7: "V" };
/* All 6th pairs for one chord, on one string set, at one octave */
function sixthLayout(rootPc, setName, oct) {
  const [loS, hiS] = CROPPER_PAIR_SETS[setName];
  const pairs = cropperPairs(rootPc, loS, hiS).map((p) => {
    const mf = p.mf + oct, hf = p.hf + oct;
    const frets = [-1, -1, -1, -1, -1, -1];
    frets[loS] = hf; frets[hiS] = mf;
    return { ...p, mf, hf, frets };
  });
  /* the hand's zone is set by the three core pairs; the dominant 5/♭7 is colour
     that sits above it, so it shouldn't drag the position choice around */
  const core = pairs.slice(0, 3).flatMap((p) => [p.mf, p.hf]);
  const all = pairs.flatMap((p) => [p.mf, p.hf]);
  const lo = Math.min(...core), hi = Math.max(...core);
  return { setName, loS, hiS, pairs, lo, hi, top: Math.max(...all), bottom: Math.min(...all),
    mean: core.reduce((a, b) => a + b, 0) / core.length };
}
/* Pick the set + octave that keeps the hand closest to where it already is */
function chooseSixthLayout(rootPc, prevMean, pinned) {
  const sets = pinned ? [pinned] : Object.keys(CROPPER_PAIR_SETS);
  let best = null;
  for (const sn of sets) {
    for (const oct of [-12, 0, 12]) {
      const L = sixthLayout(rootPc, sn, oct);
      if (L.bottom < 0 || L.top > 15) continue;
      const score = (prevMean == null ? Math.abs(L.mean - 6) : Math.abs(L.mean - prevMean) + 0.3 * Math.abs(L.mean - 6));
      if (!best || score < best.score) best = { ...L, score };
    }
  }
  return best || sixthLayout(rootPc, sets[0], 0);
}
function SixthsMap() {

  const [playing, setPlaying] = useState(false);
  const loopRef = useRef(false); useEffect(() => { loopRef.current = loop; }, [loop]);
  const timers = useRef([]);
  const prog = SIXTH_PROGS.find((p) => p.id === progId);

  const chart = useMemo(() => {
    let prevMean = null;
    return prog.seq.map((off) => {
      const rpc = (keyPc + off) % 12;
      const L = chooseSixthLayout(rpc, prevMean, pin);
      prevMean = L.mean;
      return { off, rpc, rn: ROMAN_OF_OFF[off], name: NOTES[rpc], ...L };
    });
  }, [prog, keyPc, pin]);

  const stop = () => { timers.current.forEach(clearTimeout); timers.current = []; setPlaying(false); setHotPair(-1); };

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const playPair = (L, pr, at = 0) => {
    pluck(freqAt(L.loS, pr.hf), at, { gain: 0.34, dur: 1.3, damp: 0.994 });
    pluck(freqAt(L.hiS, pr.mf), at + 0.015, { gain: 0.34, dur: 1.3, damp: 0.994 });
  };
  /* the move: R/3 → 2/4 → 3/5 → back down (dominant blues lands on 5/♭7) */
  const move = prog.dom ? [0, 1, 2, 3] : [0, 1, 2, 1];
  const pass = () => {
    const ctx = audioCtx(); if (!ctx) return;
    const spb = 60 / bpm;
    const t0 = ctx.currentTime + 0.1;
    chart.forEach((L, i) => {
      for (let b = 0; b < 4; b++) {
        const at = (i * 4 + b) * spb;
        click(t0 + at, b === 0);
        playPair(L, L.pairs[move[b]], 0.1 + at);
        timers.current.push(setTimeout(() => { setCur(i); setHotPair(move[b]); }, (0.1 + at) * 1000));
      }

    const total = chart.length * 4 * spb * 1000 + 100;
    timers.current.push(setTimeout(() => { if (loopRef.current) pass(); else { setPlaying(false); setHotPair(-1); } }, total));
  };
  const play = () => { stop(); setPlaying(true); setTimeout(pass, 10); };

  const L = chart[Math.min(cur, chart.length - 1)];
  const dots = useMemo(() => L.pairs.flatMap((pr, i) => {

    };
    return [mk(L.hiS, pr.mf, mIv), mk(L.loS, pr.hf, hIv)];

  const numFrets = Math.min(15, Math.max(12, L.top + 1));

  return (

      <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 10 }}>
        Over every chord, the 6ths come from that chord's own scale: R/3, 2/4, 3/5 — plus 5/♭7 for dominant grit. The real skill is picking the string set that keeps your hand still through the changes. In E, the I sits low on the 2&amp;4 set and the IV and V hop up to the top set. Skip and mute the middle string; hybrid picking works best.
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {NOTES.map((n, i) => (
          <button key={n} className="chip" style={drillChip(keyPc === i)} onClick={() => setKeyPc(i)}>{n}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {SIXTH_PROGS.map((p) => (
          <button key={p.id} className="chip" style={drillChip(progId === p.id)} onClick={() => setProgId(p.id)}>{p.name}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 10 }}>
        <span style={{ fontSize: 11.5, color: T.faint }}>string sets</span>
        <button className="chip" style={drillChip(pin === null)} onClick={() => setPin(null)}>Auto (least movement)</button>
        {Object.keys(CROPPER_PAIR_SETS).map((sn) => (
          <button key={sn} className="chip" style={drillChip(pin === sn)} onClick={() => setPin(sn)}>Pin {sn}</button>
        ))}
      </div>

      {/* the map: one card per change, showing which set it lives on */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", marginBottom: 10 }}>
        {chart.map((c, i) => (
          <button key={i} className="ans" onClick={() => { setCur(i); setHotPair(-1); }}
            style={{
              padding: "8px 12px", borderRadius: 10, cursor: "pointer", textAlign: "center", minWidth: 92,
              background: cur === i ? "rgba(233,161,59,0.16)" : T.raised, color: T.cream,

            <div style={{ fontSize: 11, color: T.amber, fontWeight: 700 }}>strings {c.setName}</div>
            <div style={{ fontSize: 10.5, color: T.faint }}>frets {c.lo}–{c.hi}</div>
          </button>
        ))}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        <div>
          <span style={{ fontWeight: 800, fontSize: 16, fontFamily: "'Fraunces', Georgia, serif", color: T.amber }}>{L.name} {L.rn}</span>
          <span style={{ color: T.faint, fontSize: 13 }}> · strings {L.setName} · frets {L.lo}–{L.hi}</span>

          <button className="chip" style={loop ? { ...btnGhost, borderColor: T.amber, color: T.amber } : btnGhost} onClick={() => setLoop(!loop)}>⟳ Loop</button>
        </div>
      </div>

      <Fretboard frets={numFrets} maxFret={numFrets} dots={dots}

        onTap={(s, f) => pluck(freqAt(s, f), 0, { gain: 0.35 })} />

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", marginTop: 8 }}>
        {L.pairs.map((pr, i) => (
          <button key={i} className="ans" onClick={() => { setHotPair(i); playPair(L, pr); }}
            style={{
              padding: "10px 14px", borderRadius: 10, cursor: "pointer", textAlign: "center",

              border: `1.5px solid ${hotPair === i ? T.amber : move.includes(i) ? "rgba(233,161,59,0.45)" : T.line}`,
            }}>
            <div style={{ fontWeight: 800, fontSize: 14 }}>{pr.label}</div>
            <div style={{ fontSize: 12, color: T.muted }}>{NOTES[pr.mPc]} over {NOTES[pr.hPc]}</div>
            <div style={{ fontSize: 10.5, color: T.faint }}>frets {pr.mf} &amp; {pr.hf}{pr.dom ? " · dom" : ""}</div>
          </button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 12 }}>
        <button className="chip" style={drillChip(false)} onClick={() => setBpm(Math.max(50, bpm - 5))}>−</button>
        <span style={{ fontSize: 13.5, fontWeight: 800, minWidth: 64, textAlign: "center" }}>{bpm} bpm</span>
        <button className="chip" style={drillChip(false)} onClick={() => setBpm(Math.min(160, bpm + 5))}>+</button>
      </div>
    </div>
  );
}

/* ---------------- Progression Drill (voice-led chart: triads + dominants) ---------------- */
const DIATONIC_PROGS = [
  { id: "pop", name: "I – V – vi – IV", seq: ["I", "V", "vi", "IV"] },
  { id: "jazz", name: "ii – V – I", seq: ["ii", "V", "I"] },
  { id: "50s", name: "I – vi – IV – V", seq: ["I", "vi", "IV", "V"] },
  { id: "axis", name: "vi – IV – I – V", seq: ["vi", "IV", "I", "V"] },
  { id: "canon", name: "Canon", seq: ["I", "V", "vi", "iii", "IV", "I", "IV", "V"] },
  { id: "andalu", name: "i – VII – VI – V", seq: ["vi", "V", "IV", "V"] },
];
/* --- Sevenths: four-note drop-2 grips, the shapes on every jazz/blues chart --- */
const SEVENTH_SETS = { "1–4": [2, 3, 4, 5], "2–5": [1, 2, 3, 4], "3–6": [0, 1, 2, 3] };
const SEVENTH_TONES = { dom7: [0, 4, 7, 10], min7: [0, 3, 7, 10], maj7: [0, 4, 7, 11], m7b5: [0, 3, 6, 10], dim7: [0, 3, 6, 9] };
const QUAL_SUFFIX = { dom7: "7", min7: "m7", maj7: "maj7", m7b5: "m7♭5", dim7: "°7" };
const INV7_NAMES = ["Root pos", "1st inv", "2nd inv", "3rd inv"];
/* Close voicing a-b-c-d → drop the 2nd note from the top an octave: c-a-b-d.
   Strings are filled low→high with strictly ascending pitch, which is exactly
   what makes drop-2 grabbable with four fingers. */
function drop2Voicing(rootPc, quality, inv, setIdx) {
  const tones = SEVENTH_TONES[quality];
  const close = [0, 1, 2, 3].map((k) => (rootPc + tones[(inv + k) % 4]) % 12);
  const order = [close[2], close[0], close[1], close[3]];
  const frets = [-1, -1, -1, -1, -1, -1];
  let prevPitch = -99;
  for (let i = 0; i < 4; i++) {
    const s = setIdx[i];
    let f = ((order[i] - OPEN_PC[s]) % 12 + 12) % 12;
    while (OPEN_SEMIS[s] + f <= prevPitch) f += 12;
    frets[s] = f; prevPitch = OPEN_SEMIS[s] + f;
  }
  return frets;
}
/* Voice-leading-aware pick across the four inversions */
function bestSeventhNear(rootPc, quality, setIdx, prevMean) {
  let best = null;
  for (let rot = 0; rot < 4; rot++) {
    const base = drop2Voicing(rootPc, quality, rot, setIdx);
    for (const off of [0, 12]) {
      const act = setIdx.map((s) => base[s] + off);
      if (Math.min(...act) < 0 || Math.max(...act) > 15) continue;
      if (Math.max(...act) - Math.min(...act) > 5) continue; // has to fit the hand
      const fr = [-1, -1, -1, -1, -1, -1];
      setIdx.forEach((s, i) => (fr[s] = act[i]));
      /* drop-2 rotates the bass, so name the inversion from the note actually in
         the bass rather than from the rotation index */
      const bassIv = (OPEN_PC[setIdx[0]] + act[0] - rootPc + 1200) % 12;
      const inv = Math.max(0, SEVENTH_TONES[quality].indexOf(bassIv));
      const mean = act.reduce((a, b) => a + b, 0) / act.length;
      const score = prevMean == null ? Math.abs(mean - 5) : Math.abs(mean - prevMean) + 0.35 * Math.abs(mean - 5);
      if (!best || score < best.score) best = { frets: fr, inv, mean, score };
    }
  }
  return best;
}
const DOM_PROGS = [
  { id: "blues7", name: "I7 – IV7 – V7", hint: "Every chord a dominant — the blues sound",
    seq: [[0, "dom7", "I7"], [5, "dom7", "IV7"], [7, "dom7", "V7"]] },
  { id: "12bar", name: "12-Bar (quick change)", hint: "The whole form, voice-led in one hand position",
    seq: [[0, "dom7", "I7"], [5, "dom7", "IV7"], [0, "dom7", "I7"], [0, "dom7", "I7"], [5, "dom7", "IV7"], [5, "dom7", "IV7"], [0, "dom7", "I7"], [0, "dom7", "I7"], [7, "dom7", "V7"], [5, "dom7", "IV7"], [0, "dom7", "I7"], [7, "dom7", "V7"]] },
  { id: "251", name: "ii7 – V7 – Imaj7", hint: "The jazz cadence — the V7 is the engine",
    seq: [[2, "min7", "ii7"], [7, "dom7", "V7"], [0, "maj7", "Imaj7"]] },
  { id: "turn", name: "I – VI7 – ii7 – V7", hint: "Rhythm-changes turnaround — VI7 is a borrowed dominant",
    seq: [[0, "maj7", "Imaj7"], [9, "dom7", "VI7"], [2, "min7", "ii7"], [7, "dom7", "V7"]] },
  { id: "sec", name: "I – V7/V – V7 – I", hint: "Secondary dominant: II7 tonicises the V before it lands",
    seq: [[0, "maj7", "Imaj7"], [2, "dom7", "V7/V"], [7, "dom7", "V7"], [0, "maj7", "Imaj7"]] },
  { id: "cycle", name: "Backcycle III7–VI7–II7–V7–I", hint: "Dominants in a chain of fifths — every chord pulls to the next",
    seq: [[4, "dom7", "III7"], [9, "dom7", "VI7"], [2, "dom7", "II7"], [7, "dom7", "V7"], [0, "maj7", "Imaj7"]] },
  { id: "min251", name: "iiø – V7 – i7", hint: "The minor cadence — half-diminished into the dominant",
    seq: [[2, "m7b5", "iiø"], [7, "dom7", "V7"], [0, "min7", "i7"]] },
];

function ProgressionDrillChart() {
  const [family, setFamily] = useState("triads");
  const [keyPc, setKeyPc] = useState(0);
  const [setName, setSetName] = useState("1–3");
  const [setName7, setSetName7] = useState("1–4");
  const [progId, setProgId] = useState("pop");
  const [progId7, setProgId7] = useState("blues7");
  const [bpm, setBpm] = useState(90);
  const [loop, setLoop] = useState(false);
  const [live, setLive] = useState(-1);
  const loopRef = useRef(false); useEffect(() => { loopRef.current = loop; }, [loop]);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const seventh = family === "sevenths";
  const prog = seventh ? DOM_PROGS.find((p) => p.id === progId7) : DIATONIC_PROGS.find((p) => p.id === progId);

  const chart = useMemo(() => {
    let prevMean = null;
    if (seventh) {
      const setIdx = SEVENTH_SETS[setName7];
      return prog.seq.map(([off, q, rn]) => {
        const rpc = (keyPc + off) % 12;
        const best = bestSeventhNear(rpc, q, setIdx, prevMean) || bestSeventhNear(rpc, q, setIdx, null);
        if (best) prevMean = best.mean;
        return { rn, name: NOTES[rpc] + QUAL_SUFFIX[q], rootPc: rpc, ...(best || { frets: [-1, -1, -1, -1, -1, -1], inv: 0 }) };
      });
    }
    return prog.seq.map((rn) => {
      const [off, q] = ROMAN[rn];
      const rpc = (keyPc + off) % 12;
      const best = bestTriadNear(rpc, q, TRIAD_SETS[setName], [0, 12], prevMean);
      prevMean = best.mean;
      return { rn, name: NOTES[rpc] + (q === "min" ? "m" : ""), rootPc: rpc, ...best };
    });
  }, [prog, keyPc, setName, setName7, seventh]);

  const stop = () => { timers.current.forEach(clearTimeout); timers.current = []; setLive(-1); };
  useEffect(() => { stop(); }, [keyPc, setName, setName7, progId, progId7, bpm, family]);
  const pass = () => {
    const dur = 240 / bpm;
    chart.forEach((c, i) => {
      strum(c.frets, false, i * dur);
      strum(c.frets, false, i * dur + dur / 2);
      timers.current.push(setTimeout(() => setLive(i), i * dur * 1000));
    });
    timers.current.push(setTimeout(() => { if (loopRef.current) pass(); else setLive(-1); }, chart.length * dur * 1000));
  };
  const play = () => { stop(); pass(); };

  return (
    <div className="card" style={{ marginBottom: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 4 }}>
        <div style={{ fontWeight: 800, fontSize: 17, fontFamily: "'Fraunces', Georgia, serif" }}>Progression Drill</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button className="chip" style={drillChip(!seventh)} onClick={() => setFamily("triads")}>Triads</button>
          <button className="chip" style={drillChip(seventh)} onClick={() => setFamily("sevenths")}>Dominants &amp; 7ths</button>
        </div>
      </div>
      <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 10 }}>
        {seventh
          ? "Four-note drop-2 grips — the shapes on every blues and jazz chart. Each chord is voiced in whichever inversion sits closest to the last, so the whole progression stays under one hand. The ♭7 is the tension: watch it resolve down a half-step into the next chord's 3rd."
          : "Diatonic progressions voiced with the closest inversions — minimal hand movement, smooth voice leading. Loop it and comp along."}
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {(seventh ? DOM_PROGS : DIATONIC_PROGS).map((p) => (
          <button key={p.id} className="chip" style={drillChip(prog.id === p.id)}
            onClick={() => (seventh ? setProgId7(p.id) : setProgId(p.id))}>{p.name}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {NOTES.map((n, i) => (
          <button key={n} className="chip" style={drillChip(keyPc === i)} onClick={() => setKeyPc(i)}>{n}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {Object.keys(seventh ? SEVENTH_SETS : TRIAD_SETS).map((sn) => (
          <button key={sn} className="chip" style={drillChip((seventh ? setName7 : setName) === sn)}
            onClick={() => (seventh ? setSetName7(sn) : setSetName(sn))}>Strings {sn}</button>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
        <div>
          <span style={{ fontWeight: 800, fontSize: 16 }}>{prog.name} <span style={{ color: T.faint, fontWeight: 400, fontSize: 13 }}>in {NOTES[keyPc]} · strings {seventh ? setName7 : setName}</span></span>
          {prog.hint && <div style={{ fontSize: 12.5, color: T.muted }}>{prog.hint}</div>}
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="chip" style={btnAmber} onClick={play}>▶ Play</button>
          <button className="chip" style={loop ? { ...btnGhost, borderColor: T.amber, color: T.amber } : btnGhost} onClick={() => setLoop(!loop)}>⟳ Loop</button>
          <button className="chip" style={btnGhost} onClick={stop}>■ Stop</button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center" }}>
        {chart.map((c, i) => (
          <div key={i} onClick={() => strum(c.frets)}
            style={{ cursor: "pointer", textAlign: "center", background: T.raised, borderRadius: 10, padding: "4px 6px", border: `2px solid ${live === i ? T.amber : T.line}`, transition: "border-color .15s" }}>
            <div style={{ fontSize: 13, fontWeight: 800 }}>{c.name} <span style={{ color: T.faint, fontWeight: 400, fontSize: 10.5 }}>{c.rn}</span></div>
            <ChordDiagram frets={c.frets} size={86} label={c.name} rootPc={c.rootPc} />
            <div style={{ fontSize: 10.5, color: T.amber, paddingBottom: 3 }}>{(seventh ? INV7_NAMES : INV_NAMES)[c.inv]}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginTop: 12 }}>
        <button className="chip" style={drillChip(false)} onClick={() => setBpm(Math.max(50, bpm - 5))}>−</button>
        <span style={{ fontSize: 13.5, fontWeight: 800, minWidth: 64, textAlign: "center" }}>{bpm} bpm</span>
        <button className="chip" style={drillChip(false)} onClick={() => setBpm(Math.min(160, bpm + 5))}>+</button>
      </div>
    </div>
  );
}

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <div style={{ fontWeight: 800, fontSize: 16 }}>Warm-ups</div>
          <button className="chip" style={{ ...btnGhost, fontSize: 12, padding: "5px 10px" }} onClick={resetWarm}>↺ Reset for today</button>
        </div>
        {WARMUP_ITEMS.map((w) => (
          <CheckRow key={w.id} checked={!!cl.warm[w.id]} title={w.t} meta={w.m}
            onToggle={() => toggle("warm", w.id)}
            onDrill={w.drill ? () => goDrill(w.drill) : undefined} />
        ))}
      </div>
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
          <div style={{ fontWeight: 800, fontSize: 16 }}>Song list</div>
          <div style={{ fontSize: 13, color: songCount > 0 ? T.green : T.faint, fontWeight: 700 }}>{songCount}/{SONGS.length} learned</div>
        </div>
        {SONGS.map((s, i) => (
          <CheckRow key={i} checked={!!cl.songs["s" + i]} title={s.t} meta={s.m} onToggle={() => toggle("songs", "s" + i)} />
        ))}
      </div>
    </div>
  );
}

/* ---------------- Progress ---------------- */
function Progress({ save }) {
  const acc = save.totals.answers ? Math.round((100 * save.totals.correct) / save.totals.answers) : 0;
  const heat = save.posStats || {};
  const cell = (s, f) => {
    const d = heat[`${s}-${f}`];
    if (!d || !d[1]) return { bg: T.raised, op: 0.45 };
    const a = d[0] / d[1];
    const col = a >= 0.85 ? T.green : a >= 0.6 ? T.amber : T.red;
    return { bg: col, op: 0.35 + 0.65 * Math.min(1, d[1] / 6) };
  };
  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 10, marginBottom: 18 }}>
        {[["Answers", save.totals.answers], ["Accuracy", acc + "%"], ["Best streak", save.totals.bestStreak], ["Play-along reps", Object.values(save.practice || {}).reduce((a, b) => a + b, 0)], ["Songs learned", Object.keys((save.checklist || {}).songs || {}).length]].map(([k, v]) => (
          <div key={k} className="card" style={{ textAlign: "center", padding: "16px 8px" }}>
            <div style={{ fontSize: 26, fontWeight: 800, color: T.amber, fontFamily: "'Fraunces', Georgia, serif" }}>{v}</div>
            <div style={{ fontSize: 12.5, color: T.muted }}>{k}</div>
          </div>
        ))}
      </div>

      <div className="card" style={{ marginBottom: 18 }}>
        <div style={{ fontWeight: 700, marginBottom: 4 }}>Fretboard heatmap</div>
        <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 10 }}>Where you're strong (green) and where to drill (red). Fades in as you practice.</div>
        <div style={{ display: "grid", gridTemplateColumns: "26px repeat(13, 1fr)", gap: 3 }}>
          {[5, 4, 3, 2, 1, 0].map((s) => (
            <React.Fragment key={s}>
              <div style={{ fontSize: 11.5, color: T.muted, alignSelf: "center", fontWeight: 700 }}>{["E", "A", "D", "G", "B", "e"][s]}</div>
              {Array.from({ length: 13 }, (_, f) => {
                const c = cell(s, f);
                return <div key={f} title={`${noteAt(s, f)} — string ${STRING_NAMES[s]}, fret ${f}`} style={{ aspectRatio: "1", borderRadius: 4, background: c.bg, opacity: c.op }} />;
              })}
            </React.Fragment>
          ))}
          <div />
          {Array.from({ length: 13 }, (_, f) => (
            <div key={f} style={{ fontSize: 10, color: T.faint, textAlign: "center" }}>{f}</div>
          ))}
        </div>
      </div>

      <div className="card" style={{ marginBottom: 18 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Note levels</div>
        {NOTE_LEVELS.map((lv) => {
          const m = masteryOf(save.noteHist[lv.id]);
          const locked = lv.id > save.noteUnlocked;
          return (
            <div key={lv.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: `1px solid ${T.line}` }}>
              <div style={{ width: 20, textAlign: "center" }}>{save.noteDone[lv.id] ? "★" : locked ? "🔒" : "•"}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{lv.name} <span style={{ color: T.faint, fontWeight: 400, fontSize: 12 }}>{lv.desc}</span></div>
              </div>
              <div style={{ fontSize: 12.5, color: save.noteDone[lv.id] ? T.green : T.muted }}>{locked ? "" : `${m.correct}/${NEED}`}</div>
            </div>
          );
        })}
      </div>

      <div className="card" style={{ marginBottom: 18 }}>
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Ear training</div>
        {EAR_LEVELS.map((lv, i) => {
          const m = masteryOf((save.earHist || {})[lv.id]);
          const locked = i + 1 > (save.earUnlocked || 1);
          return (
            <div key={lv.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: `1px solid ${T.line}` }}>
              <div style={{ width: 20, textAlign: "center" }}>{(save.earDone || {})[lv.id] ? "★" : locked ? "🔒" : "•"}</div>
              <div style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>{lv.name} <span style={{ color: T.faint, fontWeight: 400, fontSize: 12 }}>{lv.desc}</span></div>
              <div style={{ fontSize: 12.5, color: (save.earDone || {})[lv.id] ? T.green : T.muted }}>{locked ? "" : `${m.correct}/${NEED}`}</div>
            </div>
          );
        })}
      </div>

      <div className="card">
        <div style={{ fontWeight: 700, marginBottom: 10 }}>Chord tiers</div>
        {CHORD_TIERS.map((t, i) => {
          const m = masteryOf(save.chordHist[t.id]);
          const locked = i + 1 > save.chordUnlocked;
          return (
            <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 0", borderBottom: `1px solid ${T.line}` }}>
              <div style={{ width: 20, textAlign: "center" }}>{save.chordDone[t.id] ? "★" : locked ? "🔒" : "•"}</div>
              <div style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>{t.name} <span style={{ color: T.faint, fontWeight: 400, fontSize: 12 }}>{t.desc}</span></div>
              <div style={{ fontSize: 12.5, color: save.chordDone[t.id] ? T.green : T.muted }}>{locked ? "" : `${m.correct}/${NEED}`}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- Button styles ---------------- */
const btnAmber = { padding: "8px 14px", borderRadius: 9, fontSize: 13.5, fontWeight: 700, border: "none", background: T.amber, color: "#2A1C0B", cursor: "pointer" };
const btnGhost = { padding: "8px 14px", borderRadius: 9, fontSize: 13.5, fontWeight: 700, border: `1.5px solid ${T.line}`, background: "transparent", color: T.cream, cursor: "pointer" };

/* ---------------- App shell ---------------- */
const DEFAULT_SAVE = {
  noteUnlocked: 1, chordUnlocked: 1, earUnlocked: 1,
  noteHist: {}, chordHist: {}, earHist: {},
  noteDone: {}, chordDone: {}, earDone: {},
  posStats: {},
  practice: {},
  checklist: { warm: {}, songs: {} },
  totals: { answers: 0, correct: 0, bestStreak: 0 },
};
const SAVE_KEY = "fretwork:save:v1";

function App() {
  const [tab, setTab] = useState("notes");
  const [chordView, setChordView] = useState("trainer");
  const [save, setSave] = useState(DEFAULT_SAVE);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);
  const streakRef = useRef(0);
  const saveTimer = useRef(null);

  useEffect(() => {
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Outfit:wght@400;600;700;800&display=swap";
    document.head.appendChild(link);
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const v = await Store.get(SAVE_KEY);
        if (v) {
          const parsed = { ...DEFAULT_SAVE, ...JSON.parse(v) };
          if (parsed.chordDone && parsed.chordDone.c5) parsed.chordUnlocked = Math.max(parsed.chordUnlocked, 6);
          setSave(parsed);
        }
      } catch (e) { /* fresh start */ }
      setLoaded(true);
    })();
  }, []);

  const persist = (next) => {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try { await Store.set(SAVE_KEY, JSON.stringify(next)); } catch (e) { /* offline is fine */ }
    }, 500);
  };

  const record = useCallback((kind, id, ok, s, f, onDone) => {
    setSave((prev) => {
      const next = JSON.parse(JSON.stringify(prev));
      const histKey = kind === "note" ? "noteHist" : kind === "ear" ? "earHist" : "chordHist";
      const doneKey = kind === "note" ? "noteDone" : kind === "ear" ? "earDone" : "chordDone";
      const unlockKey = kind === "note" ? "noteUnlocked" : kind === "ear" ? "earUnlocked" : "chordUnlocked";
      const h = next[histKey][id] || [];
      h.push(ok ? 1 : 0);
      next[histKey][id] = h.slice(-40);
      if (kind === "note" && s != null) {
        const k = `${s}-${f}`;
        const d = next.posStats[k] || [0, 0];
        next.posStats[k] = [d[0] + (ok ? 1 : 0), d[1] + 1];
      }
      next.totals.answers += 1;
      next.totals.correct += ok ? 1 : 0;
      streakRef.current = ok ? streakRef.current + 1 : 0;
      next.totals.bestStreak = Math.max(next.totals.bestStreak, streakRef.current);
      const m = masteryOf(next[histKey][id]);
      if (m.done && !next[doneKey][id]) {
        next[doneKey][id] = true;
        const list = kind === "note" ? NOTE_LEVELS : kind === "ear" ? EAR_LEVELS : CHORD_TIERS;
        const idx = list.findIndex((x) => x.id === id);
        if (idx >= 0 && idx + 2 > next[unlockKey] && idx + 1 < list.length) {
          next[unlockKey] = idx + 2;
          if (onDone) onDone(list[idx + 1].name);
        } else if (onDone) onDone(null);
      }
      persist(next);
      return next;
    });
  }, []);

  const onLevelDone = (nextName) => {
    setToast(nextName ? `Level complete! “${nextName}” unlocked 🎸` : "Level complete! ★");
    setTimeout(() => setToast(null), 3200);
  };

  const bumpPractice = (k) => {
    setSave((prev) => {
      const next = { ...prev, practice: { ...(prev.practice || {}), [k]: ((prev.practice || {})[k] || 0) + 1 } };
      persist(next);
      return next;
    });
  };

  const toggleCheck = (section, id) => {
    setSave((prev) => {
      const cl = prev.checklist || { warm: {}, songs: {} };
      const sec = { ...(cl[section] || {}) };
      if (sec[id]) delete sec[id]; else sec[id] = true;
      const next = { ...prev, checklist: { ...cl, [section]: sec } };
      persist(next);
      return next;
    });
  };
  const resetWarm = () => {
    setSave((prev) => {
      const next = { ...prev, checklist: { ...(prev.checklist || { songs: {} }), warm: {} } };
      persist(next);
      return next;
    });
  };

  const tabs = [
    ["notes", "Notes"], ["chords", "Chords"], ["ear", "Ear"], ["practice", "Practice"], ["library", "Library"], ["progress", "Progress"],
  ];

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.cream, fontFamily: "'Outfit', system-ui, sans-serif" }}>
      <style>{`
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button { font-family: inherit; }
        .card { background: ${T.surface}; border: 1px solid ${T.line}; border-radius: 16px; padding: 18px; }
        .ans { cursor: pointer; transition: transform .08s ease, background .15s ease; }
        .ans:active { transform: scale(0.96); }
        .ans:hover { background: #43342700; filter: brightness(1.15); }
        .chip { cursor: pointer; transition: filter .15s ease; }
        .chip:hover:not(:disabled) { filter: brightness(1.15); }
        .libcard { transition: transform .1s ease, border-color .15s ease; }
        .libcard:hover { transform: translateY(-2px); border-color: ${T.amber} !important; }
        .pop { animation: pop .25s ease; }
        @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideup { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        button:focus-visible { outline: 2px solid ${T.amber}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
        @media (orientation: landscape) and (max-height: 520px) {
          .app-header, .app-rule { display: none !important; }
          .app-wrap { padding-top: 8px !important; }
        }
      `}</style>

      <div className="app-wrap" style={{ maxWidth: 940, margin: "0 auto", padding: "18px 14px 60px" }}>
        <header className="app-header" style={{ display: "flex", alignItems: "baseline", gap: 12, marginBottom: 4 }}>
          <h1 style={{ fontFamily: "'Fraunces', Georgia, serif", fontWeight: 800, fontSize: 34, margin: 0, letterSpacing: "-0.5px" }}>
            Fret<span style={{ color: T.amber }}>work</span>
          </h1>
          <span style={{ fontSize: 12.5, color: T.faint, letterSpacing: "0.12em", textTransform: "uppercase" }}>note & chord trainer</span>
        </header>
        <div className="app-rule" style={{ height: 3, borderRadius: 2, background: `linear-gradient(90deg, ${T.amber}, transparent 70%)`, marginBottom: 16 }} />

        <nav style={{ display: "flex", gap: 4, marginBottom: 18, background: T.surface, border: `1px solid ${T.line}`, borderRadius: 12, padding: 5, overflowX: "auto" }}>
          {tabs.map(([id, label]) => (
            <button key={id} className="chip" onClick={() => setTab(id)}
              style={{
                flexShrink: 0, padding: "10px 13px", borderRadius: 8, border: "none", fontSize: 12.5, fontWeight: 700,
                background: tab === id ? T.amber : "transparent", color: tab === id ? "#2A1C0B" : T.muted,
              }}>
              {label}
            </button>
          ))}
        </nav>

        {!loaded ? (
          <div style={{ color: T.muted, padding: 40, textAlign: "center" }}>Tuning up…</div>
        ) : tab === "notes" ? (
          <NoteTrainer save={save} record={record} onLevelDone={onLevelDone} />
        ) : tab === "chords" ? (
          <>
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              {[["trainer", "Trainer"], ["play", "Play-along"]].map(([m, label]) => (
                <button key={m} className="chip" onClick={() => setChordView(m)}
                  style={{
                    padding: "8px 16px", borderRadius: 999, fontSize: 13.5, fontWeight: 700, cursor: "pointer",
                    border: `1.5px solid ${chordView === m ? T.amber : T.line}`,
                    background: chordView === m ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream,
                  }}>
                  {label}
                </button>
              ))}
            </div>
            {chordView === "trainer" ? (
              <ChordTrainer save={save} record={record} onLevelDone={onLevelDone} />
            ) : (
              <PlayAlong save={save} bump={bumpPractice} />
            )}
          </>
        ) : tab === "ear" ? (
          <EarTrainer save={save} record={record} onLevelDone={onLevelDone} />
        ) : tab === "practice" ? (
          <PracticeTab save={save} toggle={toggleCheck} resetWarm={resetWarm} />
        ) : tab === "library" ? (
          <ChordLibrary />
        ) : (
          <Progress save={save} />
        )}
      </div>

      {toast && (
        <div style={{
          position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)",
          background: T.amber, color: "#2A1C0B", fontWeight: 800, fontSize: 14.5,
          padding: "12px 20px", borderRadius: 12, boxShadow: "0 6px 24px rgba(0,0,0,.45)",
          animation: "slideup .3s ease", zIndex: 50, whiteSpace: "nowrap",
        }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
