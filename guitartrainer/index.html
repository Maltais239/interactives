/* Storage adapter */
const MEM = {};
const Store = {
  async get(key) {
    try { if (window.storage && window.storage.get) { const r = await window.storage.get(key); return r ? r.value : null; } } catch (e) {}
    try { const v = localStorage.getItem(key); if (v != null) return v; } catch (e) {}
    return MEM[key] ?? null;
  },
  async set(key, value) {
    try { if (window.storage && window.storage.set) { await window.storage.set(key, value); return; } } catch (e) {}
    try { localStorage.setItem(key, value); return; } catch (e) {}
    MEM[key] = value;
  },
};

/* Fret windows for each CAGED scale position, offset from the root's low-E fret */
const SHAPE_WINDOWS = { E: [-1, 2], D: [1, 5], C: [4, 7], A: [6, 9], G: [8, 12] };
/* Semitone offsets of open strings above low E */
const OPEN_SEMIS = [0, 5, 10, 15, 19, 24];
/* Build a position window guaranteed to contain a complete, gap-free scale box:
   start from the shape anchor, expand minimally until every string holds >=2 scale
   tones and no scale degree is skipped between the box's lowest and highest pitch. */
function positionWindow(rootPc, ivs, shape, minPer = 2) {
  const f6 = (rootPc - OPEN_PC[0] + 12) % 12;
  const [so, eo] = SHAPE_WINDOWS[shape];
  let a = (f6 + so + 12) % 12;
  const span = eo - so;
  if (a + span > 15) a -= 12;
  if (a < 0) a = 0;
  let b = a + span;
  const inScale = (s, f) => ivs.includes((OPEN_PC[s] + f - rootPc + 1200) % 12);
  const complete = (lo, hi) => {
    const pitches = [];
    for (let s = 0; s < 6; s++) {
      let cnt = 0;
      for (let f = Math.max(0, lo); f <= hi; f++) if (inScale(s, f)) { cnt++; pitches.push(OPEN_SEMIS[s] + f); }
      if (cnt < minPer) return false;
    }
    const uniq = [...new Set(pitches)].sort((x, y) => x - y);
    for (let i = 0; i + 1 < uniq.length; i++)
      for (let p = uniq[i] + 1; p < uniq[i + 1]; p++)
        if (ivs.includes((((4 + p) % 12) - rootPc + 12) % 12)) return false;
    return true;
  };
  const cands = [];
  for (let da = 0; da <= 2; da++) for (let db = 0; db <= 3; db++) cands.push([da, db]);
  cands.sort((x, y) => x[0] + x[1] - (y[0] + y[1]) || x[0] - y[0]);
  for (const [da, db] of cands) {
    const lo = Math.max(0, a - da), hi = Math.min(16, b + db);
    if (complete(lo, hi)) { a = lo; b = hi; break; }
  }
  const colHas = (f) => f >= 0 && [0, 1, 2, 3, 4, 5].some((s) => inScale(s, f));
  while (a < b && !colHas(a)) a++;
  while (b > a && !colHas(b)) b--;
  return [a, Math.min(16, b)];
}

/* ---------------- Audio engine (Karplus-Strong pluck) ---------------- */
let ACTX = null;
let MASTER = null;
function audioCtx() {
  if (!ACTX) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ACTX = new AC();
    const comp = ACTX.createDynamicsCompressor();
    const lp = ACTX.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 5200;
    const g = ACTX.createGain(); g.gain.value = 0.9;
    g.connect(lp); lp.connect(comp); comp.connect(ACTX.destination);
    MASTER = g;
  }
  if (ACTX.state === "suspended") ACTX.resume();
  return ACTX;
}
function pluck(freq, delaySec = 0, { gain = 0.42, dur = 2.4, damp = 0.996 } = {}) {
  const ctx = audioCtx();
  if (!ctx) return;
  const sr = ctx.sampleRate;
  const N = Math.max(2, Math.round(sr / freq));
  const len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr);
  const out = buf.getChannelData(0);
  const line = new Float32Array(N);
  // Softened noise burst (pre-averaged for a warmer pick attack)
  let prev = 0;
  for (let i = 0; i < N; i++) {
    const n = Math.random() * 2 - 1;
    line[i] = (n + prev) * 0.5;
    prev = n;
  }
  let idx = 0;
  for (let i = 0; i < len; i++) {
    const next = (idx + 1) % N;
    line[idx] = damp * 0.5 * (line[idx] + line[next]);
    out[i] = line[idx];
    idx = next;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const g = ctx.createGain();
  g.gain.value = gain;
  src.connect(g); g.connect(MASTER);
  src.start(ctx.currentTime + delaySec);
}
function playPosition(s, f) { pluck(freqAt(s, f)); }
function strum(frets, arpeggio = false, at = 0) {
  const gap = arpeggio ? 0.24 : 0.045;
  let i = 0;
  for (let s = 0; s < 6; s++) {
    if (frets[s] >= 0) { pluck(freqAt(s, frets[s]), at + i * gap, { gain: 0.34, dur: arpeggio ? 2.6 : 2.2 }); i++; }
  }
}
function thud() { pluck(87, 0, { gain: 0.2, dur: 0.35, damp: 0.9 }); }
function click(at, accent) {
  const ctx = audioCtx();
  if (!ctx) return;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.frequency.value = accent ? 1568 : 1046;
  g.gain.setValueAtTime(accent ? 0.5 : 0.32, at);
  g.gain.exponentialRampToValueAtTime(0.001, at + 0.05);
  o.connect(g); g.connect(MASTER);
  o.start(at); o.stop(at + 0.06);
}

const shuffle = (a) => { const x = [...a]; for (let i = x.length - 1; i > 0; i--) { const j = rand(i + 1); [x[i], x[j]] = [x[j], x[i]]; } return x; };

/* ---------------- Fretboard (horizontal, the signature element) ---------------- */
function Fretboard({ maxFret = 12, frets = 12, marker, tapped, onTap, disabled, dots, activePair = [] }) {
  const FRETS = frets;
  const W = 980, H = 258;
  const nutX = 64, endX = W - 12;
  const fw = (endX - nutX) / FRETS;
  const yOf = (s) => 226 - s * 39; // s=0 low E bottom
  const fretCenter = (f) => (f === 0 ? nutX - 30 : nutX + (f - 0.5) * fw);
  const inlays = [3, 5, 7, 9, 15, 17, 19].filter((f) => f <= FRETS);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block", touchAction: "manipulation" }} role="img" aria-label="Guitar fretboard">
      <defs>
        <linearGradient id="woodg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor="#54402C" />
          <stop offset="0.5" stopColor={T.wood} />
          <stop offset="1" stopColor={T.woodDark} />
        </linearGradient>
        <linearGradient id="wireg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor="#A88F60" />
          <stop offset="0.5" stopColor="#E3CFA0" />
          <stop offset="1" stopColor="#A88F60" />
        </linearGradient>
      </defs>
      {/* board */}
      <rect x={nutX} y={8} width={endX - nutX} height={H - 16} rx={6} fill="url(#woodg)" />
      {/* faded region beyond level range */}
      {maxFret < FRETS && (
        <rect x={nutX + maxFret * fw} y={8} width={(FRETS - maxFret) * fw} height={H - 16} fill="#1B130D" opacity="0.72" rx={6} />
      )}
      {/* inlays */}
      {inlays.map((f) => (
        <circle key={f} cx={nutX + (f - 0.5) * fw} cy={H / 2} r={9} fill={T.inlay} opacity={f <= maxFret ? 0.85 : 0.25} />
      ))}
      <circle cx={nutX + 11.5 * fw} cy={H / 2 - 40} r={9} fill={T.inlay} opacity={maxFret >= 12 ? 0.85 : 0.25} />
      <circle cx={nutX + 11.5 * fw} cy={H / 2 + 40} r={9} fill={T.inlay} opacity={maxFret >= 12 ? 0.85 : 0.25} />
      {/* nut */}
      <rect x={nutX - 7} y={8} width={9} height={H - 16} rx={3} fill={T.inlay} />
      {/* fret wires */}
      {Array.from({ length: FRETS }, (_, i) => i + 1).map((f) => (
        <rect key={f} x={nutX + f * fw - 2} y={10} width={4} height={H - 20} rx={2} fill="url(#wireg)" opacity={f <= maxFret ? 1 : 0.35} />
      ))}
      {/* strings (thicker = lower) */}
      {[0, 1, 2, 3, 4, 5].map((s) => (
        <line key={s} x1={nutX - 7} x2={endX} y1={yOf(s)} y2={yOf(s)} stroke="#C7B594" strokeWidth={4.4 - s * 0.62} opacity="0.9" />
      ))}
      {/* string labels */}
      {[0, 1, 2, 3, 4, 5].map((s) => (
        <text key={s} x={14} y={yOf(s) + 5} fill={T.muted} fontSize="15" fontFamily="inherit" fontWeight="600">
          {["E", "A", "D", "G", "B", "e"][s]}
        </text>
      ))}
      {/* fret numbers */}
      {[3, 5, 7, 9, 12, 15, 17, 19].filter((f) => f <= FRETS).map((f) => (
        <text key={f} x={nutX + (f - 0.5) * fw} y={H - 0} fill={T.faint} fontSize="13" textAnchor="middle" fontFamily="inherit">{f}</text>
      ))}
      {/* scale / interval dots */}
      {dots &&
        dots.map((d, i) => (
          <g key={"sd" + i} opacity={d.dim ? 0.28 : 1}>
            <circle cx={fretCenter(d.f)} cy={yOf(d.s)} r={13.5} fill={d.color} stroke="rgba(0,0,0,0.4)" strokeWidth="1.5" />
            <text x={fretCenter(d.f)} y={yOf(d.s) + 4.5} textAnchor="middle" fontSize="12" fontWeight="800" fill={d.text} fontFamily="inherit">{d.label}</text>
          </g>
        ))}
      {/* current broken-interval pair: both notes stay highlighted for two beats */}
      {activePair.length > 0 && (
        <g pointerEvents="none">
          {activePair.map((d, i) => (
            <g key={"pair" + i}>
              <circle cx={fretCenter(d.f)} cy={yOf(d.s)} r={21} fill="rgba(233,161,59,0.18)" stroke={T.cream} strokeWidth="3" />
              <circle cx={fretCenter(d.f)} cy={yOf(d.s)} r={17} fill="none" stroke={T.amber} strokeWidth="3">
                <animate attributeName="r" values="16;19;16" dur="0.6s" repeatCount="indefinite" />
                <animate attributeName="opacity" values="1;0.65;1" dur="0.6s" repeatCount="indefinite" />
              </circle>
            </g>
          ))}
        </g>
      )}
      {/* question marker */}
      {marker && (
        <g>
          <circle cx={fretCenter(marker.f)} cy={yOf(marker.s)} r={16} fill={T.amber} stroke="#FFDFA8" strokeWidth="2">
            <animate attributeName="r" values="14;16;14" dur="1.6s" repeatCount="indefinite" />
          </circle>
          {marker.label && (
            <text x={fretCenter(marker.f)} y={yOf(marker.s) + 5.5} textAnchor="middle" fontSize="15" fontWeight="800" fill="#2A1C0B" fontFamily="inherit">{marker.label}</text>
          )}
        </g>
      )}
      {/* tapped feedback */}
      {tapped && (
        <g>
          <circle cx={fretCenter(tapped.f)} cy={yOf(tapped.s)} r={16} fill={tapped.ok ? T.green : T.red} stroke={T.cream} strokeWidth="2" />
          <text x={fretCenter(tapped.f)} y={yOf(tapped.s) + 5.5} textAnchor="middle" fontSize="14" fontWeight="800" fill="#221A12" fontFamily="inherit">{noteAt(tapped.s, tapped.f)}</text>
        </g>
      )}
      {/* tap targets */}
      {onTap && !disabled &&
        [0, 1, 2, 3, 4, 5].map((s) =>
          Array.from({ length: maxFret + 1 }, (_, f) => (
            <rect
              key={`${s}-${f}`}
              x={f === 0 ? 0 : nutX + (f - 1) * fw}
              y={yOf(s) - 19}
              width={f === 0 ? nutX - 5 : fw}
              height={38}
              fill="transparent"
              style={{ cursor: "pointer" }}
              onClick={() => onTap(s, f)}
            />
          ))
        )}
    </svg>
  );
}

/* ---------------- Chord diagram (vertical, classic chart) ---------------- */
function ChordDiagram({ frets, size = 150, label, rootPc = null }) {
  const ivInfo = (s, f) => {
    if (rootPc == null) return { label: "", color: T.amber, text: "#2A1C0B" };
    const iv = (OPEN_PC[s] + f - rootPc + 1200) % 12;
    return IV_COLORS[iv] || { label: DEGREE_LABEL[iv], color: T.faint, text: T.cream };
  };
  const fretted = frets.filter((f) => f > 0);
  const maxF = Math.max(0, ...fretted);
  const minF = fretted.length ? Math.min(...fretted) : 1;
  const base = maxF > 4 ? minF : 1;
  const W = 150, H = 186;
  const left = 26, right = 134, top = 40, bottom = 172;
  const sx = (s) => left + (s * (right - left)) / 5;
  const rowH = (bottom - top) / 5;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: size, display: "block" }} role="img" aria-label={label || "chord diagram"}>
      {/* nut or base fret */}
      {base === 1 ? (
        <rect x={left - 2} y={top - 5} width={right - left + 4} height={6} rx={2} fill={T.cream} />
      ) : (
        <text x={left - 3} y={top + rowH * 0.66} fontSize="11" fill={T.muted} textAnchor="end" fontFamily="inherit">{base}fr</text>
      )}
      {/* grid */}
      {Array.from({ length: 6 }, (_, i) => (
        <line key={"v" + i} x1={sx(i)} x2={sx(i)} y1={top} y2={bottom} stroke={T.muted} strokeWidth={i === 0 ? 2 : 1.4} opacity="0.75" />
      ))}
      {Array.from({ length: 6 }, (_, i) => (
        <line key={"h" + i} x1={left} x2={right} y1={top + i * rowH} y2={top + i * rowH} stroke={T.muted} strokeWidth="1.2" opacity="0.55" />
      ))}
      {/* markers above nut (open strings carry their interval color) */}
      {frets.map((f, s) => {
        if (f < 0)
          return <text key={"x" + s} x={sx(s)} y={top - 13} fontSize="14" fill={T.faint} textAnchor="middle" fontWeight="700" fontFamily="inherit">×</text>;
        if (f !== 0) return null;
        const info = ivInfo(s, 0);
        return (
          <g key={"o" + s}>
            <circle cx={sx(s)} cy={top - 18} r={7.5} fill={info.color} stroke="rgba(0,0,0,0.4)" strokeWidth="1.2" />
            <text x={sx(s)} y={top - 15} fontSize="8" fontWeight="800" fill={info.text} textAnchor="middle" fontFamily="inherit">{info.label}</text>
          </g>
        );
      })}
      {/* fretted dots */}
      {frets.map((f, s) => {
        if (f <= 0) return null;
        const info = ivInfo(s, f);
        const cy = top + (f - base + 0.5) * rowH;
        return (
          <g key={"d" + s}>
            <circle cx={sx(s)} cy={cy} r={9.5} fill={info.color} stroke="rgba(0,0,0,0.4)" strokeWidth="1.2" />
            <text x={sx(s)} y={cy + 3.2} fontSize="9" fontWeight="800" fill={info.text} textAnchor="middle" fontFamily="inherit">{info.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

}

/* ---------------- Note Trainer ---------------- */
function NoteTrainer({ save, record, onLevelDone }) {
  const [levelId, setLevelId] = useState(Math.min(save.noteUnlocked, 6));
  const [mode, setMode] = useState("name"); // name | find
  const level = NOTE_LEVELS.find((l) => l.id === levelId);
  const [q, setQ] = useState(null);
  const [result, setResult] = useState(null);
  const [streak, setStreak] = useState(0);
  const [focus, setFocus] = useState(false);
  const [naturalsOnly, setNaturalsOnly] = useState(level.naturals);
  const timer = useRef(null);
  const useNaturals = naturalsOnly;

  const newQuestion = useCallback(() => {
    setResult(null);
    let s, f;
    let guard = 0;
    do {
      s = rand(6);
      f = rand(level.maxFret + 1);
      guard++;
    } while (((useNaturals && !NATURALS.includes(noteAt(s, f))) || (q && q.s === s && q.f === f)) && guard < 60);
    setQ({ s, f, note: noteAt(s, f) });
  }, [level, q, useNaturals]);

  useEffect(() => { setNaturalsOnly(level.naturals); }, [levelId]);
  useEffect(() => { setQ(null); setResult(null); setStreak(0); }, [levelId, mode, naturalsOnly]);
  useEffect(() => { if (!q) newQuestion(); }, [q, newQuestion]);
  useEffect(() => () => clearTimeout(timer.current), []);

  const finish = (ok, s, f) => {
    setResult(ok ? "right" : "wrong");
    setStreak(ok ? streak + 1 : 0);
    record("note", levelId, ok, s, f, onLevelDone);
    if (ok) playPosition(q.s, q.f); else { thud(); setTimeout(() => playPosition(q.s, q.f), 380); }
    timer.current = setTimeout(newQuestion, ok ? 950 : 1900);
  };

  const answerName = (n) => { if (result || !q) return; finish(n === q.note, q.s, q.f); };
  const answerTap = (s, f) => {
    if (result || !q) return;
    pluck(freqAt(s, f), 0, { gain: 0.3 });
    const ok = s === q.s && noteAt(s, f) === q.note;
    setTap({ s, f, ok });
    finish(ok, q.s, q.f);
  };
  const [tap, setTap] = useState(null);
  useEffect(() => { if (!result) setTap(null); }, [result]);

  const choices = useNaturals ? NATURALS : NOTES;
  const hist = save.noteHist[levelId] || [];

  return (
    <div>
      {!focus && <LevelChips items={NOTE_LEVELS} current={levelId} unlocked={save.noteUnlocked} doneMap={save.noteDone} onPick={setLevelId} />}
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        {[["name", "Name the note"], ["find", "Find the note"]].map(([m, label]) => (
          <button key={m} className="chip" onClick={() => setMode(m)}
            style={{ padding: "7px 12px", borderRadius: 8, fontSize: 13, fontWeight: 600, border: `1.5px solid ${mode === m ? T.amber : T.line}`, background: mode === m ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream }}>
            {label}
          </button>
        ))}
        <button className="chip" onClick={() => setNaturalsOnly(!naturalsOnly)}
          style={{ padding: "7px 12px", borderRadius: 8, fontSize: 13, fontWeight: 600, border: `1.5px solid ${naturalsOnly ? T.amber : T.line}`, background: naturalsOnly ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream }}>
          {naturalsOnly ? "♮ Naturals" : "♯ All 12"}
        </button>
        <button className="chip" onClick={() => setFocus(!focus)}
          style={{ padding: "7px 12px", borderRadius: 8, fontSize: 13, fontWeight: 600, border: `1.5px solid ${focus ? T.amber : T.line}`, background: focus ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream }}>
          {focus ? "⛶ Exit" : "⛶ Focus"}
        </button>
        <div style={{ marginLeft: "auto", alignSelf: "center", fontSize: 13, color: streak >= 3 ? T.amber : T.muted, fontWeight: 700 }}>
          {streak > 0 ? `🔥 ${streak} streak` : ""}
        </div>
      </div>

      <div className="card">
        {q && mode === "name" && (
          <>
            <div style={{ fontSize: 15, color: T.muted, marginBottom: 8 }}>
              What note is marked on the <b style={{ color: T.cream }}>{STRING_NAMES[q.s]}</b> string?
            </div>
            <Fretboard maxFret={level.maxFret} marker={{ s: q.s, f: q.f, label: result ? q.note : "?" }} />
            <Feedback result={result} correctText={q.note} />
            <div style={{ display: "grid", gridTemplateColumns: `repeat(${useNaturals ? 7 : 6}, 1fr)`, gap: 8, marginTop: 6 }}>
              {choices.map((n) => (
                <button key={n} className="ans" onClick={() => answerName(n)}
                  style={{
                    padding: "13px 0", borderRadius: 10, fontSize: 16, fontWeight: 800,
                    border: `1.5px solid ${result && n === q.note ? T.green : T.line}`,
                    background: result && n === q.note ? "rgba(139,184,113,0.18)" : T.raised, color: T.cream,
                  }}>
                  {n}
                </button>
              ))}
            </div>
          </>
        )}
        {q && mode === "find" && (
          <>
            <div style={{ fontSize: 15, color: T.muted, marginBottom: 8 }}>

              marker={result && !tap?.ok ? { s: q.s, f: q.f, label: q.note } : null} />
            <Feedback result={result} correctText={`fret ${q.f}`} />
          </>
        )}
        {!focus && <MasteryBar hist={hist} />}
      </div>
      {!focus && (
      <p style={{ fontSize: 12.5, color: T.faint, marginTop: 10 }}>
        Get {NEED} of your last {WINDOW} right to complete the level and unlock the next fret range. Correct answers play the note — listen as you learn.
      </p>
      )}
    </div>
  );
}

/* ---- Play-along: common progressions, auto-voiced in one position ---- */
const ROMAN = { I: [0, "maj"], ii: [2, "min"], iii: [4, "min"], IV: [5, "maj"], V: [7, "maj"], vi: [9, "min"] };
const TRIAD_SETS = { "1–3": [3, 4, 5], "2–4": [2, 3, 4], "3–5": [1, 2, 3] };
const INV_NAMES = ["Root pos", "1st inv", "2nd inv"];
const OPEN_CHORDS = Object.fromEntries(CHORD_TIERS[0].chords.map((c) => [c.name, c.frets]));
/* Low-fret barre grips for Open-position play-along when no open shape exists */
const LOW_BARRES = {

  "F#": [2, 4, 4, 3, 2, 2],

  "G#m": [4, 6, 6, 4, 4, 4],
  "C#": [-1, 4, 6, 6, 6, 4],
  "Cm": [-1, 3, 5, 5, 4, 3],
};
const PLAY_PROGRESSIONS = [
  { id: "pop", name: "I – V – vi – IV", hint: "The pop anthem", seq: ["I", "V", "vi", "IV"] },
  { id: "rock", name: "I – IV – V", hint: "Rock, folk & blues backbone", seq: ["I", "IV", "V"] },
  { id: "jazz", name: "ii – V – I", hint: "The jazz cadence", seq: ["ii", "V", "I"] },

  { id: "axis", name: "vi – IV – I – V", hint: "The minor-start pop loop", seq: ["vi", "IV", "I", "V"] },
  { id: "canon", name: "Canon", hint: "I–V–vi–iii–IV–I–IV–V", seq: ["I", "V", "vi", "iii", "IV", "I", "IV", "V"] },
  { id: "blues", name: "12-Bar Blues", hint: "I×4 / IV×2 I×2 / V IV I V", seq: ["I", "I", "I", "I", "IV", "IV", "I", "I", "V", "IV", "I", "V"] },
];
/* Build a close-voiced triad for any root/quality/inversion on a string set */
function triadVoicing(rootPc, quality, inv, setIdx) {
  const tones = quality === "dim" ? [0, 3, 6] : quality === "min" ? [0, 3, 7] : [0, 4, 7];
  const order = [inv, inv + 1, inv + 2].map((k) => (rootPc + tones[k % 3]) % 12);
  const frets = [-1, -1, -1, -1, -1, -1];
  let f0 = null;
  setIdx.forEach((s, i) => {
    let f = (order[i] - OPEN_PC[s] + 12) % 12;
    if (f0 == null) f0 = f;
    else { while (f < f0 - 6) f += 12; while (f > f0 + 6) f -= 12; }
    frets[s] = f;
  });
  if (Math.min(...setIdx.map((s) => frets[s])) < 0) setIdx.forEach((s) => (frets[s] += 12));
  return frets;
}
/* Diatonic triads of a major key: I ii iii IV V vi vii° */
const DIATONIC = [
  { deg: "I", off: 0, q: "maj" }, { deg: "ii", off: 2, q: "min" }, { deg: "iii", off: 4, q: "min" },
  { deg: "IV", off: 5, q: "maj" }, { deg: "V", off: 7, q: "maj" }, { deg: "vi", off: 9, q: "min" },
  { deg: "vii°", off: 11, q: "dim" },
];
const qLabel = (q) => (q === "dim" ? "°" : q === "min" ? "m" : "");
/* Build a diatonic triad row in one inversion on a string set, kept in a low playable window */
function diatonicRow(keyPc, inv, setIdx) {
  return DIATONIC.map((d) => {
    const rpc = (keyPc + d.off) % 12;
    let frets = triadVoicing(rpc, d.q, inv, setIdx);
    // keep the row low: if it climbs past fret 14, drop an octave when possible
    const lo = Math.min(...setIdx.map((s) => frets[s]));
    if (lo >= 12) { const dn = setIdx.map((s) => frets[s] - 12); if (Math.min(...dn) >= 0) setIdx.forEach((s, i) => (frets[s] = dn[i])); }
    return { name: NOTES[rpc] + qLabel(d.q), deg: d.deg, frets, q: d.q };
  });
}
/* Pick the inversion (and octave) whose grip sits closest to the target fret window */
function bestTriad(rootPc, quality, setIdx, win) {
  const center = (win[0] + win[1]) / 2;
  let best = null;
  for (let inv = 0; inv < 3; inv++) {
    const base = triadVoicing(rootPc, quality, inv, setIdx);
    for (const off of [-12, 0, 12]) {
      const act = setIdx.map((s) => base[s] + off);
      if (Math.min(...act) < 0 || Math.max(...act) > 15) continue; // every string must stay on the neck
      const fr = [-1, -1, -1, -1, -1, -1];
      setIdx.forEach((s, i) => (fr[s] = act[i]));
      const mean = act.reduce((a, b) => a + b, 0) / act.length;
      const score = Math.abs(mean - center);
      if (!best || score < best.score) best = { frets: fr, inv, score };
    }
  }
  return best;
}

/* Voice-leading-aware pick: minimize movement from the previous chord's grip */
function bestTriadNear(rootPc, quality, setIdx, win, prevMean) {
  const center = (win[0] + win[1]) / 2;
  let best = null;
  for (let inv = 0; inv < 3; inv++) {
    const base = triadVoicing(rootPc, quality, inv, setIdx);
    for (const off of [-12, 0, 12]) {
      const act = setIdx.map((s) => base[s] + off);
      if (Math.min(...act) < 0 || Math.max(...act) > 15) continue;
      const fr = [-1, -1, -1, -1, -1, -1];
      setIdx.forEach((s, i) => (fr[s] = act[i]));
      const mean = act.reduce((a, b) => a + b, 0) / act.length;
      const score = prevMean == null ? Math.abs(mean - center) : Math.abs(mean - prevMean) + 0.35 * Math.abs(mean - center);
      if (!best || score < best.score) best = { frets: fr, inv, mean, score };
    }
  }
  return best;
}

/* ---------------- Django progression drills ---------------- */
function ProgressionDrills() {
  const [live, setLive] = useState(null); // { p, i } — which chord is sounding
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const play = (pi) => {
    timers.current.forEach(clearTimeout);
    timers.current = [];
    const prog = DJANGO_PROGRESSIONS[pi];
    prog.seq.forEach((nm, i) => {
      const c = djangoVoicing(nm);
      strum(c.frets, false, i * 1.15);
      strum(c.frets, false, i * 1.15 + 0.56);
      timers.current.push(setTimeout(() => setLive({ p: pi, i }), i * 1150));
    });
    timers.current.push(setTimeout(() => setLive(null), prog.seq.length * 1150));

  return (
    <div>

        <div key={prog.name} className="card" style={{ marginBottom: 12 }}>

function VoiceLeadingDrill({ record, onLevelDone, hist }) {
  const [qi, setQi] = useState(() => rand(VL_CHALLENGES.length));
  const [result, setResult] = useState(null);
  const [picked, setPicked] = useState(null);
  const timer = useRef(null);
  const q = VL_CHALLENGES[qi];
  useEffect(() => () => clearTimeout(timer.current), []);
  const answer = (i) => {
    if (result) return;
    strum(q.options[i].frets);
    const ok = i === q.correct;
    setPicked(i);
    setResult(ok ? "right" : "wrong");
    record("chord", "c6", ok, null, null, onLevelDone);
    if (!ok) setTimeout(() => strum(q.options[q.correct].frets), 950);
    timer.current = setTimeout(() => {
      let n;
      do { n = rand(VL_CHALLENGES.length); } while (n === qi && VL_CHALLENGES.length > 1);

    }, ok ? 1700 : 3000);
  };
  return (
    <div className="card">
      <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.08em" }}>{q.context}</div>

/* ---------------- Chord Trainer ---------------- */
function ChordTrainer({ save, record, onLevelDone }) {
  const [tierIdx, setTierIdx] = useState(Math.min(save.chordUnlocked, CHORD_TIERS.length) - 1);
  const tier = CHORD_TIERS[tierIdx];
  const [q, setQ] = useState(null);
  const [choices, setChoices] = useState([]);
  const [result, setResult] = useState(null);
  const [streak, setStreak] = useState(0);
  const [sub, setSub] = useState("quiz"); // Django tier: quiz | prog | vl
  const timer = useRef(null);

  const answerKey = (c) => (tier.quiz === "name" ? c.name : tier.quiz === "shape" ? c.shape + " shape" : c.inv);

  const newQuestion = useCallback(() => {
    setResult(null);
    let c;
    let guard = 0;
    do { c = tier.chords[rand(tier.chords.length)]; guard++; } while (q && c === q && guard < 30);
    let opts;
    if (tier.quiz === "shape") opts = ["C shape", "A shape", "G shape", "E shape", "D shape"];
    else if (tier.quiz === "inversion") opts = ["Root position", "1st inversion", "2nd inversion"];
    else {
      const names = [...new Set(tier.chords.map((x) => x.name))].filter((n) => n !== c.name);
      opts = shuffle([c.name, ...shuffle(names).slice(0, 3)]);
    }
    setQ(c); setChoices(opts);
    setTimeout(() => strum(c.frets), 250);
  }, [tier, q]);

  useEffect(() => { setQ(null); setResult(null); setStreak(0); setSub("quiz"); }, [tierIdx]);
  useEffect(() => { if (!q) newQuestion(); }, [q, newQuestion]);
  useEffect(() => () => clearTimeout(timer.current), []);

  const answer = (opt) => {
    if (result || !q) return;
    const ok = opt === answerKey(q);
    setResult(ok ? "right" : "wrong");
    setStreak(ok ? streak + 1 : 0);
    record("chord", tier.id, ok, null, null, onLevelDone);

    timer.current = setTimeout(newQuestion, ok ? 1100 : 2100);

    tier.quiz === "shape" ? <>This is <b style={{ color: T.cream }}>{q?.name}</b> — which <b style={{ color: T.amber }}>CAGED shape</b> is it?</>

    : <>Name this chord</>;

  const hist = save.chordHist[tier.id] || [];

  return (
    <div>
      <LevelChips
        items={CHORD_TIERS.map((t, i) => ({ ...t, id: t.id, name: t.name }))}
        current={tier.id}

      <div style={{ fontSize: 13, color: T.faint, marginBottom: 10 }}>{tier.desc}</div>
      {tier.id === "c6" && (

          {[["quiz", "Name the chord"], ["prog", "Progressions"], ["vl", "Voice leading"]].map(([m, label]) => (

              style={{ padding: "7px 12px", borderRadius: 8, fontSize: 13, fontWeight: 600, border: `1.5px solid ${sub === m ? T.amber : T.line}`, background: sub === m ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream, cursor: "pointer" }}>
              {label}
            </button>
          ))}
        </div>
      )}
      {tier.id === "c6" && sub === "prog" ? (
        <ProgressionDrills />
      ) : tier.id === "c6" && sub === "vl" ? (

      <div className="card">
        {q && (

                    style={{ ...btnGhost, fontSize: 12, padding: "5px 10px", marginBottom: 6 }}>♪ Arpeggio</button>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

/* ---------------- Scale Explorer ---------------- */
function ScaleExplorer() {
  const [rootPc, setRootPc] = useState(0);
  const [scaleId, setScaleId] = useState("maj");
  const [shape, setShape] = useState("All");
  const [focus, setFocus] = useState(false);
  const scale = SCALES.find((s) => s.id === scaleId);

  const win = useMemo(() => {
    if (shape === "All") return [0, 12];
    return positionWindow(rootPc, scale.ivs, shape);
  }, [shape, rootPc, scale]);

  const dots = useMemo(() => {
    const out = [];
    for (let s = 0; s < 6; s++)
      for (let f = win[0]; f <= win[1]; f++) {
        const iv = (OPEN_PC[s] + f - rootPc + 1200) % 12;
        if (!scale.ivs.includes(iv)) continue;
        const chordTone = iv === 0 || iv === 3 || iv === 4 || iv === 7;
        out.push({
          s, f,
          color: chordTone ? IV_COLORS[iv].color : "#E4D6B8",
          text: chordTone ? IV_COLORS[iv].text : "#4A3524",
          label: DEGREE_LABEL[iv],
        });
      }
    return out;
  }, [scale, rootPc, win]);

  const playScale = () => {
    const seen = new Set();
    const seq = dots
      .map((d) => ({ ...d, fr: freqAt(d.s, d.f) }))
      .sort((a, b) => a.fr - b.fr)
      .filter((d) => { const k = Math.round(d.fr * 10); if (seen.has(k)) return false; seen.add(k); return true; });
    const start = seq.findIndex((d) => d.label === "R");
    const run = (start >= 0 ? seq.slice(start) : seq).slice(0, 17);
    run.forEach((d, i) => pluck(d.fr, i * 0.35, { gain: 0.38, dur: 1.0, damp: 0.985 }));
  };

  const chip = (active) => ({
    flexShrink: 0, padding: "7px 12px", borderRadius: 999, fontSize: 13, fontWeight: 700, cursor: "pointer",
    border: `1.5px solid ${active ? T.amber : T.line}`,
    background: active ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream,
  });

  return (
    <div>
      {!focus && (<>
      <div style={{ fontSize: 13, color: T.faint, marginBottom: 10 }}>
        Pick a root, a scale, and a CAGED position. Chord tones wear their colors — everything else is the connective tissue.
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {NOTES.map((n, i) => (
          <button key={n} className="chip" style={chip(rootPc === i)} onClick={() => setRootPc(i)}>{n}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
        {SCALES.map((s) => (
          <button key={s.id} className="chip" style={chip(scaleId === s.id)} onClick={() => setScaleId(s.id)}>{s.name}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
        {["All", "C", "A", "G", "E", "D"].map((sh) => (
          <button key={sh} className="chip" style={chip(shape === sh)} onClick={() => setShape(sh)}>
            {sh === "All" ? "Whole neck" : `${sh} shape`}
          </button>
        ))}
      </div>
      </>)}
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
          <div style={{ fontWeight: 800, fontSize: 17, fontFamily: "'Fraunces', Georgia, serif" }}>
            {NOTES[rootPc]} {scale.name}
            {shape !== "All" && <span style={{ color: T.amber }}> · {shape} shape</span>}
            {shape !== "All" && <span style={{ color: T.faint, fontWeight: 400, fontSize: 13 }}> (frets {win[0]}–{win[1]})</span>}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="chip" onClick={playScale} style={btnAmber}>▶ Play scale</button>
            <button className="chip" onClick={() => setFocus(!focus)} style={btnGhost}>{focus ? "⛶ Exit" : "⛶ Focus"}</button>
          </div>
        </div>
        <Fretboard frets={Math.max(12, win[1])} maxFret={Math.max(12, win[1])} dots={dots} onTap={(s, f) => pluck(freqAt(s, f), 0, { gain: 0.35 })} />
        {!focus && <IntervalLegend seventh={false} gray />}
      </div>
      {!focus && (
      <p style={{ fontSize: 12.5, color: T.faint, marginTop: 10 }}>
        Tap any position to hear it. Notice how the red roots and the chord shape from the Library sit inside each scale box — that's the whole CAGED idea.
      </p>
      )}
    </div>
  );
}

/* ---------------- Ear Trainer ---------------- */
function EarTrainer({ save, record, onLevelDone }) {
  const [levelId, setLevelId] = useState(EAR_LEVELS[Math.min(save.earUnlocked || 1, EAR_LEVELS.length) - 1].id);
  const level = EAR_LEVELS.find((l) => l.id === levelId);
  const [q, setQ] = useState(null);
  const [result, setResult] = useState(null);
  const [streak, setStreak] = useState(0);
  const [study, setStudy] = useState(false);
  const timer = useRef(null);

  const playQ = useCallback((qq) => {
    const t = qq || q;
    if (!t) return;
    if (level.kind === "interval") {
      pluck(t.root, 0, { gain: 0.42 });
      pluck(t.root * Math.pow(2, t.iv / 12), 0.8, { gain: 0.42 });
    } else if (level.kind === "descend") {
      pluck(t.root * Math.pow(2, t.iv / 12), 0, { gain: 0.42 });
      pluck(t.root, 0.8, { gain: 0.42 });
    } else if (level.kind === "harmonic") {
      pluck(t.root, 0, { gain: 0.38 });
      pluck(t.root * Math.pow(2, t.iv / 12), 0.02, { gain: 0.38 });
    } else if (level.kind === "chord") {
      CHORD_QUALITIES[t.quality].forEach((v, i) => pluck(t.root * Math.pow(2, v / 12), i * 0.05, { gain: 0.3 }));
    } else {
      t.chart.forEach((c, i) => { strum(c.frets, false, i * 0.95); strum(c.frets, false, i * 0.95 + 0.48); });
    }
  }, [q, level]);

  const newQuestion = useCallback(() => {
    setResult(null);
    let nq;
    if (level.kind === "interval" || level.kind === "harmonic" || level.kind === "descend") {
      let iv;
      do { iv = level.set[rand(level.set.length)]; } while (q && iv === q.iv && level.set.length > 1);
      nq = { iv, root: freqAt(1 + rand(3), rand(8)), answer: INTERVALS.find((x) => x.iv === iv).name };
    } else if (level.kind === "chord") {
      let quality;
      do { quality = level.set[rand(level.set.length)]; } while (q && quality === q.quality && level.set.length > 1);
      nq = { quality, root: freqAt(1 + rand(2), rand(8)), answer: quality };
    } else {
      let pid;
      do { pid = level.set[rand(level.set.length)]; } while (q && pid === q.pid && level.set.length > 1);
      const prog = PLAY_PROGRESSIONS.find((p) => p.id === pid);
      const keyPc = rand(12);
      const chart = prog.seq.map((rn) => {
        const [off, qual] = ROMAN[rn];
        return bestTriad((keyPc + off) % 12, qual, TRIAD_SETS["1–3"], [2, 9]);
      });
      nq = { pid, chart, answer: prog.name };
    }
    setQ(nq);
    setTimeout(() => playQ(nq), 350);
  }, [level, q, playQ]);

  useEffect(() => { setQ(null); setResult(null); setStreak(0); }, [levelId]);
  useEffect(() => { if (!q) newQuestion(); }, [q, newQuestion]);
  useEffect(() => () => clearTimeout(timer.current), []);

  const options =
    level.kind === "interval" || level.kind === "harmonic" || level.kind === "descend" ? level.set.map((iv) => INTERVALS.find((x) => x.iv === iv).name)
    : level.kind === "chord" ? level.set
    : level.set.map((pid) => PLAY_PROGRESSIONS.find((p) => p.id === pid).name);

  const answer = (opt) => {
    if (result || !q) return;
    const ok = opt === q.answer;
    setResult(ok ? "right" : "wrong");
    setStreak(ok ? streak + 1 : 0);
    record("ear", levelId, ok, null, null, onLevelDone);
    if (ok) playQ(); else { thud(); setTimeout(() => playQ(), 500); }
    const wait = level.kind === "prog" ? q.chart.length * 950 + 900 : ok ? 1500 : 2400;
    timer.current = setTimeout(newQuestion, wait);
  };

  const prompt =
    level.kind === "interval" ? "Two notes, low then high — what's the interval?"
    : level.kind === "descend" ? "Two notes, high then low — what's the interval?"
    : level.kind === "harmonic" ? "Two notes sounded together — what's the interval?"
    : level.kind === "chord" ? "One chord — what's its color?"
    : "Listen to the changes — which progression is it?";
  const hist = save.earHist[levelId] || [];
  const cols = level.kind === "interval" || level.kind === "harmonic" || level.kind === "descend" ? "repeat(auto-fill, minmax(105px, 1fr))" : level.kind === "chord" ? "1fr 1fr" : "1fr 1fr";

  return (
    <div>
      <LevelChips items={EAR_LEVELS} current={levelId} unlocked={save.earUnlocked || 1} doneMap={save.earDone || {}} onPick={setLevelId} />
      <div style={{ fontSize: 13, color: T.faint, marginBottom: 10 }}>{level.desc}</div>
      <div className="card">
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14, flexWrap: "wrap" }}>
          <button className="chip" style={{ ...btnAmber, fontSize: 15, padding: "12px 20px" }} onClick={() => playQ()}>🔊 Play again</button>
          <button className="chip" style={{ ...btnGhost, fontSize: 14, padding: "12px 16px" }} onClick={() => { clearTimeout(timer.current); newQuestion(); }}>Skip ▸</button>
          <div style={{ fontSize: 14.5, color: T.muted, flex: 1, minWidth: 160 }}>{prompt}</div>
          <div style={{ fontSize: 13, color: streak >= 3 ? T.amber : T.muted, fontWeight: 700 }}>{streak > 0 ? `🔥 ${streak}` : ""}</div>
        </div>
        {level.kind === "chord" && (
          <div style={{ marginBottom: 12 }}>
            <button className="chip" style={{ ...btnGhost, fontSize: 12.5, padding: "6px 12px" }} onClick={() => setStudy(!study)}>
              🎧 {study ? "Hide the colors" : "Study the colors"}
            </button>
            {study && (
              <>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                  {level.set.map((qual) => (
                    <button key={qual} className="chip"
                      onClick={() => {
                        const root = freqAt(1 + rand(2), rand(8));
                        CHORD_QUALITIES[qual].forEach((v, i) => pluck(root * Math.pow(2, v / 12), i * 0.05, { gain: 0.3 }));
                      }}
                      style={{ padding: "7px 12px", borderRadius: 8, fontSize: 12.5, fontWeight: 700, border: `1.5px solid ${T.line}`, background: T.surface, color: T.cream, cursor: "pointer" }}>
                      ▶ {qual}
                    </button>
                  ))}
                </div>
                <div style={{ fontSize: 12, color: T.faint, marginTop: 6 }}>
                  Each tap plays that color on a random root, so you can compare colors without it giving away the question.
                </div>
              </>
            )}
          </div>
        )}
        <div style={{ display: "grid", gridTemplateColumns: cols, gap: 8 }}>
          {options.map((opt) => (
            <button key={opt} className="ans" onClick={() => answer(opt)}
              style={{
                padding: "13px 6px", borderRadius: 10, fontSize: 14, fontWeight: 700, cursor: "pointer",
                border: `1.5px solid ${result && opt === q?.answer ? T.green : T.line}`,
                background: result && opt === q?.answer ? "rgba(139,184,113,0.18)" : T.raised, color: T.cream,
              }}>
              {opt}
            </button>
          ))}
        </div>
        <Feedback result={result} correctText={q ? q.answer : ""} />
        <MasteryBar hist={hist} />
      </div>
      <p style={{ fontSize: 12.5, color: T.faint, marginTop: 10 }}>
        Everything is played with the guitar voice in a random register, so you're learning the sound, not a fixed pitch. Correct answers replay the sound — let it sink in.
      </p>
    </div>
  );
}

/* ---------------- Play-Along chord charts ---------------- */
function PlayAlong({ save, bump }) {
  const [keyPc, setKeyPc] = useState(0);
  const [setName, setSetName] = useState("1–3");
  const [pos, setPos] = useState("Open");
  const [progId, setProgId] = useState("pop");
  const [bpm, setBpm] = useState(90);
  const [live, setLive] = useState(-1);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const prog = PLAY_PROGRESSIONS.find((p) => p.id === progId);
  const win = pos === "Open" ? [0, 4] : pos === "Middle" ? [4, 8] : [8, 12];
  const chart = useMemo(() => {
    let prevMean = null;
    return prog.seq.map((rn) => {
      const [off, qual] = ROMAN[rn];
      const rpc = (keyPc + off) % 12;
      const name = NOTES[rpc] + (qual === "min" ? "m" : "");
      if (pos === "Open" && OPEN_CHORDS[name]) {
        const frets = OPEN_CHORDS[name];
        const act = frets.filter((f) => f > 0);
        prevMean = act.length ? act.reduce((a, b) => a + b, 0) / act.length : 1;
        return { rn, name, frets, open: true };
      }
      if (pos === "Open" && LOW_BARRES[name]) {
        const frets = LOW_BARRES[name];
        const act = frets.filter((f) => f > 0);
        prevMean = act.length ? act.reduce((a, b) => a + b, 0) / act.length : 1;
        return { rn, name, frets, open: true };
      }
      if (pos === "Open" && LOW_BARRES[name]) {
        const frets = LOW_BARRES[name];
        const act = frets.filter((f) => f > 0);
        prevMean = act.reduce((a, b) => a + b, 0) / act.length;
        return { rn, name, frets, barre: true };
      }
      const best = bestTriadNear(rpc, qual, TRIAD_SETS[setName], win, prevMean);
      prevMean = best.mean;
      return { rn, name, ...best };
    });
  }, [prog, keyPc, setName, pos]);

  const stop = () => { timers.current.forEach(clearTimeout); timers.current = []; setLive(-1); };
  useEffect(() => { stop(); }, [keyPc, setName, pos, progId, bpm]);
  const [loop, setLoop] = useState(false);
  const loopRef = useRef(false); useEffect(() => { loopRef.current = loop; }, [loop]);
  const [jam, setJam] = useState(null);
  const jamDots = useMemo(() => {
    if (!jam) return [];
    const ivs = SCALES.find((s) => s.id === jam).ivs;
    const out = [];
    for (let s = 0; s < 6; s++)
      for (let f = 0; f <= 12; f++) {
        const iv = (OPEN_PC[s] + f - keyPc + 1200) % 12;
        if (!ivs.includes(iv)) continue;
        const ct = iv === 0 || iv === 3 || iv === 4 || iv === 7;
        out.push({ s, f, color: ct ? IV_COLORS[iv].color : "#E4D6B8", text: ct ? IV_COLORS[iv].text : "#4A3524", label: DEGREE_LABEL[iv] });
      }
    return out;
  }, [jam, keyPc]);
  const playPass = () => {
    const dur = 240 / bpm;
    chart.forEach((c, i) => {
      strum(c.frets, false, i * dur);
      strum(c.frets, false, i * dur + dur / 2);
      timers.current.push(setTimeout(() => setLive(i), i * dur * 1000));
    });
    timers.current.push(setTimeout(() => { if (loopRef.current) playPass(); else setLive(-1); }, chart.length * dur * 1000));
  };
  const play = () => { stop(); playPass(); };

  const chip = (active) => ({
    flexShrink: 0, padding: "7px 12px", borderRadius: 999, fontSize: 13, fontWeight: 700, cursor: "pointer",
    border: `1.5px solid ${active ? T.amber : T.line}`,
    background: active ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream,
  });
  const reps = (save.practice || {})[progId] || 0;

  return (
    <div>
      <div style={{ fontSize: 13, color: T.faint, marginBottom: 10 }}>
        Pick a progression, key, string set, and neck position — Fretwork chooses the closest inversion for every chord so your hand stays put. Strum along, then log a rep.
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {PLAY_PROGRESSIONS.map((p) => (
          <button key={p.id} className="chip" style={chip(progId === p.id)} onClick={() => setProgId(p.id)}>{p.name}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {NOTES.map((n, i) => (
          <button key={n} className="chip" style={chip(keyPc === i)} onClick={() => setKeyPc(i)}>{n}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
        {Object.keys(TRIAD_SETS).map((sn) => (
          <button key={sn} className="chip" style={chip(setName === sn)} onClick={() => setSetName(sn)}>Strings {sn}</button>
        ))}
        <span style={{ width: 8 }} />
        {["Open", "Middle", "Upper"].map((p) => (
          <button key={p} className="chip" style={chip(pos === p)} onClick={() => setPos(p)}>{p}</button>
        ))}
        <span style={{ width: 8 }} />
        {[60, 90, 120].map((b) => (
          <button key={b} className="chip" style={chip(bpm === b)} onClick={() => setBpm(b)}>{b} bpm</button>
        ))}
      </div>
      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, gap: 8, flexWrap: "wrap" }}>
          <div>
            <div style={{ fontWeight: 800, fontSize: 17, fontFamily: "'Fraunces', Georgia, serif" }}>
              {prog.name} in {NOTES[keyPc]} <span style={{ color: T.faint, fontWeight: 400, fontSize: 13 }}>· {pos} position, strings {setName}</span>
            </div>
            <div style={{ fontSize: 12.5, color: T.faint }}>{prog.hint}</div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="chip" style={btnAmber} onClick={play}>▶ Play</button>
            <button className="chip" style={loop ? { ...btnGhost, borderColor: T.amber, color: T.amber } : btnGhost} onClick={() => setLoop(!loop)}>⟳ Loop</button>
            <button className="chip" style={btnGhost} onClick={stop}>■ Stop</button>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginTop: 10 }}>
          {chart.map((c, i) => (
            <div key={i} onClick={() => strum(c.frets)}
              style={{
                cursor: "pointer", textAlign: "center", background: T.raised, borderRadius: 10, padding: "4px 6px",
                border: `2px solid ${live === i ? T.amber : T.line}`, transition: "border-color .15s",
              }}>
              <div style={{ fontSize: 13, fontWeight: 800 }}>{c.name} <span style={{ color: T.faint, fontWeight: 400, fontSize: 10.5 }}>{c.rn}</span></div>
              <ChordDiagram frets={c.frets} size={86} label={c.name} rootPc={rootPcOf(c.name)} />
              <div style={{ fontSize: 10.5, color: T.amber, paddingBottom: 3 }}>{c.open ? "open chord" : c.barre ? "barre" : INV_NAMES[c.inv]}</div>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 14 }}>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
            <span style={{ fontSize: 12.5, color: T.muted, fontWeight: 700 }}>Jam scale:</span>
            <button className="chip" style={chip(jam === null)} onClick={() => setJam(null)}>Hide</button>
            {[["majp", "Major Pent"], ["minp", "Minor Pent"], ["maj", "Major"], ["blues", "Blues"]].map(([id, label]) => (
              <button key={id} className="chip" style={chip(jam === id)} onClick={() => setJam(id)}>{label}</button>
            ))}
          </div>
          {jam && (
            <>
              <Fretboard frets={12} maxFret={12} dots={jamDots} onTap={(s, f) => pluck(freqAt(s, f), 0, { gain: 0.35 })} />
              <div style={{ fontSize: 11.5, color: T.faint, marginTop: 4 }}>
                {NOTES[keyPc]} {SCALES.find((s) => s.id === jam).name} across the neck — turn on Loop and improvise over the changes.
              </div>
            </>
          )}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 14, flexWrap: "wrap" }}>
          <button className="chip" style={btnGhost} onClick={() => bump(progId)}>☑ Mark practiced</button>
          <span style={{ fontSize: 13, color: reps > 0 ? T.green : T.faint, fontWeight: 700 }}>
            {reps > 0 ? `Practiced ${reps}×` : "Not practiced yet"}
          </span>
        </div>
      </div>
      <p style={{ fontSize: 12.5, color: T.faint, marginTop: 10 }}>
        Try the same progression in all three positions — notice how the inversions trade places but the chords stay within a few frets.
      </p>
    </div>
  );
}

/* ---------------- Drill clock: shared metronome + rotating timer ---------------- */
function useDrillClock(bpm, secs, onAdvance) {
  const [running, setRunning] = useState(false);
  const [remaining, setRemaining] = useState(secs);
  const bpmRef = useRef(bpm); useEffect(() => { bpmRef.current = bpm; }, [bpm]);
  const secsRef = useRef(secs); useEffect(() => { secsRef.current = secs; if (!running) setRemaining(secs); }, [secs, running]);
  const advRef = useRef(onAdvance); useEffect(() => { advRef.current = onAdvance; });
  const beatRef = useRef(0), nextRef = useRef(0), schedRef = useRef(null), deadlineRef = useRef(0), tickRef = useRef(null);
  const scheduler = () => {
    const ctx = audioCtx();
    if (!ctx) return;
    while (nextRef.current < ctx.currentTime + 0.12) {
      click(nextRef.current, beatRef.current % 4 === 0);
      nextRef.current += 60 / bpmRef.current;
      beatRef.current++;
    }
    schedRef.current = setTimeout(scheduler, 30);
  };
  const start = () => {
    const ctx = audioCtx();
    if (!ctx) return;
    setRunning(true);
    beatRef.current = 0;
    nextRef.current = ctx.currentTime + 0.1;
    scheduler();
    deadlineRef.current = Date.now() + secsRef.current * 1000;
    setRemaining(secsRef.current);
    tickRef.current = setInterval(() => {
      const rem = (deadlineRef.current - Date.now()) / 1000;
      if (rem <= 0) {
        advRef.current();
        pluck(1318.5, 0, { gain: 0.4, dur: 0.5 });
        pluck(1760, 0.13, { gain: 0.4, dur: 0.6 });
        deadlineRef.current = Date.now() + secsRef.current * 1000;
        setRemaining(secsRef.current);
      } else setRemaining(rem);
    }, 150);
  };
  const stop = () => { setRunning(false); clearTimeout(schedRef.current); clearInterval(tickRef.current); };
  useEffect(() => () => { clearTimeout(schedRef.current); clearInterval(tickRef.current); }, []);
  return { running, remaining, start, stop };
}
const drillChip = (active) => ({
  flexShrink: 0, padding: "7px 12px", borderRadius: 999, fontSize: 12.5, fontWeight: 700, cursor: "pointer",
  border: `1.5px solid ${active ? T.amber : T.line}`,
  background: active ? "rgba(233,161,59,0.16)" : T.surface, color: T.cream,
});
function TimerBar({ remaining, secs, label = "next pattern in" }) {

      </div>

  );
}
function DrillControls({ bpm, setBpm, secs, setSecs, rounds, setRounds, extra }) {

          ))}

/* ---------------- Chromatic warm-up ---------------- */
function ChromaticWarmup() {
  const PAIRS = ["1–2", "1–3", "1–4", "2–3", "2–4", "3–4", "2–1", "3–1", "4–1", "3–2", "4–2", "4–3"];
  const [bpm, setBpm] = useState(60);
  const [secs, setSecs] = useState(30);
  const [mode, setMode] = useState("seq");
  const modeRef = useRef(mode); useEffect(() => { modeRef.current = mode; }, [mode]);
  const [idx, setIdx] = useState(0);
  const [rounds, setRounds] = useState(0);
  const [roundNum, setRoundNum] = useState(0);
  const [sessionDone, setSessionDone] = useState(false);
  const stopRef = useRef(() => {});
  const nextPattern = () => setIdx((prev) => {
    if (modeRef.current === "seq") return (prev + 1) % PAIRS.length;
    let n; do { n = rand(PAIRS.length); } while (n === prev);
    return n;
  });
  const advance = () => {
    const nr = roundNum + 1;
    setRoundNum(nr);
    if (rounds > 0 && nr >= rounds) {
      setSessionDone(true);
      [0, 4, 7, 12].forEach((iv, i) => pluck(261.63 * Math.pow(2, iv / 12), 0.3 + i * 0.12, { gain: 0.32, dur: 1.4 }));
      stopRef.current();
      return;
    }
    nextPattern();
  };
  const { running, remaining, start, stop } = useDrillClock(bpm, secs, advance);
  stopRef.current = stop;
  const begin = () => { setRoundNum(0); setSessionDone(false); start(); };

  return (
    <div className="card" style={{ marginBottom: 14 }}>
      <div style={{ fontWeight: 800, fontSize: 17, fontFamily: "'Fraunces', Georgia, serif", marginBottom: 4 }}>Chromatic Warm-up</div>
      <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 12 }}>
        Play the pair on every string, down and back, then shift up a fret and repeat. When the chime rings, switch pairs without stopping. Comfortable? Flip to Random and roam the neck.
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap", marginBottom: 12 }}>
        <div style={{ textAlign: "center", minWidth: 130 }}>
          <div style={{ fontSize: 64, fontWeight: 800, fontFamily: "'Fraunces', Georgia, serif", color: T.amber, lineHeight: 1 }}>{PAIRS[idx]}</div>
          <div style={{ fontSize: 11.5, color: T.faint, marginTop: 4 }}>{mode === "seq" ? `pattern ${idx + 1} of ${PAIRS.length}` : "random pattern"}</div>
        </div>
        <div style={{ flex: 1, minWidth: 180 }}>
          <TimerBar remaining={remaining} secs={secs} label={rounds > 0 ? `round ${Math.min(roundNum + 1, rounds)} of ${rounds} · next in` : "next pattern in"} />
          {sessionDone && <div style={{ color: T.green, fontWeight: 800, fontSize: 13, marginTop: 6 }}>Session complete — nice work 🎸</div>}
          <div style={{ display: "flex", gap: 8, marginTop: 12, alignItems: "center", flexWrap: "wrap" }}>
            <button className="chip" style={running ? btnGhost : btnAmber} onClick={running ? stop : begin}>
              {running ? "■ Stop" : "▶ Start warm-up"}
            </button>
            <button className="chip" style={btnGhost} onClick={nextPattern}>Skip ▸</button>
          </div>
        </div>
      </div>
      <DrillControls bpm={bpm} setBpm={setBpm} secs={secs} setSecs={setSecs} rounds={rounds} setRounds={setRounds}
        extra={<>
          <span style={{ width: 10 }} />
          {[["seq", "Sequential"], ["rand", "Random"]].map(([m, label]) => (
            <button key={m} className="chip" style={drillChip(mode === m)} onClick={() => setMode(m)}>{label}</button>
          ))}
        </>}
      />
    </div>
  );
}

/* ---------------- CAGED & 3:2 scale-form drill ---------------- */
const CAGED_ORDER = ["C", "A", "G", "E", "D"];
/* 3:2 patterns: per-string fret offsets relative to the root's low-E fret */
const P32_MIN = [
  [[-2, 0], [-2, 0, 2], [0, 2], [0, 2, 4], [3, 5], [3, 5, 7]],
  [[3, 5, 7], [5, 7], [5, 7, 9], [7, 9], [8, 10, 12], [10, 12]],
];
const P32_MAJ = [
  [[-5, -3], [-5, -3, -1], [-3, -1], [-3, -1, 1], [0, 2], [0, 2, 4]],
  [[0, 2, 4], [2, 4], [2, 4, 6], [4, 6], [5, 7, 9], [7, 9]],
];
const DRILL_PREFS = { formId: "cmaj", rootPc: 0, bpm: 70, secs: 10 };
const DRILL_FORMS = [
  { id: "cmaj", name: "CAGED Major", type: "caged", scale: "maj" },
  { id: "cmin", name: "CAGED Minor", type: "caged", scale: "nmin" },
  { id: "cmajp", name: "CAGED Maj Pent", type: "caged", scale: "majp" },
  { id: "cminp", name: "CAGED Min Pent", type: "caged", scale: "minp" },
  { id: "cblues", name: "CAGED Blues", type: "caged", scale: "blues" },
  { id: "32maj", name: "3:2 Major Pent", type: "32", patterns: P32_MAJ },
  { id: "32min", name: "3:2 Minor Pent", type: "32", patterns: P32_MIN },
  { id: "amaj", name: "Arp: Major", type: "caged", ivs: [0, 4, 7], arp: true },
  { id: "amin", name: "Arp: Minor", type: "caged", ivs: [0, 3, 7], arp: true },
  { id: "adom", name: "Arp: Dom 7", type: "caged", ivs: [0, 4, 7, 10], arp: true },
];
function ScaleFormDrill({ formId, setFormId }) {
  const form = DRILL_FORMS.find((f) => f.id === formId);
  const [rootPc, setRootPc] = useState(DRILL_PREFS.rootPc);
  const [bpm, setBpm] = useState(DRILL_PREFS.bpm);
  const [secs, setSecs] = useState(DRILL_PREFS.secs);
  useEffect(() => { DRILL_PREFS.rootPc = rootPc; DRILL_PREFS.bpm = bpm; DRILL_PREFS.secs = secs; }, [rootPc, bpm, secs]);
  const [pos, setPos] = useState(0);
  const [focus, setFocus] = useState(false);
  const [sessionDone, setSessionDone] = useState(false);
  const nPos = form.type === "caged" ? 5 : 2;
  const skipResetRef = useRef(false);
  useEffect(() => { if (skipResetRef.current) { skipResetRef.current = false; return; } setPos(0); }, [formId]);
  const stopRef = useRef(() => {});
  /* One continuous circuit: every position of a form, then the next form. */
  const advance = () => {
    const n = form.type === "caged" ? 5 : 2;
    if (pos + 1 < n) { setPos(pos + 1); return; }
    const fi = DRILL_FORMS.findIndex((f) => f.id === formId);
    if (fi + 1 >= DRILL_FORMS.length) {
      setSessionDone(true);
      [0, 4, 7, 12].forEach((iv, i) => pluck(261.63 * Math.pow(2, iv / 12), 0.3 + i * 0.12, { gain: 0.32, dur: 1.4 }));
      stopRef.current();
      skipResetRef.current = true;
      setFormId(DRILL_FORMS[0].id);
      setPos(0);
      return;
    }
    skipResetRef.current = true;
    setFormId(DRILL_FORMS[fi + 1].id);
    setPos(0);
  };
  const { running, remaining, start, stop } = useDrillClock(bpm, secs, advance);
  stopRef.current = stop;
  const begin = () => { setSessionDone(false); start(); };

  const { dots, numFrets, posLabel } = useMemo(() => {
    const mkDot = (s, f) => {
      const iv = (OPEN_PC[s] + f - rootPc + 1200) % 12;
      const ct = iv === 0 || iv === 3 || iv === 4 || iv === 7 || (form.arp && (iv === 10 || iv === 11));
      return { s, f, iv, color: ct ? IV_COLORS[iv].color : "#E4D6B8", text: ct ? IV_COLORS[iv].text : "#4A3524", label: DEGREE_LABEL[iv] };
    };
    if (form.type === "caged") {
      const shape = CAGED_ORDER[pos % 5];
      const ivs = form.ivs || SCALES.find((s) => s.id === form.scale).ivs;
      const win = positionWindow(rootPc, ivs, shape, form.arp ? 1 : 2);
      const out = [];
      for (let s = 0; s < 6; s++)
        for (let f = win[0]; f <= win[1]; f++) {
          const iv = (OPEN_PC[s] + f - rootPc + 1200) % 12;
          if (ivs.includes(iv)) out.push(mkDot(s, f));
        }
      return { dots: out, numFrets: Math.max(12, win[1]), posLabel: `${shape} shape · ${(pos % 5) + 1} of 5 · frets ${win[0]}–${win[1]}` };
    }
    const f6 = (rootPc - OPEN_PC[0] + 12) % 12;
    const pat = form.patterns[pos % 2];
    /* Prefer the lowest placement; dropping a few off-the-nut notes beats
       shoving the whole pattern up an octave. Full patterns win only when
       they sit comfortably low (max fret <= 17). */
    let best = null;
    for (const o of [-12, 0, 12]) {
      let kept = 0, dropped = 0, hi = 0;
      pat.forEach((str) => str.forEach((x) => {
        const f = f6 + x + o;
        if (f < 0 || f > 19) dropped++;
        else { kept++; hi = Math.max(hi, f); }
      }));
      if (kept < 9) continue;
      const cand = { o, hi, dropped };
      const isFullLow = (c) => c.dropped === 0 && c.hi <= 17;
      if (!best) { best = cand; continue; }
      if (isFullLow(cand) !== isFullLow(best)) { if (isFullLow(cand)) best = cand; continue; }
      if (cand.hi !== best.hi) { if (cand.hi < best.hi) best = cand; continue; }
      if (cand.dropped < best.dropped) best = cand;
    }
    const o = best ? best.o : 0;
    const out = [];
    let mx = 12;
    pat.forEach((strOffsets, s) => {
      strOffsets.forEach((x) => {
        const f = f6 + x + o;
        if (f < 0 || f > 19) return;
        mx = Math.max(mx, f);
        out.push(mkDot(s, f));
      });
    });
    const partial = out.length < 15;
    return { dots: out, numFrets: Math.min(20, mx), posLabel: `Pattern ${(pos % 2) + 1} of 2${partial ? " · low partial" : ""}` };
  }, [form, rootPc, pos]);

  const [seq, setSeq] = useState("scale"); // scale | thirds | fourths | fifths | sixths
  const seqStep = { scale: 0, thirds: 2, fourths: 3, fifths: 4, sixths: 5 }[seq];
  const [pairIndex, setPairIndex] = useState(0);
  const [beatInBar, setBeatInBar] = useState(0);
  const pairClockRef = useRef(null);

  const sequencePairs = useMemo(() => {
    if (!seqStep || (form.scale !== "maj" && form.scale !== "nmin")) return [];
    const seen = new Set();
    const uniq = dots
      .map((d) => ({ ...d, pitch: OPEN_SEMIS[d.s] + d.f }))
      .sort((a, b) => a.pitch - b.pitch)
      .filter((d) => {
        if (seen.has(d.pitch)) return false;
        seen.add(d.pitch);
        return true;
      });
    const rootIndex = uniq.findIndex((d) => d.iv === 0);
    const run = rootIndex >= 0 ? uniq.slice(rootIndex) : uniq;
    const ascending = [];
    for (let i = 0; i + seqStep < run.length; i++) {
      ascending.push([run[i], run[i + seqStep]]);
    }
    if (ascending.length <= 1) return ascending;
    // Turn around at the top instead of jumping back to the root.
    // Do not repeat the top pair or bottom pair at the direction changes.
    const descending = ascending.slice(1, -1).reverse();
    return [...ascending, ...descending];
  }, [dots, seqStep, form.scale]);

  useEffect(() => {
    setPairIndex(0);
    setBeatInBar(0);
  }, [seq, formId, rootPc, pos]);

  useEffect(() => {
    clearInterval(pairClockRef.current);
    if (!running || !seqStep || sequencePairs.length === 0) return;
    const beatMs = 60000 / bpm;
    const started = Date.now();
    setBeatInBar(0);
    setPairIndex(0);
    pairClockRef.current = setInterval(() => {
      const elapsedBeats = Math.floor((Date.now() - started) / beatMs);
      const beat = elapsedBeats % 4;
      setBeatInBar(beat);
      setPairIndex(Math.floor(elapsedBeats / 2) % sequencePairs.length);
    }, Math.max(30, Math.min(100, beatMs / 5)));
    return () => clearInterval(pairClockRef.current);
  }, [running, bpm, seqStep, sequencePairs.length]);

  const activePair = seqStep > 0 && sequencePairs.length
    ? sequencePairs[pairIndex % sequencePairs.length]
    : [];
  const playRun = () => {
    const seen = new Set();
    const uniq = dots
      .map((d) => ({ ...d, fr: freqAt(d.s, d.f) }))
      .sort((a, b) => a.fr - b.fr)
      .filter((d) => { const k = Math.round(d.fr * 10); if (seen.has(k)) return false; seen.add(k); return true; });
    const si = uniq.findIndex((d) => d.label === "R");
    (si >= 0 ? uniq.slice(si) : uniq).slice(0, 17).forEach((d, i) => pluck(d.fr, i * 0.35, { gain: 0.38, dur: 1.0, damp: 0.985 }));
  };

  return (
    <div className="card" style={{ marginBottom: 14 }}>
      <div style={{ fontWeight: 800, fontSize: 17, fontFamily: "'Fraunces', Georgia, serif", marginBottom: 4 }}>Scale Form Drill</div>
      {!focus && (<>
      <div style={{ fontSize: 12.5, color: T.faint, marginBottom: 10 }}>
        The board shows one position at a time; at the chime the next appears. After a form’s last position it rolls into the next form automatically — one continuous circuit through every scale and arpeggio. Switch keys anytime.
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 8 }}>
        {DRILL_FORMS.map((f) => (
          <button key={f.id} className="chip" style={drillChip(formId === f.id)} onClick={() => setFormId(f.id)}>{f.name}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6, marginBottom: 10 }}>
        {NOTES.map((n, i) => (
          <button key={n} className="chip" style={drillChip(rootPc === i)} onClick={() => setRootPc(i)}>{n}</button>
        ))}
      </div>
      {(form.scale === "maj" || form.scale === "nmin") && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10, alignItems: "center" }}>
          <span style={{ fontSize: 12, color: T.faint }}>sequence view:</span>
          {[["scale", "None"], ["thirds", "Broken 3rds"], ["fourths", "Broken 4ths"], ["fifths", "Broken 5ths"], ["sixths", "Broken 6ths"]].map(([m, label]) => (
            <button key={m} className="chip" style={drillChip(seq === m)} onClick={() => setSeq(m)}>{label}</button>
          ))}
        </div>
      )}
      </>)}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
        <div>
          <span style={{ fontWeight: 800, fontSize: 16 }}>{NOTES[rootPc]} {form.name}</span>
          <span style={{ color: T.amber, fontWeight: 700, fontSize: 14 }}> · {posLabel}</span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="chip" style={running ? btnGhost : btnAmber} onClick={running ? stop : begin}>{running ? "■ Stop" : "▶ Start drill"}</button>
          <button className="chip" style={btnGhost} onClick={advance}>Skip ▸</button>
          <button className="chip" style={btnGhost} onClick={playRun}>♪ Hear it</button>
          <button className="chip" style={btnGhost} onClick={() => setFocus(!focus)}>{focus ? "⛶ Exit" : "⛶ Focus"}</button>
        </div>
      </div>
      <TimerBar remaining={remaining} secs={secs} />
      {sessionDone && <div style={{ color: T.green, fontWeight: 800, fontSize: 13, marginTop: 6 }}>Circuit complete — every form, every position 🎸</div>}
      <div style={{ marginTop: 10 }}>
        <Fretboard frets={numFrets} maxFret={numFrets} dots={dots} activePair={activePair} onTap={(s, f) => pluck(freqAt(s, f), 0, { gain: 0.35 })} />
      </div>
      {seqStep > 0 && (form.scale === "maj" || form.scale === "nmin") && activePair.length === 2 && (
        <div style={{ marginTop: 10, background: T.raised, border: `1px solid ${T.line}`, borderRadius: 12, padding: "10px 12px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: 11.5, color: T.faint, textTransform: "uppercase", letterSpacing: ".08em", fontWeight: 800 }}>
                {seq === "thirds" ? "Broken 3rds" : seq === "fourths" ? "Broken 4ths" : seq === "fifths" ? "Broken 5ths" : "Broken 6ths"}
              </div>
              <div style={{ fontSize: 20, fontWeight: 800, color: T.cream, marginTop: 2 }}>
                {activePair[0].label} <span style={{ color: T.amber }}>+</span> {activePair[1].label}
                <span style={{ fontSize: 13, color: T.muted, fontWeight: 600, marginLeft: 10 }}>
                  {noteAt(activePair[0].s, activePair[0].f)} + {noteAt(activePair[1].s, activePair[1].f)}
                </span>
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              {[0, 1, 2, 3].map((b) => (
                <span key={b} style={{
                  width: 30, height: 30, borderRadius: "50%", display: "inline-flex", alignItems: "center", justifyContent: "center",
                  background: beatInBar === b && running ? T.amber : T.surface,
                  color: beatInBar === b && running ? "#2A1C0B" : T.muted,
                  border: `1.5px solid ${beatInBar === b && running ? T.amber : T.line}`,
                  fontWeight: 800, fontSize: 13,
                }}>{b + 1}</span>
              ))}
            </div>
          </div>
          <div style={{ fontSize: 11.5, color: T.faint, marginTop: 7 }}>
            Both notes stay lit for two beats. The sequence climbs to the highest complete pair, then reverses naturally and comes back down.
          </div>
        </div>
      )}
      {!focus && (<>
      <IntervalLegend seventh={false} gray />
      <DrillControls bpm={bpm} setBpm={setBpm} secs={secs} setSecs={setSecs} />
      </>)}
    </div>
  );
}
